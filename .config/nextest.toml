# A `tutti-rt` test that spins (a block counter that was not re-armed, a gate
# that never closes) fails after a minute instead of hanging the run. The
# longest healthy test in the crate takes a few seconds.
[[profile.default.overrides]]
filter = 'package(tutti-rt)'
slow-timeout = { period = "30s", terminate-after = 2 }

# The sequencer has 64 dynamic client slots, and each `tutti-midi-hardware`
# test against it holds two to four of them (the watch's, its devices'), one of
# them (the reused-number repro) for six seconds. Parallel copies of the suite,
# as CI runners and a developer's other builds make, ran out (`snd_seq_open`
# ENOMEM). At most four of these tests run at once in a copy.
[test-groups]
sequencer = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(tutti-midi-hardware) and test(/backend::alsa::tests::/)'
test-group = 'sequencer'
