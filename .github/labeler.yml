# Area labels, from the files a pull request changes (actions/labeler).
"area: core":
  - changed-files:
      - any-glob-to-any-file:
          - crates/tutti-rt/**
          - crates/tutti-graph/**
          - crates/tutti-engine/**
          - crates/tutti-types/**
          - crates/tutti-transport/**
          - crates/tutti-tempo/**
          - crates/tutti-curve/**
          - crates/tutti-buffers/**
          - crates/tutti-metering/**
          - testing/tutti-shm-model/**
"area: session":
  - changed-files:
      - any-glob-to-any-file:
          - crates/tutti-session/**
          - crates/tutti/**
"area: midi":
  - changed-files:
      - any-glob-to-any-file:
          - crates/tutti-ump/**
          - crates/tutti-midi-*/**
          - crates/tutti-voicing/**
          - crates/tutti-alsa-ffi/**
          - crates/tutti-coremidi-ffi/**
          - crates/tutti-winmm-ffi/**
