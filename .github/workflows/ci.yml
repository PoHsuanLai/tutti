name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# Only a pull request cancels its own stale run; every push to main and merge group run completes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # CI builds from clean, so an incremental cache only costs time.
  CARGO_INCREMENTAL: 0
  # Line tables only: backtraces keep file:line, and full debug info filled the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

# Every stable job installs the toolchain `rust-toolchain.toml` pins, and every cargo command that resolves
# dependencies runs `--locked`, so a new lint or crate release lands only in the PR that moves it.
# Miri names its nightly, which overrides the file.

jobs:
  # The advisory DB is fetched fresh; a failed fetch fails the job. Pull requests run it only when the
  # dependencies change; every push to main runs it, which is where a new advisory against an unchanged lock shows.
  deny:
    name: cargo deny (advisories)
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories

  paths:
    name: canonical paths
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The submodule-pin gate reads `git submodule status`, which prefixes uninitialised submodules with `-`.
          submodules: recursive
      - run: rustup toolchain install
      # Cheapest checks first, so a failing pull request fails in a minute rather than after the workspace builds.
      - run: cargo fmt --all --check
      - run: cargo test --locked -p xtask
      # The compiler and clippy do not lint a redundant path, and doc comments in `text` blocks are never compiled,
      # so this scan is the only check.
      - run: cargo xtask check-paths
      # A private module already refuses a path in code; prose is the gap. A `text` block or `*.md` naming a module
      # path compiles and goes stale on a rename, so each crate with private modules is listed below.
      - run: cargo xtask check-paths tutti_graph arena builder command compile controls cost editor event exec fade fork graph held history instrument io kernels latency loss meter node par param plan play pool preroll reference slots spec tail tap time
      - run: cargo xtask check-paths tutti_session builder device error export graph instrument midi modulation node plugin session watch
      - run: cargo xtask check-paths tutti_ump cc_number decode encode field message midi1 midi_channel midi_group ump
      - run: cargo xtask check-paths tutti_midi_protocol midi1 narrow scale voice
      - run: cargo xtask check-paths tutti_midi_device id table
      # `test_support` is public and left out of the list.
      - run: cargo xtask check-paths tutti_midi_hardware backend capability devices endpoints error port session
      - run: cargo xtask check-paths tutti_plugin_db facts format fs pedal scanner table wire
      # `state_chunk` is public and left out of the list.
      - run: cargo xtask check-paths tutti_plugin_ipc batcher client config error ipc offline_wait process_guard protocol subprocess transport
      - run: cargo xtask check-paths tutti_plugin_ipc_ffi header mapping os
      - run: cargo xtask check-paths tutti_plugin_host control_handle controls listeners liveness meter node param_delivery param_input param_values render_mode segment_points transport_source transport_walk
      - run: cargo xtask check-paths tutti_dsp allpass buffer control convolver delay dither dynamics error fdn fdn_design fft filter geometry grid interp model network reverb reverb_design swept_delay waveshape window resample
      - run: cargo xtask check-paths tutti_measure align beat chord chroma features key loudness notes onset peaks pitch silence spectrum stereo tempo transform vectorscope xcorr yin
      - run: cargo xtask check-paths tutti_transport beat_walk clock fsm handle loop_region motion offline project_meter settings state timed timeline
      - run: cargo xtask check-paths tutti_metering load
      - run: cargo xtask check-paths tutti_engine engine error
      - run: cargo xtask check-paths tutti_codec aiff decode encoder error flac format pcm spec staged vorbis wav wave
      - run: cargo xtask check-paths tutti_sf2 bank binary_reader error four_cc generator generator_type instrument instrument_info instrument_region loop_mode preset preset_info preset_region read_counter sample_header soundfont soundfont_info soundfont_parameters soundfont_sampledata soundfont_version zone zone_info
      - run: cargo xtask check-paths tutti_soundfont array_math bi_quad_filter channel chorus envelope_stage error fork lfo modulation_envelope node oscillator patch player region_ex region_pair render reverb settings soundfont_math voice voices volume_envelope
      # `stretch` and `testing` are public and left out of the list.
      - run: cargo xtask check-paths tutti_sampler clip error lanes probe streamer voice
      - run: cargo xtask check-paths tutti_tempo error grid map point segment
      - run: cargo xtask check-paths tutti_curve envelope law
      - run: cargo xtask check-paths tutti_voicing controller holds phase voicing
      - run: cargo xtask check-paths tutti_rt cell denormals doorbell drain_clock edits job_gate level_cell packed_atomic pos_ring request_word scope seq_cell spin split task_graph vec
      # Compares the SDK version the prose states against the commits the superproject records; a bumped submodule
      # otherwise shows as an unexplained C++ error in `audio-probe`.
      - run: cargo xtask check-submodule-pins
      # No Bevy crate in `tutti-session`'s closure with every feature on, and no whole-crate re-export.
      - run: cargo xtask check-session
      - run: cargo xtask check-guards
      - run: cargo xtask check-ffi
      - run: cargo xtask check-errors
      # Includes `cargo tree` checks, such as that `export` alone reaches no C library.
      - run: cargo xtask check-layout
      - run: cargo xtask check-range-types
      - run: cargo xtask check-hosting
      - run: cargo xtask check-lints
      - run: cargo xtask check-value-traits
      - run: cargo xtask check-doc-refs
      - run: cargo xtask check-pointers
      - run: cargo xtask check-doc-idents
      - run: cargo xtask check-passive-tests
      - run: cargo xtask check-comments
      - run: cargo xtask check-alloc-binaries
      - run: cargo xtask check-platform-seam
      # The source of the locked `clap-sys` is fetched, not built, for the CLAP rows.
      - run: cargo fetch --locked
      - run: cargo xtask check-conformance
        env:
          TUTTI_CONFORMANCE: require
      - run: cargo xtask package

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Without the VST3 SDK submodules `tutti-vst3-host` cannot build its `audio-probe` plugin.
          submodules: recursive
      - name: Install Linux audio deps
        uses: ./.github/actions/linux-audio-deps
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # One format at a time: a helper or match that only the other formats use is dead here,
      # and the all-formats run cannot see it.
      - name: clippy (plugin server, one format)
        run: |
          for f in vst3 clap; do
            cargo clippy --locked -p tutti-plugin-server --no-default-features --features "$f" --all-targets -- -D warnings
          done
          for f in vst2 vst3 clap; do
            cargo clippy --locked -p tutti-plugin-probe --no-default-features --features "$f" --all-targets -- -D warnings
          done

  # Lints what the Linux job cannot see: `#[cfg(windows)]` blocks, and casts that differ by platform (the vst3
  # bindings type SDK enum constants `c_uint` on unix and `c_int` on Windows). A native runner, because
  # `cargo xtask check-windows` cannot reach `ogg_next_sys` or `tutti-vst3-host`'s `conformance` build, which need
  # real MSVC headers. Nothing runs tests here.
  clippy-windows:
    name: clippy (windows)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The workspace run unifies features and leaves `tutti-plugin`'s format features dark.
      # `au` is macOS-only and compiles to nothing here.
      - name: Plugin formats
        shell: bash
        run: |
          cargo clippy --locked -p tutti-plugin --features clap,vst3,vst2,serde --all-targets -- -D warnings
          cargo clippy --locked -p tutti-plugin-db --features serde --all-targets -- -D warnings
          cargo clippy --locked -p tutti-clap-ffi --lib -- -D warnings
      # WASAPI capture, which the `features` job lints only on Linux.
      - name: Device features
        run: cargo clippy --locked -p tutti-cpal --features capture --all-targets -- -D warnings

  # Every AU crate is macOS-only, so the Linux and Windows jobs compile it to nothing. Lints only: the AU
  # suites need installed audio units and run locally.
  clippy-macos:
    name: clippy (macos)
    needs: changes
    if: needs.changes.outputs.macos == 'true' && needs.changes.outputs.full == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p tutti-au-ffi -p tutti-au-host --all-targets -- -D warnings
      - run: cargo clippy --locked -p tutti-coremidi-ffi -p tutti-midi-hardware --all-targets -- -D warnings
      # The editor loader's AU arm is compiled only here.
      - run: cargo clippy --locked -p tutti-plugin --features au --lib -- -D warnings
      # AU alone: the one-format loop in `clippy` runs on Linux, where the AU row is empty. `--lib` because the
      # server's dev-dependency `tutti-vst3-host` builds the VST3 SDK, which this job does not check out.
      - run: cargo clippy --locked -p tutti-plugin-server --no-default-features --features au --lib -- -D warnings

  # Not a required check: it finds out whether the shared plugin loads on a Windows runner.
  contract-windows:
    name: plugin contract (windows)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      # The VST3 shells and the C++ plugin build against the SDK submodules.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked -p tutti-plugin-contract

  features:
    name: dark features
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    env:
      TUTTI_GOLDEN: require
    steps:
      # The VST3 SDK: `tutti-plugin-contract` builds its VST3 shells and the C++ plugin against it.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Linux audio deps
        uses: ./.github/actions/linux-audio-deps
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest

      # Feature combinations no other job compiles: nothing in the workspace turns on `capture`, `audio-io` or the
      # codec and plugin-format features, so the clippy and test jobs never see them. Not `--all-features`, which
      # pulls every plugin-format SDK: name each combination, and add one when a feature is added.
      # `tutti-midi-hardware/sequencer-tests` is linted here and run only locally (`cargo xtask test-features`): it
      # needs the kernel's `snd-seq` module, which the runner lacks.
      - name: Lint
        run: |
          cargo clippy --locked -p tutti-cpal --features capture --all-targets -- -D warnings
          cargo clippy --locked -p tutti-session --features audio-io --all-targets -- -D warnings
          cargo clippy --locked -p tutti-session --features clap,export,modulation,midi-hardware,synth,soundfont,sampler,vst2,device,audio-io,serde --all-targets -- -D warnings
          cargo clippy --locked -p tutti --features clap,export,modulation,sampler,dsp,midi-hardware,synth --all-targets -- -D warnings
          cargo clippy --locked -p tutti --features audio-io --all-targets -- -D warnings
          cargo clippy --locked -p tutti --no-default-features --features io --all-targets -- -D warnings
          cargo clippy --locked -p tutti-export --lib -- -D warnings
          cargo clippy --locked -p tutti-session --lib --features export,encode-flac,encode-aiff,encode-vorbis -- -D warnings
          cargo clippy --locked -p tutti-session --lib --features vst3,au -- -D warnings
          cargo clippy --locked -p tutti --features device,soundfont,decode-wav,decode-flac,decode-mp3,decode-ogg,export,encode-flac,encode-aiff,encode-vorbis --all-targets -- -D warnings
          cargo clippy --locked -p tutti-sampler --lib -- -D warnings
          cargo clippy --locked -p tutti-sampler --lib --features decode-wav,decode-flac,decode-mp3,decode-ogg -- -D warnings
          cargo clippy --locked -p tutti-plugin --features vst3,au,serde --all-targets -- -D warnings
          cargo clippy --locked -p tutti-codec --all-targets -- -D warnings
          cargo clippy --locked -p tutti-codec --features encode-wav --all-targets -- -D warnings
          cargo clippy --locked -p tutti-codec --features encode-aiff --all-targets -- -D warnings
          cargo clippy --locked -p tutti-codec --features encode-flac --all-targets -- -D warnings
          cargo clippy --locked -p tutti-codec --features encode-vorbis --all-targets -- -D warnings
          cargo clippy --locked -p tutti-codec --lib --features decode-wav -- -D warnings
          cargo clippy --locked -p tutti-codec --lib --features decode-flac -- -D warnings
          cargo clippy --locked -p tutti-codec --lib --features decode-mp3 -- -D warnings
          cargo clippy --locked -p tutti-codec --lib --features decode-ogg -- -D warnings
          cargo clippy --locked -p tutti-codec --all-features --all-targets -- -D warnings
          cargo clippy --locked -p tutti-ump --features serde --all-targets -- -D warnings
          cargo clippy --locked -p tutti-midi-protocol --features serde --all-targets -- -D warnings
          cargo clippy --locked -p tutti-midi-device --features serde --all-targets -- -D warnings
          cargo clippy --locked -p tutti-tempo --features serde --all-targets -- -D warnings
          cargo clippy --locked -p tutti-dsp --lib -- -D warnings
          cargo clippy --locked -p tutti-dsp --lib --features contract -- -D warnings
          cargo clippy --locked -p tutti-plugin-types --lib --features contract -- -D warnings
          cargo clippy --locked -p tutti-midi-hardware --features sequencer-tests --all-targets -- -D warnings
          cargo clippy --locked -p tutti-clap-ffi --lib -- -D warnings
          cargo clippy --locked -p tutti-plugin --features clap,vst2,serde --all-targets -- -D warnings
          cargo clippy --locked -p tutti-plugin-db --features serde --all-targets -- -D warnings
          cargo clippy --locked -p tutti-plugin-contract --features server --all-targets -- -D warnings

      - name: no_std build
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo xtask check-no-std

      # `plugin-server` cannot be a dev-dependency (a cycle through `tutti-plugin`), so the tests that spawn it
      # need it built first. No `au`: it is macOS-only.
      - name: Build plugin-server (tutti-session/clap, tutti/clap and the plugin contract spawn it)
        run: |
          cargo build --locked -p tutti-plugin-server --no-default-features --features clap,vst3
          cargo build --locked -p tutti-plugin-probe

      - name: Test
        run: |
          cargo nextest run --locked -p tutti-cpal --features capture
          cargo nextest run --locked -p tutti-session --features audio-io
          cargo nextest run --locked -p tutti-session --features clap,export,modulation,midi-hardware,synth,soundfont,sampler,vst2,device,audio-io,serde
          cargo nextest run --locked -p tutti --features clap,export,modulation,sampler,dsp,midi-hardware,synth
          cargo nextest run --locked -p tutti --features audio-io
          cargo nextest run --locked -p tutti --no-default-features --features io
          cargo nextest run --locked -p tutti-session --features export,encode-flac,encode-aiff,encode-vorbis
          cargo nextest run --locked -p tutti-codec
          cargo nextest run --locked -p tutti-codec --features encode-wav
          cargo nextest run --locked -p tutti-codec --features encode-aiff
          cargo nextest run --locked -p tutti-codec --features encode-flac
          cargo nextest run --locked -p tutti-codec --features encode-vorbis
          cargo nextest run --locked -p tutti-codec --all-features
          # Named so `tests/messages/serde.rs` runs even when no other member turns the feature on.
          cargo nextest run --locked -p tutti-ump --features serde
          cargo nextest run --locked -p tutti-midi-protocol --features serde
          cargo nextest run --locked -p tutti-midi-device --features serde
          cargo nextest run --locked -p tutti-tempo --features serde
          cargo nextest run --locked -p tutti-plugin-types --features testing
          cargo nextest run --locked -p tutti-plugin-db --features serde
          cargo nextest run --locked -p tutti-plugin-contract --features server

      # JACK hard-links libjack at build time, so it has its own step and apt package. `AudioHost::Jack` exists
      # on every platform, so only the Linux build reaches the real code.
      - name: Install JACK headers
        uses: ./.github/actions/linux-audio-deps
        with:
          extra: libjack-jackd2-dev
      - name: Lint JACK
        run: cargo clippy --locked -p tutti-cpal --features jack --all-targets -- -D warnings

      # Driven at real callback pacing against the reference CLAP probe, with `plugin-server` built first (see above).
      # These pace to a 1.333 ms block and spawn up to 8 subprocesses; if that is too much for a shared runner,
      # reduce the instance count rather than add `continue-on-error`.
      - name: Build plugin-server and plugin-probe
        run: |
          cargo build --locked -p tutti-plugin-server
          cargo build --locked -p tutti-plugin-probe
      - name: tutti-plugin suites (CLAP, in-process VST2) and the bridge under pressure
        run: cargo nextest run --locked -p tutti-plugin --features clap,vst2,serde

  # Each benchmark runs once (`--test`) to prove the harness builds and runs; nothing is timed or compared,
  # because shared runners swing too much for a threshold. The perf gate is `tutti-engine/tests/alloc_budget.rs`:
  # allocation counts do not depend on the machine. Push to main only, since this is a full release build.
  bench-smoke:
    name: bench smoke
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Linux audio deps
        uses: ./.github/actions/linux-audio-deps
      - run: rustup toolchain install
      # No Rust cache: push-only and release-profile, so it would hold 260 MB for one rarely-run job.
      # Named targets, because a bare `cargo bench` also runs test targets in release, where `debug_assert!` is gone
      # and a `#[should_panic]` over one fails. Keep in step with `cargo xtask bench`.
      - run: |
          cargo bench --locked -p tutti-nodes     --bench engine_render  -- --test
          cargo bench --locked -p tutti-graph     --bench graph_render   -- --test
          cargo bench --locked -p tutti-cpal      --bench audio_callback -- --test
          cargo bench --locked -p tutti-export    --bench offline_render -- --test
          cargo bench --locked -p tutti-polysynth --bench polysynth      -- --test
          cargo bench --locked -p tutti-ump       --bench codec          -- --test
          cargo bench --locked -p tutti-midi-runtime --bench clip_node -- --test
          cargo bench --locked -p tutti-sampler   --bench voice_pool     -- --test
          cargo bench --locked -p tutti-plugin-host --bench vst2_in_process -- --test

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test_os) }}
    # Golden digests are glibc libm's on 24.04; 26.04's libm moves them. `require` fails a Linux runner on any
    # other glibc instead of skipping.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    env:
      TUTTI_GOLDEN: ${{ matrix.os == 'ubuntu-latest' && 'require' || '' }}
      # Optimized dependencies with debug assertions still on: the suite is CPU-bound.
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Linux audio deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-audio-deps
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per OS for `test` and `test-more`; `test` writes it.
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest

      # Before the test run: several `tutti-plugin` suites spawn this binary, and it cannot be a dev-dependency
      # (a cycle). A missing binary fails those suites rather than skipping them.
      - name: Build plugin-server and plugin-probe (three plugin-host suites spawn the server)
        run: |
          cargo build --locked -p tutti-plugin-server
          cargo build --locked -p tutti-plugin-probe

      # nextest runs each test in its own process; the audio suites touch device and global state.
      # `au_gui_lifecycle_main` is a `harness = false` main that answers nextest's list protocol.
      - name: Test
        shell: bash
        run: |
          cargo nextest run --locked --workspace --no-fail-fast

      # The `plugin` suite is feature-gated and the dark-features job is Linux-only; its timing and file naming differ on macOS.
      - name: tutti-session plugin suite (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo nextest run --locked -p tutti-session \
            --features clap,export,modulation,device,midi,sampler,vst2 \
            -E 'binary(plugin)'

  # Split from `test` so the two run on separate runners and overlap; same env and profile.
  test-more:
    name: test (${{ matrix.os }}, editor + release + doctests)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test_more_os) }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    env:
      TUTTI_GOLDEN: ${{ matrix.os == 'ubuntu-latest' && 'require' || '' }}
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Linux audio deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-audio-deps
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - uses: taiki-e/install-action@nextest

      # Some of these properties exist only with `debug_assertions` off: `tutti-graph`'s executor guards assert in
      # debug and render silence in release.
      - name: Test tutti-types, tutti-rt and tutti-graph (release)
        run: cargo nextest run --locked --release -p tutti-types -p tutti-rt -p tutti-graph

      # nextest does not run doctests and does not say so; these are the only tests of the `///` examples.
      - name: Doctests
        run: cargo test --locked --doc --workspace
      # A workspace run does not turn on the features behind `tutti-session`'s doctests, so every feature is named.
      - name: Doctests (tutti-session, all features)
        run: cargo test --locked --doc -p tutti-session --all-features

  doc:
    name: rustdoc
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Linux audio deps
        uses: ./.github/actions/linux-audio-deps
      # JACK too: `--all-features` below turns on `tutti-cpal/jack`, whose build script wants the headers.
      - name: Install JACK headers
        uses: ./.github/actions/linux-audio-deps
        with:
          extra: libjack-jackd2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Intra-doc link lints are denied workspace-wide but only rustdoc enforces them. `--document-private-items`
      # catches links that break only in a private item.
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings --document-private-items
      # Both umbrellas with every feature, JACK included (the one feature `check-doc-features` leaves out).
      - run: cargo doc --locked -p tutti-session -p tutti --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings --document-private-items
      # Every member with its features together, then each umbrella feature alone: a workspace build documents only
      # what some member's edge enables. The lists come from the manifests.
      - run: cargo xtask check-doc-features
      # The docs.rs build: nightly with `--cfg docsrs`. A dated nightly, bumped by hand, so a new rustdoc lint cannot
      # turn CI red; named with `+` because `rust-toolchain.toml` pins stable.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-14
      - run: cargo +nightly-2026-10-14 doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs

  # The Linux job compiles the AU, CoreMIDI and macOS plugin paths to nothing, so a broken intra-doc link in them
  # is invisible there. Submodules: `tutti-vst3-host`'s build script wants the VST3 SDK.
  doc-macos:
    name: rustdoc (macos)
    needs: changes
    if: needs.changes.outputs.macos_main == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings --document-private-items

  # Miri over `tutti-rt`'s `unsafe`: most other `unsafe` is a C ABI miri does not execute, and `arc-lend` runs its
  # own miri and loom in its CI. Its own job because it needs nightly and is slow.
  miri:
    name: miri (tutti-rt)
    needs: changes
    # `tutti-rt` depends on no other workspace crate, so the `loom` filter covers what miri reads.
    if: needs.changes.outputs.loom == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    # About 10 minutes on main; a hang fails here, not at GitHub's cap. Slow pure-arithmetic tests shrink under `cfg!(miri)`.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # `tutti-rt` needs no ALSA headers, but cargo resolves the whole workspace first.
      - uses: ./.github/actions/linux-audio-deps
      # `+nightly` on each command: `rust-toolchain.toml` overrides the default this action sets.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Register tests in `denormals.rs` are ignored under miri (no x86 SSE intrinsics) and report as skipped. So are
      # two in `rt/parked.rs`: they are quadratic and run past the timeout, and the native run covers the debug-only
      # check they test.
      - run: cargo +nightly miri test --locked -p tutti-rt --lib
      # 16 seeds: one seed explores one interleaving.
      - run: cargo +nightly miri test --locked -p tutti-rt --lib edits
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..16

  # What changed, read once for the jobs that can skip. A skipped job passes in `CI result`. A pull request is
  # diffed against its base, a merge group against its queue entry's base; a push to main and a manual run
  # always run everything.
  #
  # `code`: false when every change is prose nothing compiles (top-level `docs/`, or a root `*.md`). A crate's
  # README is pulled in by `include_str!`, so it counts as code. `canonical paths` still runs for prose.
  # `loom`: the change can affect a loom model: `tutti-rt`, `tutti-shm-model`, the lock, the toolchain or this file.
  # `macos`: the change touches code that differs on macOS. It gates `clippy (macos)` and the macOS `test`;
  # `macos_main` (editor, release and doctest runs, macOS rustdoc) is for pushes only.
  # `deps`: a manifest, the lock, `deny.toml`, the toolchain or this file changed, which is what `cargo deny` reads.
  # `full`: false on a pull request, which runs the light set (static gates, Linux clippy, the Linux `test`,
  # rustdoc, `cargo deny` when `deps`); the merge group and the push run the rest. `cargo xtask check-windows`
  # and `check-features` run locally what a pull request skips.
  changes:
    name: what changed?
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      loom: ${{ steps.diff.outputs.loom }}
      macos: ${{ steps.diff.outputs.macos }}
      macos_main: ${{ steps.diff.outputs.macos_main }}
      test_os: ${{ steps.diff.outputs.test_os }}
      test_more_os: ${{ steps.diff.outputs.test_more_os }}
      deps: ${{ steps.diff.outputs.deps }}
      full: ${{ steps.diff.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "merge_group" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "loom=true" >> "$GITHUB_OUTPUT"
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "macos_main=true" >> "$GITHUB_OUTPUT"
            echo 'test_os=["ubuntu-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
            echo 'test_more_os=["ubuntu-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
            echo "deps=true" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request runs the light set; its merge group runs the rest.
          if [ "$EVENT" = "pull_request" ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
          # HEAD is the pull request's merge commit, or the merge group's head.
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          if echo "$changed" | grep -qvE '^(docs/.*|[^/]+\.md)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(crates/tutti-rt/|testing/tutti-shm-model/|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "loom=true" >> "$GITHUB_OUTPUT"
          else
            echo "loom=false" >> "$GITHUB_OUTPUT"
          fi
          # The editor, release and doctest runs and the macOS rustdoc are for pushes only: Linux runs the same tests,
          # and `clippy (macos)` lints what only macOS compiles.
          echo "macos_main=false" >> "$GITHUB_OUTPUT"
          echo 'test_more_os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          if echo "$changed" | grep -qE '^(Cargo\.(toml|lock)|deny\.toml|rust-toolchain\.toml|\.github/workflows/ci\.yml)$|/Cargo\.toml$'; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "deps=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(crates/(tutti-rt|tutti-cpal|tutti-midi-hardware|tutti-coremidi-ffi|tutti-au-[a-z]+|tutti-vst2-[a-z]+|tutti-vst3-[a-z]+|tutti-clap-[a-z]+|tutti-plugin[a-z-]*)/|crates/tutti-session/(src|tests)/plugin|testing/tutti-(shared-plugin[a-z0-9-]*|clap-test-plugin|vst2-[a-z]+|vst2-test-plugin|plugin-contract|fixtures)/|vendor/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            if [ "$EVENT" = "pull_request" ]; then
              echo 'test_os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            else
              echo 'test_os=["ubuntu-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
            echo 'test_os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  loom:
    name: loom (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.loom == 'true' && needs.changes.outputs.full == 'true'
    # Three runners: `pos_ring_loom` and `doorbell_loom` were most of the runtime. Every model runs, at the same
    # bound, in exactly one group. Release builds, since loom explores every interleaving in-process; `--cfg loom`
    # is global, so each model builds for its own target, never the workspace.
    strategy:
      fail-fast: false
      matrix:
        group: [pos_ring, doorbell, rest]
    runs-on: ubuntu-24.04
    # About 12 minutes; a model that stops terminating fails here.
    timeout-minutes: 25
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - uses: actions/checkout@v7
      # Neither crate needs ALSA headers, but cargo resolves the whole workspace first.
      - uses: ./.github/actions/linux-audio-deps
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for the loom jobs; `rest` writes it.
          shared-key: loom
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.group == 'rest' }}
      # `--cfg loom` changes constants the lints see, and no other job compiles that configuration.
      - if: matrix.group == 'rest'
        run: cargo clippy --locked -p tutti-rt -p tutti-shm-model --all-targets -- -D warnings
      # Nine models, about five minutes at this bound.
      - if: matrix.group == 'pos_ring'
        run: cargo test --locked -p tutti-rt --release --test pos_ring_loom
        env:
          LOOM_MAX_PREEMPTIONS: 4
      - if: matrix.group == 'rest'
        run: cargo test --locked -p tutti-rt --release --test packed_atomic_loom
      - if: matrix.group == 'rest'
        run: cargo test --locked -p tutti-rt --release --test seq_cell_loom
      - if: matrix.group == 'rest'
        run: cargo test --locked -p tutti-rt --release --test cell_loom
      - if: matrix.group == 'rest'
        run: cargo test --locked -p tutti-rt --release --test handoff_loom -- --nocapture
      # Unbounded (about 45 s): the variant its model guards against needs 4 preemptions.
      - if: matrix.group == 'doorbell'
        run: cargo test --locked -p tutti-rt --release --test doorbell_loom
      - if: matrix.group == 'rest'
        run: cargo test --locked -p tutti-shm-model --release

  # The parallel executor's primitives (`SplitMut`/`SplitRw`, `JobGate`, `TaskGraph`) against the shipped code.
  # Its own job so neither loom job nears its timeout.
  loom-parallel:
    name: loom (parallel executor)
    needs: changes
    if: needs.changes.outputs.loom == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: --cfg loom
      LOOM_MAX_PREEMPTIONS: 3
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-audio-deps
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: loom
          save-if: false
      - run: cargo test --locked -p tutti-rt --release --test split_loom
      - run: cargo test --locked -p tutti-rt --release --test job_gate_loom
      - run: cargo test --locked -p tutti-rt --release --test task_graph_loom
      - run: cargo test --locked -p tutti-rt --release --test request_word_loom
      - run: cargo test --locked -p tutti-rt --release --test dirty_set_loom
      - run: cargo test --locked -p tutti-rt --release --test edit_ring_loom
      - run: cargo test --locked -p tutti-rt --release --test level_cell_loom
      - run: cargo test --locked -p tutti-rt --release --test drain_clock_loom -- --nocapture
      - run: cargo test --locked -p tutti-rt --release --test fault_latch_loom -- --nocapture
      - run: cargo test --locked -p tutti-rt --release --test wake_flag_loom

  # The one check the merge queue requires: it passes when every other job succeeded or was skipped.
  # A job added to this file is added to `needs`.
  result:
    name: CI result
    if: always()
    needs:
      - deny
      - paths
      - clippy
      - clippy-windows
      - clippy-macos
      - contract-windows
      - features
      - bench-smoke
      - test
      - test-more
      - doc
      - doc-macos
      - miri
      - changes
      - loom
      - loom-parallel
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
