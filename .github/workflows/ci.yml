# CI for the tutti audio engine.
#
# This replaces the workflow the engine carried as a subtree of the dawai app
# repo, which had rotted unnoticed for the whole time it sat there unrun: it
# named `tutti-midi` and `tutti-units` (split and renamed in 786a4c24 and
# 91bb7540) and carried a `no_std` job for a property deliberately dropped in
# 679a8433. A workflow that names crates which no longer exist does not fail —
# it just stops testing anything, which is why nothing reported it.
#
# Four things here are load-bearing and are documented at their step:
# the plugin-server prebuild, doctests, the Bevy-free floor, and the path gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fewer codegen units keeps CI RAM in check on the large fundsp/Bevy graph.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  paths:
    name: canonical paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # For the submodule-pin gate below, which reads `git submodule
          # status`. A checkout without them still prints the recorded SHAs,
          # but prefixed `-` for uninitialised, so the gate would report the
          # checkout rather than the pin on every run.
          submodules: recursive
      # Engine types are imported from a crate's root or prelude, never through
      # its modules. Neither rustc nor clippy has a lint for a redundant path,
      # and doc comments in ```text / ```ignore blocks are never compiled — so
      # this grep is the only enforcement there is.
      - run: scripts/check-canonical-paths.sh
      # `tutti-graph` keeps every module private, so rustc already refuses
      # `tutti_graph::plan::Plan` in code. Prose is the gap: a ```text block
      # or a *.md naming a module path compiles fine and goes stale the moment
      # a module is renamed. The per-module gate covers it.
      - run: scripts/check-canonical-paths.sh tutti_graph arena builder command compile editor event exec fade fork io kernels legacy node param plan reference spec time
      # The vendored VST3 SDK is three Steinberg submodules, documented as
      # pinned at v3.8.0_build_66 in .gitmodules, in CLAUDE.md and in
      # tutti-vst3-host's build.rs. Prose cannot notice a submodule bump moving
      # the tree out from under it, and a silently changed SDK surfaces as an
      # unexplained C++ compile error in `audio-probe` rather than as a version
      # complaint — so this compares those three statements against the commits
      # the superproject actually records. It belongs in this job because it is
      # the other static gate: no toolchain, no build, just a claim checked.
      - run: scripts/check-submodule-pins.sh

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The VST3 SDK is three submodules; without them tutti-vst3-host
          # cannot build its `audio-probe` reference plugin.
          submodules: recursive
      - name: Install Linux audio deps
        run: |
          sudo apt-get update
          # libasound2-dev:    tutti-cpal (ALSA).
          # libdbus-1-dev:     cpal -> audio_thread_priority -> dbus, the
          #                    RT-priority request on Linux.
          # libfontconfig1-dev: plotters -> font-kit -> fontconfig. NOT from
          #                    criterion, which declares plotters with
          #                    `default-features = false` (verified in 0.5.1
          #                    and 0.8.2) and so never enables the `ttf`
          #                    feature font-kit sits behind. The edge is
          #                    fundsp-tutti's own bare `plotters = "0.3.7"`
          #                    dev-dep, which feature-unifies across every
          #                    plotters consumer. `cargo tree -i font-kit`
          #                    prints criterion first, which is what made the
          #                    earlier version of this comment wrong.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The two vendored forks are excluded: they are third-party code we do not
      # restyle, and they carry pre-existing lint debt that is not ours to pay.
      - run: cargo clippy --workspace --all-targets --exclude fundsp-tutti --exclude rustysynth-tutti -- -D warnings

  # The same lint, on Windows. The `clippy` job above cannot see a
  # `#[cfg(windows)]` block, and it cannot see a cast that is load-bearing on
  # one platform and a no-op on the other: the vst3 bindings type every SDK
  # enum constant as `c_uint` on unix and `c_int` on Windows, so
  # `kAudio as i32` passes Linux clippy and fails `unnecessary_cast` here. The
  # test job's Windows leg compiles this code but does not lint it.
  #
  # A native runner rather than a cross-check from ubuntu. The cross-check
  # (`just check-windows`) reaches the plugin crates, but not the workspace:
  # `ogg_next_sys` needs real Windows C headers, and `tutti-vst3-host`'s
  # `conformance` feature compiles and links the `audio-probe` DLL against the
  # SDK's Win32 sources, which only an MSVC toolchain can do. Here `cc` finds
  # MSVC, so no clang/stub workaround is needed.
  clippy-windows:
    name: clippy (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Workspace
        run: cargo clippy --workspace --all-targets --exclude fundsp-tutti --exclude rustysynth-tutti -- -D warnings
      # The workspace run builds each crate with the features the workspace
      # unifies to, which leaves tutti-plugin's format features and
      # clap-extras dark. `au` is macOS-only and compiles to nothing here.
      - name: Plugin formats
        shell: bash
        run: |
          cargo clippy -p tutti-plugin --features clap,vst3,vst2,json --all-targets -- -D warnings
          cargo clippy -p tutti-clap-host --features clap-extras --all-targets -- -D warnings
      # WASAPI capture and the MIDI arms of the callback, which the `features`
      # job lints only on Linux.
      - name: Device features
        run: cargo clippy -p tutti-cpal --features capture,midi --all-targets -- -D warnings

  features:
    name: dark features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Feature-gated code that no other job compiles.
      #
      # `cargo tree --workspace -e features -i tutti-cpal` reports only
      # "default": nothing in this workspace turns `capture`, `midi` or
      # `audio-io` on, so the clippy and test jobs above typecheck none of them.
      # That is the same hole the Windows cross-check exists to close, and for
      # the same reason — a cfg block nothing compiles is a cfg block nothing
      # lints, and it rots in silence.
      #
      # What was dark until this job existed:
      #   tutti-cpal/capture  — all of src/mic.rs (MicIn, the capture ring)
      #   tutti-cpal/midi     — the pre_block/post_block arms of process_audio
      #   bevy-tutti/audio-io — tests/audio_io_pump.rs, 12 tests that had
      #                         never once run in this repo
      #   bevy-tutti/soundfont — tests/midi_soundfont.rs (implies `midi`); its
      #                         5 tests looked for the .sf2 at the pre-extraction
      #                         `crates/tutti/assets/` path and failed on every
      #                         run, which no run ever made
      #   bevy-tutti/sampler  — src/sampler (the WaveAsset loader, the voice
      #                         components) and its tests
      #   tutti-io/bevy       — WaveAsset's Asset derive
      #   bevy-tutti/plugin   — src/plugin_host's binding against a live plugin:
      #                         tests/plugin_capture.rs loads the reference CLAP
      #                         plugin through a real plugin-server and is the
      #                         only test that watches the latency poll see one.
      #                         `full,plugin` so the modulation-gated param
      #                         binding compiles with it.
      #
      # Not `--all-features`: that pulls every plugin-format SDK. Name the
      # combinations, and add one here whenever a new feature is added.
      - name: Lint
        run: |
          cargo clippy -p tutti-cpal --features capture --all-targets -- -D warnings
          cargo clippy -p tutti-cpal --features midi --all-targets -- -D warnings
          cargo clippy -p tutti-cpal --features capture,midi --all-targets -- -D warnings
          cargo clippy -p bevy-tutti --features audio-io --all-targets -- -D warnings
          cargo clippy -p bevy-tutti --features soundfont --all-targets -- -D warnings
          cargo clippy -p bevy-tutti --features sampler --all-targets -- -D warnings
          cargo clippy -p bevy-tutti --features full,plugin --all-targets -- -D warnings
          cargo clippy -p tutti-io --features bevy --all-targets -- -D warnings

      # `tests/plugin_capture.rs` spawns the `plugin-server` binary, which no
      # test build produces (it would be a dependency cycle through
      # `tutti-plugin`), so it is built here, before the tests, as the `test`
      # job does. CLAP only: that is the format the reference plugin is, and the
      # default features would pull the VST3 SDK submodules this checkout does
      # not fetch.
      - name: Build plugin-server (bevy-tutti/plugin spawns it)
        run: cargo build -p tutti-plugin-server --no-default-features --features clap

      - name: Test
        run: |
          cargo nextest run -p tutti-cpal --features capture,midi
          cargo nextest run -p bevy-tutti --features audio-io
          cargo nextest run -p bevy-tutti --features soundfont
          cargo nextest run -p bevy-tutti --features sampler
          cargo nextest run -p bevy-tutti --features full,plugin
          cargo nextest run -p tutti-io --features bevy

      # JACK hard-links libjack at build time, so it gets its own step (and its
      # own apt package) rather than joining the list above. `AudioHost::Jack`
      # exists on every platform and answers `Error::HostUnavailable` where it
      # cannot be served, so only the Linux build reaches the real code — which
      # is precisely why it needs compiling somewhere.
      - name: Install JACK headers
        run: sudo apt-get install -y --no-install-recommends libjack-jackd2-dev
      - name: Lint JACK
        run: cargo clippy -p tutti-cpal --features jack --all-targets -- -D warnings

      # The out-of-process plugin bridge, driven at real callback pacing. This
      # belongs in *this* job because it was dark in exactly the same way: the
      # whole suite was `#[ignore]`d for needing third-party plugins installed,
      # and `EFFECTS` names macOS system paths, so the only harness measuring
      # the bridge ran on no machine anywhere. It now falls back to the
      # reference CLAP probe, which cargo builds as a dev-dependency.
      #
      # `plugin-server` first: the suite spawns it, and it cannot be a
      # dev-dependency because `tutti-plugin-server` depends on `tutti-plugin`
      # and the edge would be a cycle. Nothing else in a test run builds it.
      #
      # These pace themselves to a 1.333 ms block and spawn up to 8
      # subprocesses. If that proves too much for a shared runner, the honest
      # fix is to reduce the instance count here with the failure recorded —
      # not `continue-on-error`, which is how the pre-extraction workflow died.
      - name: Build plugin-server
        run: cargo build -p tutti-plugin-server
      - name: Out-of-process plugin bridge under pressure
        run: cargo nextest run -p tutti-plugin --features clap --test real_plugin_pressure

  # Benchmarks: proved to RUN, never compared.
  #
  # GitHub's runners are shared and swing 30-50% on this workload, and the
  # engine's own profile_stretch_clone documents an 81x spread on a QUIET
  # machine. A timing threshold here would flap, and a flapping gate gets
  # `continue-on-error: true` within a month and then tests nothing — the same
  # death the pre-extraction workflow died. So this job runs every benchmark
  # exactly once (`--test`) to prove the harnesses still work against the
  # current API, and compares nothing.
  #
  # The real perf gate is `tutti-core/tests/alloc_budget.rs`, which runs in the
  # ordinary test job: allocation counts are machine-independent, so a budget
  # on them survives a noisy vCPU.
  #
  # Not on `pull_request`: this is a full release build of the workspace.
  bench-smoke:
    name: bench smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Named targets, not a sweep: a bare `cargo bench` (and `--benches`)
      # also runs the test targets in the release profile, where
      # `debug_assert!` is gone and a `#[should_panic]` over one fails.
      # Mirrors `just bench`; adding a bench means adding a line in both.
      - run: |
          cargo bench -p tutti-nodes     --bench engine_render  -- --test
          cargo bench -p tutti-cpal      --bench audio_callback -- --test
          cargo bench -p tutti-export    --bench offline_render -- --test
          cargo bench -p tutti-polysynth --bench polysynth      -- --test
          cargo bench -p tutti-sampler   --bench voice_pool     -- --test
          cargo bench -p tutti-plugin --features vst2 --bench vst2_in_process -- --test

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux audio deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libasound2-dev:    tutti-cpal (ALSA).
          # libdbus-1-dev:     cpal -> audio_thread_priority -> dbus, the
          #                    RT-priority request on Linux.
          # libfontconfig1-dev: plotters -> font-kit -> fontconfig. NOT from
          #                    criterion, which declares plotters with
          #                    `default-features = false` (verified in 0.5.1
          #                    and 0.8.2) and so never enables the `ttf`
          #                    feature font-kit sits behind. The edge is
          #                    fundsp-tutti's own bare `plotters = "0.3.7"`
          #                    dev-dep, which feature-unifies across every
          #                    plotters consumer. `cargo tree -i font-kit`
          #                    prints criterion first, which is what made the
          #                    earlier version of this comment wrong.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # MUST come before the test run. `tutti-plugin`'s clap_pdc_alignment,
      # clap_crash_recovery and real_stall_tests drive the reference CLAP plugin
      # through a real out-of-process host, so they spawn this binary. It cannot
      # be a dev-dependency that cargo would build for them — tutti-plugin-server
      # depends on tutti-plugin, so the edge would be a dependency *cycle* — and
      # nothing else in a test run builds it. Skipping it makes those three
      # suites hard-fail rather than silently skip, which is deliberate: a suite
      # that skips on a missing fixture is one typo away from reporting success
      # having executed nothing.
      - name: Build plugin-server (three plugin-host suites spawn it)
        run: cargo build -p tutti-plugin-server

      # nextest, not `cargo test`: each test gets its own process, which is what
      # the audio suites need — they touch device and global state, and a panic
      # or abort in one no longer takes the whole binary's results with it.
      #
      # The two GUI-lifecycle binaries are excluded because they are `harness =
      # false` custom mains that drive a plugin editor on the real main thread.
      # nextest enumerates a binary by running it with `--list --format terse`;
      # these ignore the flag, run their whole suite, and exit non-zero, so
      # nextest fails at *list* time having already executed them. They are run
      # below under the libtest-free runner they were written for.
      # Two exclusions, for opposite reasons.
      #
      # The GUI-lifecycle binaries are `harness = false` custom mains that drive
      # a plugin editor on the real main thread. nextest enumerates a binary by
      # running it with `--list --format terse`; these ignore the flag, execute
      # their whole suite and exit non-zero, so nextest fails at *list* time
      # having already run them. They are run below under the runner they were
      # written for.
      #
      # `no_installed_third_party_unit_implements_the_mapping_family` is not
      # broken — it is doing precisely what it was built to do. It asserts a
      # claim about *installed* third-party Audio Units, and panics with
      # "this test asserted nothing. Install one of [...] or accept that the
      # claim is untested here" when none is present. A hosted runner is
      # permanently that case, so on CI the test can only ever fail. Excluding
      # it here does not weaken it: on a developer machine with those plugins it
      # still runs and still asserts, which is the only place it ever could.
      - name: Test
        # `shell: bash` is load-bearing on Windows. The default there is
        # PowerShell, which does not take `\` as a line continuation — it ran
        # `cargo nextest run ...` and `-E '...'` as two separate commands, and
        # the first reported "no tests to run" because the filter never reached
        # it. Every runner in this matrix has bash.
        shell: bash
        run: |
          cargo nextest run --workspace --no-fail-fast \
            -E 'not binary(gui_lifecycle_main) and not binary(au_gui_lifecycle_main) and not test(no_installed_third_party_unit_implements_the_mapping_family)'

      # The custom-harness editor tests. `cargo test` just execs the binary,
      # which is exactly what a `harness = false` main wants.
      # `has_editor_agrees_with_opening_one` is skipped for the same reason the
      # AU mapping-family test is excluded above: it asserts agreement across a
      # corpus that must contain both an editor-bearing and an editorless
      # plugin, and deliberately panics rather than report a pass that a
      # constant `true` would satisfy. A hosted runner has no third-party
      # plugins, so it can only ever fail there. The skip is announced in the
      # harness output, and naming a case that does not exist is an error.
      - name: Editor-lifecycle tests (custom harness)
        shell: bash
        env:
          TUTTI_GUI_SKIP: has_editor_agrees_with_opening_one
        run: |
          cargo test -p tutti-vst3-host --test gui_lifecycle_main
          cargo test -p tutti-au-host --test au_gui_lifecycle_main

      # nextest does NOT run doctests, and says nothing about skipping them.
      # That is not a rounding error here: these are the only tests covering the
      # `///` examples, so a green nextest run is not a green workspace.
      - name: Doctests
        run: cargo test --doc --workspace

  bevy-free:
    name: Bevy-free floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio deps
        run: |
          sudo apt-get update
          # libasound2-dev:    tutti-cpal (ALSA).
          # libdbus-1-dev:     cpal -> audio_thread_priority -> dbus, the
          #                    RT-priority request on Linux.
          # libfontconfig1-dev: plotters -> font-kit -> fontconfig. NOT from
          #                    criterion, which declares plotters with
          #                    `default-features = false` (verified in 0.5.1
          #                    and 0.8.2) and so never enables the `ttf`
          #                    feature font-kit sits behind. The edge is
          #                    fundsp-tutti's own bare `plotters = "0.3.7"`
          #                    dev-dep, which feature-unifies across every
          #                    plotters consumer. `cargo tree -i font-kit`
          #                    prints criterion first, which is what made the
          #                    earlier version of this comment wrong.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The engine must stay usable without Bevy. `--no-default-features` does
      # NOT test that — `bevy` is already off by default on every engine crate,
      # so that flag drops the codec and midi features instead and proves
      # nothing. Naming the feature explicitly is what tests both sides.
      - run: cargo check -p tutti-core
      - run: cargo check -p tutti-core --features bevy
      - run: cargo check -p tutti-types
      - run: cargo check -p tutti-types --features bevy

      # The Bevy-free facade, and the assertion a compile cannot make.
      # `cargo check` proves the crate builds; it says nothing about what came
      # in with it. This is a NEGATIVE dependency check: no bevy crate may
      # appear anywhere under `tutti`, at any depth, with everything on. The
      # repo has no other guarantee of that shape.
      #
      # `-e normal`, not `-e all`: `bevy-tutti` is a workspace member, so a
      # dev-dependency walk would false-positive.
      - run: cargo check -p tutti
      - run: cargo check -p tutti --features full
      - name: No bevy under the facade
        run: |
          if cargo tree -p tutti --features full -e normal | grep -nE '\bbevy(_[a-z]+)?\b'; then
            echo "FAIL: a bevy crate reached the Bevy-free facade."
            exit 1
          fi

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux audio deps
        run: |
          sudo apt-get update
          # libasound2-dev:    tutti-cpal (ALSA).
          # libdbus-1-dev:     cpal -> audio_thread_priority -> dbus, the
          #                    RT-priority request on Linux.
          # libfontconfig1-dev: plotters -> font-kit -> fontconfig. NOT from
          #                    criterion, which declares plotters with
          #                    `default-features = false` (verified in 0.5.1
          #                    and 0.8.2) and so never enables the `ttf`
          #                    feature font-kit sits behind. The edge is
          #                    fundsp-tutti's own bare `plotters = "0.3.7"`
          #                    dev-dep, which feature-unifies across every
          #                    plotters consumer. `cargo tree -i font-kit`
          #                    prints criterion first, which is what made the
          #                    earlier version of this comment wrong.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The workspace sets broken_intra_doc_links and private_intra_doc_links to
      # deny; this is where that is actually enforced, since a plain build never
      # runs rustdoc.
      - run: cargo doc --workspace --no-deps --exclude fundsp-tutti --exclude rustysynth-tutti
        env:
          RUSTDOCFLAGS: -D warnings
      # `tutti_graph::contract` (doc 013 §6's harness) is behind the
      # off-by-default `contract` feature, which only dev-dependencies turn on
      # — and rustdoc builds none, so the line above never documents it. The
      # tests and clippy (`--all-targets`) do reach it.
      - run: cargo doc -p tutti-graph --no-deps --features contract
        env:
          RUSTDOCFLAGS: -D warnings
      # bevy-tutti gates most of its surface behind features (`full`, and
      # `plugin`, which `full` leaves out), so the workspace line above
      # documents little of it: two broken links sat there unseen.
      - run: cargo doc -p bevy-tutti --no-deps --features full,plugin
        env:
          RUSTDOCFLAGS: -D warnings

  # Miri over the non-FFI `unsafe`. See docs/design/012-unsafe-policy.md for
  # why these two crates and not the rest: ~95% of this repo's `unsafe` is a C
  # ABI, which miri does not execute at all, and out-of-process hosting is the
  # structural answer there instead. What is left is seven sites, and the
  # three that matter are the pointer arithmetic in `tutti-node`'s planar
  # buffers (`slice::from_raw_parts` over a fixed stride, in the crate every
  # graph node processes through), the aliasing in `tutti-types`'
  # `AudioThreadCell`, and `RtPublish`'s hazard-slot reclamation.
  #
  # Its own job because it needs nightly and is slow — minutes, not seconds —
  # and because a failure here should read as "a memory-safety claim broke",
  # not as part of a general test failure.
  #
  # This is the JACK situation again: the recipe could not be verified on the
  # machine that wrote it (installing nightly there failed repeatedly), so CI
  # is the first thing to run it. A check nobody has run is not a check.
  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ALSA headers: `tutti-node` and `tutti-types` do not need them, but
      # cargo resolves the whole workspace before building a member.
      - run: sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # `denormals.rs`'s two tests are `#[cfg_attr(miri, ignore)]`d — they read
      # MXCSR, and miri has no x86 SSE intrinsics. They report as skipped
      # rather than vanishing, so the run says what it did not cover.
      - run: cargo miri test -p tutti-types --lib
      # `rt::publish` again over 16 scheduling seeds: its concurrent-readers
      # stress test reports a race on a freed value if either `SeqCst` fence in
      # `RtPublish` goes, but only on some seeds — the default one alone missed
      # it. (A plain x86 run never does — a CAS is already a full barrier
      # there — which is why this job and the loom one both exist.)
      - run: cargo miri test -p tutti-types --lib rt::publish
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..16
      - run: cargo miri test -p tutti-node

  # The loom models: `RtPublish`'s reclamation protocol and `PosRing`'s no-tear
  # protocol (both run against the shipped code — their atomics switch to
  # loom's under the flag) and the plugin
  # shm header's Release/Acquire protocol (a replica, for the reasons in
  # `tutti-shm-model/Cargo.toml`). `--cfg loom` is global, so each is built for
  # its own target only, never the workspace.
  #
  # Release, because loom explores every interleaving in-process. The
  # `RtPublish` models run at a preemption bound of 4: about a minute and a
  # half, and every recorded mutation fails at a bound of 3. The exhaustive run
  # (about 17 minutes, bar one model that is always bounded) is
  # `just loom-full`, for a change to `rt/publish.rs` itself.
  loom:
    name: loom
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - uses: actions/checkout@v4
      # ALSA headers: neither crate needs them, but cargo resolves the whole
      # workspace before building a member.
      - run: sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tutti-types --release --test rt_publish_loom
        env:
          LOOM_MAX_PREEMPTIONS: 4
      # `PosRing`'s no-tear protocol (the disk stream's ring), against the
      # shipped code: nine models, about five minutes at this bound (the
      # shrink models a minute each); every recorded mutation fails at it but
      # the documented survivor (`tests/pos_ring_loom.rs`).
      - run: cargo test -p tutti-types --release --test pos_ring_loom
        env:
          LOOM_MAX_PREEMPTIONS: 4
      - run: cargo test -p tutti-shm-model --release
