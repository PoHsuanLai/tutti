# CI for the tutti audio engine.
#
# This replaces the workflow the engine carried as a subtree of the dawai app
# repo, which had rotted unnoticed for the whole time it sat there unrun: it
# named `tutti-midi` and `tutti-units` (split and renamed in 786a4c24 and
# 91bb7540) and carried a `no_std` job for a property deliberately dropped in
# 679a8433. A workflow that names crates which no longer exist does not fail —
# it just stops testing anything, which is why nothing reported it.
#
# Four things here are load-bearing and are documented at their step:
# the plugin-server prebuild, doctests, the Bevy-free floor, and the path gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No job writes to the repository, issues or checks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fewer codegen units keeps CI RAM in check on the large Bevy graph.
  CARGO_INCREMENTAL: 0
  # Line tables only: backtraces keep file:line, and the test binaries are a
  # fraction of the size. Full debug info filled the ubuntu runner's disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

# Reproducible builds. Every stable job installs the toolchain
# `rust-toolchain.toml` pins (`rustup toolchain install` with no argument
# reads it), never a floating `stable`, so a new release's lints land in the
# PR that bumps the file. Every cargo command that resolves dependencies runs
# `--locked` against the committed `Cargo.lock`: a lock that drifted from the
# manifests fails loudly instead of resolving newer crates in silence (a
# floating resolve once broke a build, through a deprecation in a new
# `bevy_ecs`). Miri names its nightly (`cargo +nightly`), which overrides
# the file.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  # Advisories (`deny.toml`): a RustSec vulnerability, a yanked crate or an
  # unmaintained one not named there fails the job. The advisory DB is fetched
  # fresh on the runner; a failed fetch is an error, never a pass. `bans` and
  # `licenses` are not checked (see `deny.toml`).
  deny:
    name: cargo deny (advisories)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories

  paths:
    name: canonical paths
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # For the submodule-pin gate below, which reads `git submodule
          # status`. A checkout without them still prints the recorded SHAs,
          # but prefixed `-` for uninitialised, so the gate would report the
          # checkout rather than the pin on every run.
          submodules: recursive
      # Engine types are imported from a crate's root or prelude, never through
      # its modules. Neither rustc nor clippy has a lint for a redundant path,
      # and doc comments in ```text / ```ignore blocks are never compiled — so
      # this grep is the only enforcement there is.
      - run: scripts/check-canonical-paths.sh
      # `tutti-graph` keeps every module private, so rustc already refuses
      # `tutti_graph::plan::Plan` in code. Prose is the gap: a ```text block
      # or a *.md naming a module path compiles fine and goes stale the moment
      # a module is renamed. The per-module gate covers it.
      - run: scripts/check-canonical-paths.sh tutti_graph arena builder command compile controls cost editor event exec fade fork held history instrument io kernels loss meter node par param plan play pool preroll reference slots spec tap time
      # The same for `tutti-session`, which keeps every module private too.
      - run: scripts/check-canonical-paths.sh tutti_session builder device error export graph instrument midi modulation node plugin session watch
      # And `tutti-ump`, which keeps its modules private.
      - run: scripts/check-canonical-paths.sh tutti_ump cc_number decode encode field message midi1 midi_channel midi_group ump
      # And `tutti-midi-protocol`, which keeps its modules private.
      - run: scripts/check-canonical-paths.sh tutti_midi_protocol midi1 narrow scale voice
      # And `tutti-midi-device`, which keeps its modules private.
      - run: scripts/check-canonical-paths.sh tutti_midi_device id table
      # And `tutti-plugin-db`, which keeps its modules private.
      - run: scripts/check-canonical-paths.sh tutti_plugin_db facts format fs pedal scanner store table
      # And `tutti-dsp`: its modules are private, the root names every item.
      - run: scripts/check-canonical-paths.sh tutti_dsp allpass buffer control convolver delay dither dynamics error fdn fdn_design fft filter geometry grid interp network reverb reverb_design swept_delay waveshape window resample
      # And `tutti-measure`, which keeps its modules private too.
      - run: scripts/check-canonical-paths.sh tutti_measure align beat chord chroma features key loudness notes onset peaks pitch silence spectrum stereo tempo transform vectorscope xcorr yin
      # And `tutti-transport`, `tutti-metering` and `tutti-engine`: modules
      # private, the root names every item.
      - run: scripts/check-canonical-paths.sh tutti_transport beat_walk clock fsm handle loop_region motion offline project_meter settings state timed timeline
      - run: scripts/check-canonical-paths.sh tutti_metering load
      - run: scripts/check-canonical-paths.sh tutti_engine engine error
      # And `tutti-codec`, which keeps its modules private: the root names every item.
      - run: scripts/check-canonical-paths.sh tutti_codec aiff decode encoder error flac format pcm spec staged vorbis wav wave
      # And `tutti-sf2` and `tutti-soundfont`: modules private, the root names every item.
      - run: scripts/check-canonical-paths.sh tutti_sf2 bank binary_reader error four_cc generator generator_type instrument instrument_info instrument_region loop_mode preset preset_info preset_region read_counter sample_header soundfont soundfont_info soundfont_parameters soundfont_sampledata soundfont_version zone zone_info
      - run: scripts/check-canonical-paths.sh tutti_soundfont array_math bi_quad_filter channel chorus envelope_stage error fork lfo modulation_envelope node oscillator patch player region_ex region_pair render reverb settings soundfont_math voice voices volume_envelope
      # And `tutti-tempo`, which keeps its modules private.
      - run: scripts/check-canonical-paths.sh tutti_tempo error grid map point segment
      # And `tutti-voicing`, which keeps its modules private.
      - run: scripts/check-canonical-paths.sh tutti_voicing controller holds phase voicing
      # And `tutti-rt`, which keeps its modules private: the root names every item.
      - run: scripts/check-canonical-paths.sh tutti_rt cell denormals doorbell drain_clock edits job_gate level_cell packed_atomic pos_ring request_word scope seq_cell spin split task_graph vec
      # The vendored VST3 SDK is three Steinberg submodules, documented as
      # pinned at v3.8.0_build_66 in .gitmodules, in CLAUDE.md and in
      # tutti-vst3-host's build.rs. Prose cannot notice a submodule bump moving
      # the tree out from under it, and a silently changed SDK surfaces as an
      # unexplained C++ compile error in `audio-probe` rather than as a version
      # complaint — so this compares those three statements against the commits
      # the superproject actually records. It belongs in this job because it is
      # the other static gate: no toolchain, no build, just a claim checked.
      - run: scripts/check-submodule-pins.sh
      # Design 015 §8, checks 3 and 4: `bevy-tutti/src` names none of the
      # engine composition the session owns (`Editor`, `Engine`, ...), and
      # `tutti-session` re-exports no crate whole. Perl over the source, no
      # build, so it belongs with the other static gates.
      - run: scripts/check-adapter.sh
      # Every CLAP host callback and VST3 host COM method runs in the panic
      # guard (python3 over the source, no build).
      - run: scripts/check-guards.sh
      # CLAP and VST3 FFI `unsafe` lives only in `tutti-clap-ffi` and
      # `tutti-vst3-ffi`: `tutti-clap-host` and `tutti-vst3-host` forbid it,
      # and the server and GUI code that drive them carry none
      # (python3 over the source, no build).
      - run: scripts/check-plugin-ffi.sh
      # Every member sits directly in `crates/<package>` or `testing/<dir>`, no
      # shipped crate builds on a `testing/` crate, and dependencies point down
      # the layers in CLAUDE.md (`cargo metadata`, no build).
      - run: rustup toolchain install
      - run: scripts/check-layout.sh
      # A tuple struct with a private field does not derive `Deserialize`
      # plainly: the derive skips `new` (python3 over the source, no build).
      - run: scripts/check-range-types.sh

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The VST3 SDK is three submodules; without them tutti-vst3-host
          # cannot build its `audio-probe` reference plugin.
          submodules: recursive
      - name: Install Linux audio deps
        run: |
          sudo apt-get update
          # libasound2-dev:    tutti-cpal (ALSA).
          # libdbus-1-dev:     cpal -> audio_thread_priority -> dbus, the
          #                    RT-priority request on Linux.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev pkg-config
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # One format at a time: a test helper or a match that only the other
      # formats use is dead or irrefutable here, and the workspace run (every
      # format on) cannot see it.
      - name: clippy (plugin server, one format)
        run: |
          for f in vst2 vst3 clap; do
            cargo clippy --locked -p tutti-plugin-server --no-default-features --features "$f" --all-targets -- -D warnings
            cargo clippy --locked -p tutti-plugin-probe --no-default-features --features "$f" --all-targets -- -D warnings
          done

  # The same lint, on Windows. The `clippy` job above cannot see a
  # `#[cfg(windows)]` block, and it cannot see a cast that is load-bearing on
  # one platform and a no-op on the other: the vst3 bindings type every SDK
  # enum constant as `c_uint` on unix and `c_int` on Windows, so
  # `kAudio as i32` passes Linux clippy and fails `unnecessary_cast` here. This
  # is the only Windows job: it lints the code, and nothing runs it there.
  #
  # A native runner rather than a cross-check from ubuntu. The cross-check
  # (`just check-windows`) reaches the plugin crates, but not the workspace:
  # `ogg_next_sys` needs real Windows C headers, and `tutti-vst3-host`'s
  # `conformance` feature compiles and links the `audio-probe` DLL against the
  # SDK's Win32 sources, which only an MSVC toolchain can do. Here `cc` finds
  # MSVC, so no clang/stub workaround is needed.
  clippy-windows:
    name: clippy (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The workspace run builds each crate with the features the workspace
      # unifies to, which leaves tutti-plugin's format features and
      # clap-extras dark. `au` is macOS-only and compiles to nothing here.
      - name: Plugin formats
        shell: bash
        run: |
          cargo clippy --locked -p tutti-plugin --features clap,vst3,vst2,json --all-targets -- -D warnings
          cargo clippy --locked -p tutti-plugin-db --features json --all-targets -- -D warnings
          cargo clippy --locked -p tutti-clap-ffi --lib -- -D warnings
          cargo clippy --locked -p tutti-clap-host --features clap-extras --all-targets -- -D warnings
      # WASAPI capture, which the `features` job lints only on Linux.
      - name: Device features
        run: cargo clippy --locked -p tutti-cpal --features capture --all-targets -- -D warnings

  # The AU host on macOS. Every AU crate is `#![cfg(target_os = "macos")]`, so
  # the Linux and Windows clippy jobs compile it to nothing and a lint in it
  # (missing docs, a new clippy rule) went unseen until someone built on a Mac.
  # Lints only; the AU suites need installed audio units and run locally.
  clippy-macos:
    name: clippy (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p tutti-au-ffi -p tutti-au-host --all-targets -- -D warnings
      - run: cargo clippy --locked -p tutti-au-host --features installed-units --all-targets -- -D warnings

  # The plugin contract on Windows. Not a required check: nothing else runs a
  # test there, and whether the shared plugin loads on a Windows runner is what
  # this finds out. Linux and macOS run the same suite in `test`.
  contract-windows:
    name: plugin contract (windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      # The VST3 shells and the C++ witness build against the SDK submodules.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked -p tutti-plugin-contract

  features:
    name: dark features
    runs-on: ubuntu-24.04
    # Its bevy-tutti suites assert golden digests; see the `test` job.
    env:
      TUTTI_GOLDEN: require
    steps:
      # The submodules are the VST3 SDK: `tutti-plugin-contract` builds the VST3
      # shells and the C++ witness against it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev pkg-config
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Feature-gated code that no other job compiles.
      #
      # `cargo tree --workspace -e features -i tutti-cpal` reports only
      # "default": nothing in this workspace turns `capture` or `audio-io`
      # on, so the clippy and test jobs above typecheck none of them.
      # That is the same hole the Windows cross-check exists to close, and for
      # the same reason — a cfg block nothing compiles is a cfg block nothing
      # lints, and it rots in silence.
      #
      # What was dark until this job existed:
      #   tutti-cpal/capture  — all of src/mic.rs (MicIn, the capture ring)
      #   bevy-tutti/audio-io — tests/audio_io_pump.rs, 12 tests that had
      #                         never once run in this repo
      #   bevy-tutti/soundfont — tests/midi_soundfont.rs (implies `midi`); its
      #                         5 tests looked for the .sf2 at the pre-extraction
      #                         `crates/tutti/assets/` path and failed on every
      #                         run, which no run ever made
      #   bevy-tutti/sampler  — src/sampler (the WaveAsset loader, the voice
      #                         components) and its tests
      #   tutti-export/*      — no format is default (ogg links C), so the library
      #                         is linted with none and each of wav, flac, aiff
      #                         and ogg alone; its own tests have all four on
      #                         through a dev-dependency on itself
      #   tutti-codec/*       — a `Format` variant exists only with its encode
      #                         feature, so each of none, encode-wav, encode-aiff,
      #                         encode-flac and encode-vorbis is built and tested
      #                         alone (a workspace run has them all on, through
      #                         tutti-export, and proves nothing about the
      #                         gating); each decode-* feature is built alone as
      #                         a library (its tests always have every decoder on,
      #                         through the crate's dev-dependency on itself);
      #                         with them all and `serde`, the pinned bytes and
      #                         Quality's range contract run
      #   bevy-tutti/plugin   — src/plugin_host's binding against a live plugin:
      #                         tests/plugin_capture.rs loads the reference CLAP
      #                         plugin through a real plugin-server and is the
      #                         only test that watches the latency poll see one.
      #                         `full,plugin` so the modulation-gated param
      #                         binding compiles with it; `plugin,modulation`
      #                         alone, without `export` or `vst2`, left
      #                         `tests/mod_plugin.rs` helpers and no test
      #                         (dead code) until this lint found it.
      #   tutti-session/clap  — src/plugin.rs and src/export.rs's plugin half:
      #                         tests/plugin.rs hosts the reference CLAP
      #                         plugin through a real plugin-server.
      #                         `export,modulation` so the render mode and the
      #                         GUI-edit drain compile with it.
      #   tutti-session/midi-hardware — tests/midi.rs's hardware-port reclaim test
      #                         and its hot-plug tests
      #   tutti-au-host/installed-units — linted by the macOS clippy job (the
      #                         crate is empty on Linux) and run only locally
      #                         (`just test-au-installed`, part of `test-all`):
      #                         it asserts a claim about third-party Audio
      #                         Units installed on the machine, and fails,
      #                         never skips, where there are none
      #   tutti-midi-hardware/sequencer-tests — compiled and linted here, and run
      #                         only locally (`just test-features`): the suite
      #                         needs the kernel's `snd-seq` module, which the
      #                         runner's Azure kernel does not ship (no
      #                         `linux-modules-extra` package either). It fails,
      #                         never skips, without `/dev/snd/seq`
      #   tutti-plugin-types/test-support — the `FakePlugin` a consumer's tests
      #                         link, built and its suite run with it on
      #   tutti-clap-host/clap-extras — tests/unit_tests.rs's 5 extension tests
      #                         and the extension code they cover
      #   tutti-plugin-db/json — `save`, `load` and their tests
      #   tutti-plugin/clap,vst2 — 33 CLAP and 49 in-process VST2 tests (the
      #                         `clap_*`, `plugin_param_delivery*` and
      #                         `vst2_in_process*` suites): no other job turns
      #                         the features on, so none of them ran. Only
      #                         `real_plugin_pressure` did, by name.
      #   tutti-plugin-contract/server — tests/server.rs: the shared plugin's
      #                         mode and transcript through a real plugin-server,
      #                         in all of CLAP, VST2 and VST3 (and the C++ plugin);
      #                         tests/probe.rs: their descriptors, and a crash, a
      #                         hang and a print in init, through a real plugin-probe
      #   tutti/clap          — the umbrella's §5.1 and §5.2 examples
      #                         (`headless_modulation`; `plugin_midi_export`,
      #                         `test = true`, which plays the reference
      #                         plugin through a real plugin-server) and its
      #                         prelude's request types.
      #
      # Not `--all-features`: that pulls every plugin-format SDK. Name the
      # combinations, and add one here whenever a new feature is added.
      - name: Lint
        run: |
          cargo clippy --locked -p tutti-cpal --features capture --all-targets -- -D warnings
          cargo clippy --locked -p bevy-tutti --features audio-io --all-targets -- -D warnings
          cargo clippy --locked -p bevy-tutti --features soundfont --all-targets -- -D warnings
          cargo clippy --locked -p bevy-tutti --features sampler --all-targets -- -D warnings
          cargo clippy --locked -p bevy-tutti --features full,plugin --all-targets -- -D warnings
          cargo clippy --locked -p bevy-tutti --features plugin,modulation --all-targets -- -D warnings
          cargo clippy --locked -p tutti-session --features clap,export,modulation,midi-hardware,synth,soundfont --all-targets -- -D warnings
          cargo clippy --locked -p tutti --features clap,export,modulation --all-targets -- -D warnings
          cargo clippy --locked -p tutti --features audio-io --all-targets -- -D warnings
          cargo clippy --locked -p tutti-export --lib -- -D warnings
          cargo clippy --locked -p tutti-export --lib --features wav -- -D warnings
          cargo clippy --locked -p tutti-export --lib --features flac -- -D warnings
          cargo clippy --locked -p tutti-export --lib --features aiff -- -D warnings
          cargo clippy --locked -p tutti-export --lib --features ogg -- -D warnings
          cargo clippy --locked -p tutti-session --lib --features export-flac,export-aiff,export-ogg -- -D warnings
          cargo clippy --locked -p tutti-codec --all-targets -- -D warnings
          cargo clippy --locked -p tutti-codec --features encode-wav --all-targets -- -D warnings
          cargo clippy --locked -p tutti-codec --features encode-aiff --all-targets -- -D warnings
          cargo clippy --locked -p tutti-codec --features encode-flac --all-targets -- -D warnings
          cargo clippy --locked -p tutti-codec --features encode-vorbis --all-targets -- -D warnings
          cargo clippy --locked -p tutti-codec --lib --features decode-wav -- -D warnings
          cargo clippy --locked -p tutti-codec --lib --features decode-flac -- -D warnings
          cargo clippy --locked -p tutti-codec --lib --features decode-mp3 -- -D warnings
          cargo clippy --locked -p tutti-codec --lib --features decode-ogg -- -D warnings
          cargo clippy --locked -p tutti-codec --all-features --all-targets -- -D warnings
          cargo clippy --locked -p tutti-ump --features serde --all-targets -- -D warnings
          cargo clippy --locked -p tutti-midi-device --features serde --all-targets -- -D warnings
          cargo clippy --locked -p tutti-tempo --features serde --all-targets -- -D warnings
          cargo clippy --locked -p tutti-midi-hardware --features sequencer-tests --all-targets -- -D warnings
          cargo clippy --locked -p tutti-clap-ffi --lib -- -D warnings
          cargo clippy --locked -p tutti-clap-host --features clap-extras --all-targets -- -D warnings
          cargo clippy --locked -p tutti-plugin --features clap,vst2,json --all-targets -- -D warnings
          cargo clippy --locked -p tutti-plugin-db --features json --all-targets -- -D warnings
          cargo clippy --locked -p tutti-plugin-contract --features server --all-targets -- -D warnings

      # `tests/plugin_capture.rs` (and tutti-session's `tests/plugin.rs` and
      # tutti's `plugin_midi_export` example) spawn the `plugin-server`
      # binary, which no test build produces (it would be a dependency cycle through
      # `tutti-plugin`), so it is built here, before the tests, as the `test`
      # job does. Without `au`, which is macOS-only.
      - name: Build plugin-server (bevy-tutti/plugin, tutti-session/clap, tutti/clap and the plugin contract spawn it)
        run: |
          cargo build --locked -p tutti-plugin-server --no-default-features --features clap,vst2,vst3
          cargo build --locked -p tutti-plugin-probe

      - name: Test
        run: |
          cargo nextest run --locked -p tutti-cpal --features capture
          cargo nextest run --locked -p bevy-tutti --features audio-io
          cargo nextest run --locked -p bevy-tutti --features soundfont
          cargo nextest run --locked -p bevy-tutti --features sampler
          cargo nextest run --locked -p bevy-tutti --features full,plugin
          cargo nextest run --locked -p tutti-session --features clap,export,modulation,midi-hardware,synth,soundfont
          cargo nextest run --locked -p tutti --features clap,export,modulation
          cargo nextest run --locked -p tutti --features audio-io
          cargo nextest run --locked -p tutti-session --features export-flac,export-aiff,export-ogg
          cargo nextest run --locked -p tutti-codec
          cargo nextest run --locked -p tutti-codec --features encode-wav
          cargo nextest run --locked -p tutti-codec --features encode-aiff
          cargo nextest run --locked -p tutti-codec --features encode-flac
          cargo nextest run --locked -p tutti-codec --features encode-vorbis
          cargo nextest run --locked -p tutti-codec --all-features
          # tutti-ump/serde is already on in a workspace run (tutti-midi-types' self
          # dev-dependency turns it on); this step names it so tests/serde.rs still runs
          # if that edge goes away.
          cargo nextest run --locked -p tutti-ump --features serde
          cargo nextest run --locked -p tutti-midi-device --features serde
          cargo nextest run --locked -p tutti-tempo --features serde
          cargo nextest run --locked -p tutti-clap-host --features clap-extras
          cargo nextest run --locked -p tutti-plugin-types --features test-support
          cargo nextest run --locked -p tutti-plugin-db --features json
          cargo nextest run --locked -p tutti-plugin-contract --features server

      # bevy-tutti builds `bevy_tasks` without `multi_threaded`, so its task
      # pool runs each task inside `spawn`, on the main thread: a render's
      # graph dropped on the pool is a main-thread drop too, and an export's
      # fork is built in the frame it starts. Only with real pool threads
      # (what an app with Bevy's default features has) can these tests see a
      # forked in-process VST2 instance built, prepared or closed off the main
      # thread, or a frame wait for a slow fork build. These tests, not the
      # suite: `export_surface`'s batch test assumes a render finishes in the
      # frame that polls it, which a threaded pool does not promise.
      - name: Export forks and drops on the main thread (threaded pool)
        run: >-
          cargo nextest run --locked -p bevy-tutti --features full,bevy_tasks/multi_threaded
          -E 'test(the_rendered_graph_is_dropped_on_the_main_thread) | test(/^off_thread::/)'

      # The plugin host on a multi-threaded executor and pool, as an app with
      # Bevy's default features runs it: a system that calls a main-thread
      # session API (`Session::add_plugin`, the plugin phases, an export's
      # finish) runs on a pool thread unless it is pinned, and the session's
      # main-thread assert panics there (a debug build). An in-process VST2
      # plugin's load is confined to the main thread the same way. The whole
      # suite, `vst2` included (in process: the CLAP-only server above
      # suffices), but for `export_surface`'s batch test, as in the step
      # above: it assumes a render finishes in the frame that polls it
      # (64 frames for 5 renders, no wait), which a threaded pool does not
      # promise.
      - name: Plugin host on a threaded executor
        run: >-
          cargo nextest run --locked -p bevy-tutti
          --features full,plugin,vst2,clap,bevy_tasks/multi_threaded,bevy_ecs/multi_threaded
          -E 'not test(a_batch_spawned_in_one_frame_starts_one_at_a_time)'

      # JACK hard-links libjack at build time, so it gets its own step (and its
      # own apt package) rather than joining the list above. `AudioHost::Jack`
      # exists on every platform and answers `Error::HostUnavailable` where it
      # cannot be served, so only the Linux build reaches the real code — which
      # is precisely why it needs compiling somewhere.
      - name: Install JACK headers
        run: sudo apt-get install -y --no-install-recommends libjack-jackd2-dev
      - name: Lint JACK
        run: cargo clippy --locked -p tutti-cpal --features jack --all-targets -- -D warnings

      # The out-of-process plugin bridge, driven at real callback pacing. This
      # belongs in *this* job because it was dark in exactly the same way: the
      # whole suite was `#[ignore]`d for needing third-party plugins installed,
      # and `EFFECTS` names macOS system paths, so the only harness measuring
      # the bridge ran on no machine anywhere. It now falls back to the
      # reference CLAP probe, which cargo builds as a dev-dependency.
      #
      # `plugin-server` first: the suite spawns it, and it cannot be a
      # dev-dependency because `tutti-plugin-server` depends on `tutti-plugin`
      # and the edge would be a cycle. Nothing else in a test run builds it.
      #
      # These pace themselves to a 1.333 ms block and spawn up to 8
      # subprocesses. If that proves too much for a shared runner, the honest
      # fix is to reduce the instance count here with the failure recorded —
      # not `continue-on-error`, which is how the pre-extraction workflow died.
      - name: Build plugin-server and plugin-probe
        run: |
          cargo build --locked -p tutti-plugin-server
          cargo build --locked -p tutti-plugin-probe
      - name: tutti-plugin suites (CLAP, in-process VST2) and the bridge under pressure
        run: cargo nextest run --locked -p tutti-plugin --features clap,vst2,json

  # Benchmarks: proved to RUN, never compared.
  #
  # GitHub's runners are shared and swing 30-50% on this workload, and the
  # engine's own profile_stretch_clone harness (deleted with `Net`; its
  # figures are in doc 013) measured an 81x spread on a QUIET
  # machine. A timing threshold here would flap, and a flapping gate gets
  # `continue-on-error: true` within a month and then tests nothing — the same
  # death the pre-extraction workflow died. So this job runs every benchmark
  # exactly once (`--test`) to prove the harnesses still work against the
  # current API, and compares nothing.
  #
  # The real perf gate is `tutti-engine/tests/alloc_budget.rs`, which runs in the
  # ordinary test job: allocation counts are machine-independent, so a budget
  # on them survives a noisy vCPU.
  #
  # Not on `pull_request`: this is a full release build of the workspace.
  bench-smoke:
    name: bench smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev pkg-config
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Named targets, not a sweep: a bare `cargo bench` (and `--benches`)
      # also runs the test targets in the release profile, where
      # `debug_assert!` is gone and a `#[should_panic]` over one fails.
      # Mirrors `just bench`; adding a bench means adding a line in both.
      - run: |
          cargo bench --locked -p tutti-nodes     --bench engine_render  -- --test
          cargo bench --locked -p tutti-cpal      --bench audio_callback -- --test
          cargo bench --locked -p tutti-export    --bench offline_render -- --test
          cargo bench --locked -p tutti-polysynth --bench polysynth      -- --test
          cargo bench --locked -p tutti-ump       --bench codec          -- --test
          cargo bench --locked -p tutti-midi-types --bench message_baseline -- --test
          cargo bench --locked -p tutti-midi-runtime --bench clip_node -- --test
          cargo bench --locked -p tutti-sampler   --bench voice_pool     -- --test
          cargo bench --locked -p tutti-plugin --features vst2 --bench vst2_in_process -- --test
          cargo bench --locked -p arc-lend --bench lend -- --test
          # `just bench-compare --test`: the comparison harness at tiny
          # counts. Never the full run here: it takes minutes, and a shared
          # runner's tails mean nothing.
          cargo bench --locked -p arc-lend-compare --bench compare -- --test

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # The golden digests are glibc libm's on 24.04; 26.04's libm moves them.
    # `require` makes a Linux runner whose glibc is not the recorded one fail
    # instead of skipping the digests (CLAUDE.md, Testing).
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    env:
      TUTTI_GOLDEN: ${{ matrix.os == 'ubuntu-latest' && 'require' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux audio deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libasound2-dev:    tutti-cpal (ALSA).
          # libdbus-1-dev:     cpal -> audio_thread_priority -> dbus, the
          #                    RT-priority request on Linux.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev pkg-config
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # MUST come before the test run. `tutti-plugin`'s clap_pdc_alignment,
      # clap_crash_recovery and real_stall_tests drive the reference CLAP plugin
      # through a real out-of-process host, so they spawn this binary. It cannot
      # be a dev-dependency that cargo would build for them — tutti-plugin-server
      # depends on tutti-plugin, so the edge would be a dependency *cycle* — and
      # nothing else in a test run builds it. Skipping it makes those three
      # suites hard-fail rather than silently skip, which is deliberate: a suite
      # that skips on a missing fixture is one typo away from reporting success
      # having executed nothing.
      - name: Build plugin-server and plugin-probe (three plugin-host suites spawn the server)
        run: |
          cargo build --locked -p tutti-plugin-server
          cargo build --locked -p tutti-plugin-probe

      # nextest, not `cargo test`: each test gets its own process, which is what
      # the audio suites need — they touch device and global state, and a panic
      # or abort in one no longer takes the whole binary's results with it.
      #
      # The two GUI-lifecycle binaries are excluded because they are `harness =
      # false` custom mains that drive a plugin editor on the real main thread.
      # nextest enumerates a binary by running it with `--list --format terse`;
      # these ignore the flag, run their whole suite, and exit non-zero, so
      # nextest fails at *list* time having already executed them. They are run
      # below under the libtest-free runner they were written for.
      # Two exclusions, for opposite reasons.
      #
      # The GUI-lifecycle binaries are `harness = false` custom mains that drive
      # a plugin editor on the real main thread. nextest enumerates a binary by
      # running it with `--list --format terse`; these ignore the flag, execute
      # their whole suite and exit non-zero, so nextest fails at *list* time
      # having already run them. They are run below under the runner they were
      # written for.
      #
      # The GUI-lifecycle binaries are `harness = false` custom mains; see above.
      # `no_installed_third_party_unit_implements_the_mapping_family` is behind
      # `tutti-au-host`'s `installed-units` feature, which this run leaves off:
      # it asserts a claim about third-party Audio Units installed on the
      # machine and fails, never skips, where there are none.
      - name: Test
        shell: bash
        run: |
          cargo nextest run --locked --workspace --no-fail-fast \
            -E 'not binary(gui_lifecycle_main) and not binary(au_gui_lifecycle_main)'

      # The custom-harness editor tests. `cargo test` just execs the binary,
      # which is exactly what a `harness = false` main wants.
      # `has_editor_agrees_with_opening_one` is skipped for the same reason the
      # AU mapping-family test is excluded above: it asserts agreement across a
      # corpus that must contain both an editor-bearing and an editorless
      # plugin, and deliberately panics rather than report a pass that a
      # constant `true` would satisfy. A hosted runner has no third-party
      # plugins, so it can only ever fail there. The skip is announced in the
      # harness output, and naming a case that does not exist is an error.
      - name: Editor-lifecycle tests (custom harness)
        shell: bash
        env:
          TUTTI_GUI_SKIP: has_editor_agrees_with_opening_one
        run: |
          cargo test --locked -p tutti-vst3-host --test gui_lifecycle_main
          cargo test --locked -p tutti-au-host --test au_gui_lifecycle_main

      # The RT primitives in release. Some of their properties only exist
      # with `debug_assertions` off: `AudioThreadCell`'s borrow check was
      # debug-only once (two `&mut T` from safe code in release), and nothing
      # but this run would have caught it outside the loom job. `arc-lend`
      # too: its stress test runs far more interleavings at release speed.
      # `tutti-graph`'s executor guards (a caller bug asserts in debug and
      # renders silence in release) have a test per build.
      - name: Test tutti-types, tutti-rt, arc-lend and tutti-graph (release)
        run: cargo nextest run --locked --release -p tutti-types -p tutti-rt -p arc-lend -p tutti-graph

      # nextest does NOT run doctests, and says nothing about skipping them.
      # That is not a rounding error here: these are the only tests covering the
      # `///` examples, so a green nextest run is not a green workspace.
      - name: Doctests
        run: cargo test --locked --doc --workspace
      # `Device`'s `compile_fail` doctest (it is `!Send`) exists only with
      # `device`. The workspace run above has it only because bevy-tutti's
      # features unify it in; this names the feature so the proof does not
      # depend on another crate's defaults.
      - name: Doctests (tutti-session, device)
        run: cargo test --locked --doc -p tutti-session --features device

  bevy-free:
    name: Bevy-free floor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio deps
        run: |
          sudo apt-get update
          # libasound2-dev:    tutti-cpal (ALSA).
          # libdbus-1-dev:     cpal -> audio_thread_priority -> dbus, the
          #                    RT-priority request on Linux.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev pkg-config
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The engine must stay usable without Bevy. `--no-default-features` does
      # NOT test that — `bevy` is already off by default on every engine crate
      # that has one, so that flag drops the codec and midi features instead and proves
      # nothing. Naming the feature explicitly is what tests both sides.
      - run: cargo check --locked -p tutti-transport -p tutti-metering -p tutti-engine
      - run: cargo check --locked -p tutti-types
      - run: cargo check --locked -p tutti-types --features bevy

      # The Bevy-free facade, and the assertion a compile cannot make.
      # `cargo check` proves the crate builds; it says nothing about what came
      # in with it. This is a NEGATIVE dependency check: no bevy crate may
      # appear anywhere under `tutti`, at any depth, with everything on. The
      # repo has no other guarantee of that shape.
      #
      # `-e normal`, not `-e all`: `bevy-tutti` is a workspace member, so a
      # dev-dependency walk would false-positive.
      - run: cargo check --locked -p tutti
      - run: cargo check --locked -p tutti --features full
      - name: No bevy under the facade
        run: |
          if cargo tree --locked -p tutti --features full -e normal | grep -nE '\bbevy(_[a-z]+)?\b'; then
            echo "FAIL: a bevy crate reached the Bevy-free facade."
            exit 1
          fi

      # The session layer both umbrellas use (design 015 §8): no Bevy crate in
      # its closure with every feature on (`--all-features`: a Bevy crate
      # behind an optional feature is absent from the default tree), no `bevy`
      # feature, and no whole-crate re-export (it is not an umbrella).
      - run: scripts/check-bevy-free.sh

  doc:
    name: rustdoc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux audio deps
        run: |
          sudo apt-get update
          # libasound2-dev:    tutti-cpal (ALSA).
          # libdbus-1-dev:     cpal -> audio_thread_priority -> dbus, the
          #                    RT-priority request on Linux.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev pkg-config
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The workspace sets broken_intra_doc_links and private_intra_doc_links to
      # deny; this is where that is actually enforced, since a plain build never
      # runs rustdoc.
      # `--document-private-items`: the crates' internals carry doc comments
      # with links too, and one that only breaks in a private item rots
      # unseen.
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings --document-private-items
      # `tutti_graph::contract` (doc 013 §6's harness) is behind the
      # off-by-default `contract` feature, which only dev-dependencies turn on
      # — and rustdoc builds none, so the line above never documents it. The
      # tests and clippy (`--all-targets`) do reach it.
      - run: cargo doc --locked -p tutti-graph --no-deps --features contract
        env:
          RUSTDOCFLAGS: -D warnings
      # bevy-tutti gates most of its surface behind features (`full`, and
      # `plugin`, which `full` leaves out), so the workspace line above
      # documents little of it: two broken links sat there unseen.
      - run: cargo doc --locked -p bevy-tutti --no-deps --features full,plugin
        env:
          RUSTDOCFLAGS: -D warnings
      # Each feature of the feature-gated crates alone. The union above cannot
      # see a link out of one feature's docs into an item another feature
      # gates, which the union of features cannot see.
      - run: scripts/check-doc-features.sh
      # The docs.rs build: nightly and `--cfg docsrs`, so `doc_cfg` parses and
      # the feature badges render. A dated nightly (bumped by hand, like
      # `rust-toolchain.toml`'s stable) so a new rustdoc lint cannot turn CI
      # red; named with `+` because `rust-toolchain.toml` pins stable.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-14
      - run: cargo +nightly-2026-10-14 doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs

  # Miri over the non-FFI `unsafe`. See docs/design/012-unsafe-policy.md for
  # why this crate and not the rest: ~95% of this repo's `unsafe` is a C
  # ABI, which miri does not execute at all, and out-of-process hosting is the
  # structural answer there instead. Of what is left, the ones that matter
  # are `tutti-rt`'s: the aliasing in `AudioThreadCell`, the claims behind
  # `SplitMut`/`SplitRw`, `JobGate`'s job cell and `edit_ring`'s slot words
  # (their unit tests, `--lib` below, run under miri), and `arc-lend`'s
  # hazard-slot reclamation (`ArcLend`, its own crate).
  #
  # Its own job because it needs nightly and is slow — minutes, not seconds —
  # and because a failure here should read as "a memory-safety claim broke",
  # not as part of a general test failure.
  #
  # This is the JACK situation again: the recipe could not be verified on the
  # machine that wrote it (installing nightly there failed repeatedly), so CI
  # is the first thing to run it. A check nobody has run is not a check.
  miri:
    name: miri
    runs-on: ubuntu-24.04
    # About 10 minutes on main: a hang (a test miri cannot finish) fails here,
    # not at GitHub's six-hour cap. A test that is slow only because it is a
    # pure-arithmetic loop or a large transform shrinks under `cfg!(miri)`
    # (an O(n^2) DFT reference or a 200 000-step search ran 10 to 15 minutes
    # each); the native test job still runs it at full size.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # ALSA headers: `tutti-rt` does not need them, but
      # cargo resolves the whole workspace before building a member.
      - run: sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      # `+nightly` on each command below: `rust-toolchain.toml` overrides the
      # default this action sets, and an explicit `+toolchain` overrides it.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # `denormals.rs`'s register tests are `#[cfg_attr(miri, ignore)]`d — they read
      # MXCSR, and miri has no x86 SSE intrinsics. They report as skipped
      # rather than vanishing, so the run says what it did not cover. So are
      # `rt/parked.rs`'s two: a thousand-odd publishes each, against a retired
      # list parked loans keep growing, is quadratic and runs past this job's
      # timeout under miri. They test a debug-only policy check, which the
      # native nextest run covers; `ArcLend`'s protocol is miri-tested below.
      - run: cargo +nightly miri test --locked -p tutti-rt --lib
      # The thread hand-over of `edit_ring` under 16 schedules: one seed
      # explores one interleaving.
      - run: cargo +nightly miri test --locked -p tutti-rt --lib edits
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..16
      # `ArcLend`'s unit tests, its no-alloc gate and its doctests.
      - run: cargo +nightly miri test --locked -p arc-lend
      # Its unit tests again over 16 scheduling seeds: the small
      # concurrent-readers stress test reports a race on a freed value if
      # either `SeqCst` fence in `ArcLend` goes, on some seeds only. (A plain
      # x86 run rarely does: only a store-buffer reordering shows it, which is
      # why this job and the loom one both exist.)
      - run: cargo +nightly miri test --locked -p arc-lend --lib
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..16

  # The loom models: `ArcLend`'s reclamation protocol and `PosRing`'s no-tear
  # protocol (both run against the shipped code — their atomics switch to
  # loom's under the flag) and the plugin
  # shm header's Release/Acquire protocol (a replica, for the reasons in
  # `tutti-shm-model/Cargo.toml`). `--cfg loom` is global, so each is built for
  # its own target only, never the workspace.
  #
  # Release, because loom explores every interleaving in-process. Seven of
  # the eight `ArcLend` models run unbounded (exhaustive, about 10 s together);
  # `registering_and_dropping_readers` runs at a preemption bound of 4
  # (about a minute), and every recorded mutation fails at a bound of 3. That
  # model at 5 (about 6 minutes) is `just loom-full`, for a change to `arc-lend`'s
  # protocol code itself; at 6 it did not finish in 25 minutes.
  loom:
    name: loom
    runs-on: ubuntu-24.04
    # About 12 minutes with the `PosRing` models: a model that stops
    # terminating fails here.
    timeout-minutes: 25
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - uses: actions/checkout@v4
      # ALSA headers: neither crate needs them, but cargo resolves the whole
      # workspace before building a member.
      - run: sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Clippy under `--cfg loom`: the flag changes constants the lints see
      # (`PROGRESS_EVERY` is 1, so `% PROGRESS_EVERY` tripped `modulo_one`),
      # and no other job compiles that configuration.
      - run: cargo clippy --locked -p arc-lend -p tutti-rt -p tutti-shm-model --all-targets -- -D warnings
      - run: cargo test --locked -p arc-lend --release --test loom -- --skip registering_and_dropping_readers
      - run: cargo test --locked -p arc-lend --release --test loom -- registering_and_dropping_readers --exact
        env:
          LOOM_MAX_PREEMPTIONS: 4
      # `PosRing`'s no-tear protocol (the disk stream's ring), against the
      # shipped code: nine models, about five minutes at this bound (the
      # shrink models a minute each); every recorded mutation fails at it but
      # the documented survivor (`tests/pos_ring_loom.rs`).
      - run: cargo test --locked -p tutti-rt --release --test pos_ring_loom
        env:
          LOOM_MAX_PREEMPTIONS: 4
      # `PackedAtomic`'s one property (no torn `[min, max]`), against the
      # shipped code: one model, seconds.
      - run: cargo test --locked -p tutti-rt --release --test packed_atomic_loom
      # `SeqWriter`/`SeqReader`'s one property (no copy mixing two writes),
      # against the shipped code: two models (the writer on either thread),
      # unbounded, about four seconds.
      - run: cargo test --locked -p tutti-rt --release --test seq_cell_loom
      # `AudioThreadCell`'s always-on borrow flag (no aliasing, a granted
      # borrow sees the last one's writes), against the shipped code: one
      # model, unbounded, under a second.
      - run: cargo test --locked -p tutti-rt --release --test cell_loom
      # `Doorbell` (a ring before, during or between parks is never lost),
      # against the shipped code. Unbounded (about 45 s): the plain-store
      # variant its model guards against needs 4 preemptions, and
      # `loom-parallel` sets 3 for the whole job, which cannot be unset.
      - run: cargo test --locked -p tutti-rt --release --test doorbell_loom
      - run: cargo test --locked -p tutti-shm-model --release

  # The parallel executor's runtime primitives (doc 013), each
  # against the shipped code: `SplitMut`/`SplitRw`'s claims, `JobGate`'s
  # borrowed-job hand-off and `TaskGraph`'s dispatch and self-reset. Their own
  # job, so neither this nor the one above nears its timeout. Every recorded
  # mutation in the three files fails at this bound.
  loom-parallel:
    name: loom (parallel executor)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: --cfg loom
      LOOM_MAX_PREEMPTIONS: 3
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p tutti-rt --release --test split_loom
      - run: cargo test --locked -p tutti-rt --release --test job_gate_loom
      - run: cargo test --locked -p tutti-rt --release --test task_graph_loom
      # `RequestWord` (no bit lost, each taken once, a raise orders what
      # preceded it) and `edit_ring` (each edit applied once, in order, no torn
      # slot), against the shipped code.
      - run: cargo test --locked -p tutti-rt --release --test request_word_loom
      - run: cargo test --locked -p tutti-rt --release --test edit_ring_loom
      # `level_cell` (a block lands whole in one take, none lost or twice),
      # against the shipped code.
      - run: cargo test --locked -p tutti-rt --release --test level_cell_loom
      # `drain_clock` (a write leaves the record only after a drain that must
      # have seen it has begun), against the shipped code.
      - run: cargo test --locked -p tutti-rt --release --test drain_clock_loom -- --nocapture
