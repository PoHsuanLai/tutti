# Drift check for the parked `bevy-tutti` adapter. This workflow MEASURES drift;
# it is NOT a gate.
#
# `crates/bevy-tutti` is out of the workspace (CLAUDE.md, "bevy-tutti is
# parked"): `ci.yml` never builds it and no lane maintains it. Once a week this
# job type-checks it against the engine as it is, so the size of the eventual
# un-parking migration is a number instead of a surprise. A red run here means
# "the adapter has drifted", which is expected and is not a reason to hold or
# revert an engine change.
#
# It never runs on a pull request and must never be a required check.

name: Parked bevy-tutti (drift)

on:
  schedule:
    # Mondays 05:17 UTC.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  drift:
    name: bevy-tutti drift
    runs-on: ubuntu-24.04
    # Not a gate: a failure is information, and must never block anything.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev pkg-config
      # The toolchain `rust-toolchain.toml` pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/bevy-tutti
      # Its own workspace root with no committed lock file: it resolves fresh,
      # so this also shows what a newer Bevy patch release does to it.
      - run: cargo check --manifest-path crates/bevy-tutti/Cargo.toml --features full,plugin --all-targets
