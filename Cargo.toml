[package]
name = "tutti"
version = "0.0.1"
edition = "2021"
description = "Real-time audio engine - umbrella crate coordinating modular audio subsystems"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["audio", "dsp", "midi", "synthesis", "real-time"]
categories = ["multimedia::audio", "multimedia"]
exclude = [
    "assets/plugins/*",
    "assets/soundfonts/*.sf2",
    "assets/soundfonts/*.sf3",
    ".github/",
    "TESTING.md",
]

[features]
# Default: Full feature set for backwards compatibility
# Note: Enables std for audio I/O (CPAL) - use default-features = false for no_std
default = ["full", "std"]

# Enables CPAL audio I/O (via `cpal`) and std on tutti-core for debug checks.
std = ["dep:cpal", "tutti-core/std", "tutti-units/std", "tutti-asset/std"]

# === Audio Format Features ===
# Each format only pulls in its specific codec
wav = ["tutti-core/wav", "tutti-sampler?/wav"]      # WAV/PCM - the standard
flac = ["tutti-core/flac", "tutti-sampler?/flac"]   # FLAC - lossless
mp3 = ["tutti-core/mp3", "tutti-sampler?/mp3"]      # MP3 - legacy compatibility
ogg = ["tutti-core/ogg", "tutti-sampler?/ogg"]      # OGG/Vorbis - open compressed

# All audio formats (convenience)
files = ["wav", "flac", "mp3", "ogg"]

# Full feature set (everything except plugin formats — those are opt-in via clap/vst3/vst2)
# Plugin hosting requires explicit format selection: --features clap, --features vst3, etc.
full = [
    "files",
    "midi", "midi-hardware", "mpe",
    "synth", "soundfont",
    "sampler",
    "export", "analysis",
    "automation",
    "dsp"
]

# All plugin formats (convenience)
all-plugins = ["clap", "vst3", "vst2", "au", "wasm"]

# === DSP Features ===
dsp = ["tutti-units/spatial"]  # Enables spatial (VBAP/binaural). Dynamics are always compiled.
convolution = ["tutti-units/convolution"]  # FFT convolution reverb (partitioned IR)

# === MIDI Features ===
midi = ["std", "dep:tutti-midi-io", "dep:tutti-midi-runtime", "tutti-core/midi", "tutti-export?/midi", "tutti-synth?/midi"]
midi-hardware = ["midi"]  # Alias for backward compat (midir is now always included with midi)
mpe = ["midi", "tutti-midi-io/mpe", "tutti-midi-runtime?/mpe"]          # MPE support
virtual-midi = ["midi", "tutti-midi-io/virtual-midi"]  # Virtual MIDI ports (macOS)

# === Synth Features ===
synth = ["dep:tutti-synth"]
# Note: soundfont enables tutti-synth/midi via soundfont feature (which depends on midi)
soundfont = ["std", "synth", "tutti-synth/soundfont"]

# === Plugin Hosting ===
# plugin enables the native-plugin infrastructure (subprocess `plugin-server`).
# WASM doesn't need the server side; `wasm-plugin` exists for that.
plugin = ["std", "dep:tutti-plugin", "dep:tutti-plugin-server"]
clap = ["plugin", "tutti-plugin-server/clap", "tutti-plugin/clap"]     # CLAP support
vst3 = ["plugin", "tutti-plugin-server/vst3", "tutti-plugin/vst3"]     # VST3 support
vst2 = ["plugin", "tutti-plugin-server/vst2", "tutti-plugin/vst2", "tutti-plugin/vst2-in-process"] # VST2 support — runs in-process (single AEffect for audio + editor); requires VST SDK
au = ["plugin", "tutti-plugin-server/au", "tutti-plugin/au"]         # Audio Unit support (macOS only)
# WASM Component Model audio plugins. In-process only — does NOT pull in
# `tutti-plugin-server`. Activate alongside `clap`/`vst3`/etc. when you
# want both native and WASM plugins; the umbrella `all-plugins` does this.
wasm = ["std", "dep:tutti-plugin", "tutti-plugin/wasm"]

# === Sampler Features ===
sampler = ["std", "wav", "dep:tutti-sampler"]

# === Export & Analysis ===
export = ["std", "dep:tutti-export"]
analysis = ["std", "dep:tutti-analysis"]

# === Automation ===
# Transport-driven envelope `AudioUnit` lives in `tutti-units::automation`
# (formerly its own `tutti-automation` crate; folded in for fewer
# single-file workspace members).
automation = ["tutti-units/automation"]

# === Bevy Asset Integration ===
# Derives `bevy_asset::Asset` + `bevy_reflect::TypePath` on loadable types so
# hosts can register them with `AssetServer` via the `TuttiAsset` /
# `TuttiStreamingAsset` traits. Pure additive — no Bevy dependency otherwise.
bevy_asset = [
    "std",
    "tutti-core/bevy_asset",
    "tutti-synth?/bevy_asset",
    "tutti-sampler?/bevy_asset",
]

# === Bevy ECS Integration ===
# Derives `bevy_ecs::Component` on the entity-as-node primitives
# (`AudioNode`, `NodeKind`, `Volume`, `Pan`, `Mute`, `PluginParam`).
# Hosts (e.g. bevy-tutti) supply the reconcile systems that translate
# component changes into graph mutations. Pure additive — no Bevy
# dependency otherwise.
bevy_ecs = [
    "std",
    "tutti-core/bevy_ecs",
]

[dependencies]
# Core (always included - minimal DSP)
# Note: default-features = false means no_std by default, features enable std when needed
tutti-core = { version = "0.0.1", path = "crates/tutti-core", default-features = false }
tutti-midi-types = { version = "0.0.1", path = "crates/tutti-midi-types", default-features = false }
tutti-units = { version = "0.0.1", path = "crates/tutti-units", default-features = false }
tutti-asset = { version = "0.0.1", path = "crates/tutti-asset", default-features = false }

# CPAL audio I/O — the umbrella owns the audio callback directly.
cpal = { version = "0.15", optional = true }

# Optional subsystems
tutti-sampler = { version = "0.0.1", path = "crates/tutti-sampler", optional = true, default-features = false }
tutti-analysis = { version = "0.0.1", path = "crates/tutti-analysis", optional = true }
tutti-export = { version = "0.0.1", path = "crates/tutti-export", optional = true }
tutti-midi-io = { version = "0.0.1", path = "crates/tutti-midi-io", optional = true }
tutti-midi-runtime = { version = "0.0.1", path = "crates/tutti-midi-runtime", optional = true, default-features = false }
tutti-synth = { version = "0.0.1", path = "crates/tutti-synth", optional = true, default-features = false }
tutti-plugin = { version = "0.0.1", path = "crates/tutti-plugin", optional = true }
tutti-plugin-server = { version = "0.0.1", path = "crates/tutti-plugin-server", optional = true, default-features = false }

thiserror = { version = "2", default-features = false }
arc-swap = "1.7"
atomic_float = "1.1"
dashmap = "6.1"
parking_lot = "0.12"
ringbuf = "0.4"

[dev-dependencies]
approx = "0.5"
assert_no_alloc = "1"
hound = "3.5"  # WAV file I/O for test reference files
winit = "0.30"
raw-window-handle = "0.6"
tracing-subscriber = "0.3"
tutti-clap-host = { path = "crates/tutti-clap-host" }
tutti-vst3-host = { path = "crates/tutti-vst3-host" }
tutti-au-host = { path = "crates/tutti-au-host" }
tutti-vst2-host = { path = "crates/tutti-vst2-host" }

# Example-specific feature requirements
# Examples 01-07 and 13 use only default features (no entry needed)

[[example]]
name = "08_load_audio"
required-features = ["sampler", "wav"]

[[example]]
name = "09_streaming"
required-features = ["sampler"]

[[example]]
name = "10_export"
required-features = ["export"]

[[example]]
name = "11_recording"
required-features = ["sampler", "export"]

[[example]]
name = "12_automation"
required-features = ["automation"]

[[example]]
name = "14_midi_synth"
required-features = ["midi", "synth"]

[[example]]
name = "15_midi_routing"
required-features = ["synth", "midi"]

[[example]]
name = "16_soundfont"
required-features = ["soundfont"]

[[example]]
name = "17_midi_hardware"
required-features = ["midi", "midi-hardware"]

[[example]]
name = "18_mpe"
required-features = ["midi", "mpe"]

[[example]]
name = "19_midi2"
required-features = ["midi"]

[[example]]
name = "20_dynamics"
required-features = ["dsp"]

[[example]]
name = "21_spatial_audio"
required-features = ["dsp"]

[[example]]
name = "22_plugin_loading"
required-features = ["plugin", "vst3"]

[[example]]
name = "23_plugin_editor"
required-features = ["plugin", "midi"]
