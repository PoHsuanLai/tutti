# Workspace root for the tutti audio engine + its Bevy adapter (bevy-tutti).
#
# tutti is a self-contained, third-party audio engine (Bevy-free at its core);
# bevy-tutti is the Bevy adapter layered on top. Together they form one
# workspace that lives OUTSIDE the dawai app workspace (the app's root
# Cargo.toml `exclude`s this tree). The app depends on these crates via
# cross-workspace path deps, exactly like a published dependency.
#
# The engine crates all live under crates/** (this dir is their common
# ancestor, so Cargo auto-discovers this root). bevy-tutti physically lives at
# ../bevy-tutti and joins via a member entry + its own `package.workspace`
# pointer back here.
[workspace]
resolver = "2"
members = [
    "crates/core/tutti-core",
    "crates/core/tutti-cpal",
    "crates/core/tutti-types",
    "crates/core/tutti-mod",
    "crates/core/tutti-export",
    "crates/core/tutti-io",
    "crates/midi/tutti-midi-io",
    "crates/midi/tutti-midi-types",
    "crates/midi/tutti-midi-runtime",
    "crates/dsp/tutti-sampler",
    "crates/dsp/tutti-synth",
    "crates/dsp/tutti-units",
    "crates/dsp/tutti-analysis",
    "crates/plugin/tutti-plugin",
    "crates/plugin/tutti-plugin-server",
    "crates/plugin/tutti-plugin-types",
    "crates/plugin/formats/tutti-vst3-host",
    "crates/plugin/formats/tutti-clap-host",
    "crates/plugin/formats/tutti-au-host",
    "crates/plugin/formats/tutti-vst2-host",
    "crates/plugin/vendor/vst-tutti",
    "crates/plugin/vendor/tutti-vst2-test-plugin",
    "crates/vendor/fundsp-tutti",
    "crates/vendor/rustysynth-tutti/rustysynth",
    "crates/vendor/tutti-clap-test-plugin",
    # The Bevy adapter — lives outside this dir tree; it sets `package.workspace
    # = "../tutti"` so Cargo counts it here rather than in the app workspace.
    "../bevy-tutti",
]

# Shared-dep pins the members inherit via `workspace = true`. Kept identical to
# the dawai app workspace's pins (root Cargo.toml) so both workspaces resolve the
# same bevy 0.19 / midi crate versions.
[workspace.dependencies]
bevy_app = { version = "0.19", default-features = false }
bevy_ecs = { version = "0.19", default-features = false, features = ["debug", "bevy_reflect"] }
bevy_log = { version = "0.19", default-features = false }
bevy_asset = { version = "0.19", default-features = false }
bevy_reflect = { version = "0.19", default-features = false }
bevy_tasks = "0.19"
thiserror = "2"

# Automation curves. We track an unreleased commit (0.4.1, which adds the
# `bevy_reflect` feature), so this is a direct git dep rather than crates.io
# `0.4` plus a `[patch]`. Members inherit it with `workspace = true`; keep the
# rev identical to the app workspace's pin, or the two trees resolve to
# disjoint copies of the same types across the cross-workspace path deps.
#
# `default-features = false` here is the floor: members that need reflection
# opt in with `features = ["bevy_reflect"]` on their own line.
audio-automation = { git = "https://github.com/PoHsuanLai/audio-automation.git", rev = "be7ccb9", default-features = false }

midly = { version = "0.5", default-features = false }
midi2 = { version = "0.11", default-features = false, features = [
    "channel-voice1",
    "channel-voice2",
    "system-common",
    "sysex7",
    "sysex8",
    "utility",
    "ump-stream",
    "flex-data",
    # Growable `Vec` message buffers, needed by the variable-length UMP-Stream
    # text notifications (Endpoint Name / Product Instance Id).
    "std",
] }
coremidi = "0.8"
# Raw CoreMIDI FFI + Core Foundation strings — needed only for the native-UMP
# virtual source (MIDISourceCreateWithProtocol / MIDIReceivedEventList), which
# coremidi 0.8's safe wrapper doesn't expose. Versions pinned to what coremidi
# 0.8 already pulls, so no new tree.
coremidi-sys = "3.2"
core-foundation = "0.9"

# Release codegen plus the symbols a sampling profiler needs to attribute them.
#
# `samply record` on a plain `--release` binary reports raw addresses: the
# default release profile carries no debuginfo, so the call tree is unreadable
# exactly where it matters. Inheriting release keeps the optimization decisions
# identical to what ships, so a profile taken here describes shipping code —
# profiling a debug build would mostly measure code that never runs in anger.
#
# `debug = "line-tables-only"` is enough for stack attribution and costs far
# less build time and disk than full DWARF.
#
# Belongs here rather than in bevy-tutti/Cargo.toml: bevy-tutti is a *member* of
# this workspace, and Cargo ignores `[profile]` in non-root manifests (with a
# warning that is easy to miss under `| tail`).
#
#   cargo build --manifest-path crates/bevy-tutti/Cargo.toml \
#       -p tutti-sampler --profile profiling --example profile_stretch_clone
#   samply record <target-dir>/profiling/examples/profile_stretch_clone
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# NOTE: no `[patch.crates-io]` here any more. `audio-automation` is a direct
# git dep in this workspace's `[workspace.dependencies]`, inherited by the four
# members that use it (tutti-mod, tutti-units, tutti-plugin,
# tutti-plugin-types), so no crates.io reference survives to redirect.
#
# The rev must stay identical to the app workspace's pin. The two workspaces
# resolve separately, and the app reaches these crates through cross-workspace
# path deps — so a rev skew here yields two disjoint copies of the same types
# and a `expected Curve, found Curve` error at the seam.
