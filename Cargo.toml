[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/tutti",
    "crates/tutti-session",
    "testing/tutti-verify",
    "crates/tutti-engine",
    "crates/tutti-transport",
    "crates/tutti-metering",
    "crates/tutti-tempo",
    "crates/tutti-curve",
    # The sample formats (`Sample`, `Float`, `I24`) and the borrowed mono, interleaved
    # and planar views over them, with the conversions between formats and layouts:
    # layer 1, `tutti-types` alone (and `libm`).
    "crates/tutti-buffers",
    "crates/tutti-cpal",
    "crates/tutti-types",
    "crates/tutti-codec",
    "crates/tutti-rt",
    "crates/tutti-ump",
    "crates/tutti-midi-protocol",
    "crates/tutti-voicing",
    "crates/tutti-midi-device",
    # Network MIDI 2.0 over UDP: the wire format, the Client and Host session
    # machines (no sockets), a `std::net` driver and mDNS discovery.
    # Depends on `tutti-ump` and `tutti-midi-device` alone.
    "crates/tutti-midi-network",
    "crates/tutti-graph",
    "crates/tutti-modulation",
    "crates/tutti-export",
    "crates/tutti-alsa-ffi",
    "crates/tutti-coremidi-ffi",
    "crates/tutti-midi-hardware",
    "crates/tutti-midi-file",
    "crates/tutti-midi-runtime",
    "crates/tutti-sampler",
    "crates/tutti-polysynth",
    "crates/tutti-soundfont",
    "crates/tutti-nodes",
    "crates/tutti-dsp",
    "crates/tutti-measure",
    "crates/tutti-plugin-ipc-ffi",
    "crates/tutti-plugin-ipc",
    "crates/tutti-plugin-host",
    "crates/tutti-plugin",
    "crates/tutti-plugin-server",
    "crates/tutti-plugin-probe",
    "crates/tutti-plugin-types",
    "crates/tutti-plugin-db",
    "testing/tutti-shm-model",
    "crates/tutti-vst3-host",
    "crates/tutti-clap-ffi",
    "crates/tutti-au-ffi",
    "crates/tutti-vst3-ffi",
    "crates/tutti-clap-host",
    "crates/tutti-au-host",
    "crates/tutti-vst2-host",
    "crates/tutti-vst2-ffi",
    "testing/tutti-vst2-test-plugin",
    "testing/tutti-vst2-shell-plugin",
    "testing/tutti-vst2-author",
    "testing/tutti-fixtures",
    "crates/tutti-sf2",
    "testing/tutti-clap-test-plugin",
    "testing/tutti-shared-plugin",
    "testing/tutti-shared-plugin-vst3-cpp",
    "testing/tutti-plugin-contract",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tutti-audio/tutti"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

# `cfg(loom)` (the loom models) and `cfg(docsrs)` (docs.rs) are set from outside
# the build, so they are declared here for every member.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(docsrs)'] }
missing_docs = "warn"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.dependencies]
thiserror = "2"
libloading = "0.9"
# `std` stays on: without it `dpi` calls `libm`, which it does not depend on.
dpi = "0.1.2"
keyboard-types = { version = "0.8.3", default-features = false }
rgb = { version = "0.8.53", default-features = false }

criterion = "0.8"

winnow = { version = "1", default-features = false, features = ["alloc", "binary"] }
# SHA-256 for Network MIDI 2.0's invitation digests (`tutti-midi-network`'s auth module).
sha2 = { version = "0.11.1", default-features = false }
# The operating system's random bytes, for a Host's authentication nonce.
getrandom = "0.4.3"
# mDNS / DNS-SD service advertisement and browsing, `tutti-midi-network`'s discovery module alone.
mdns-sd = "0.21.7"
# NFC composition for text written into UMP messages (M2-104 section 1.8).
unicode-normalization = { version = "0.1", default-features = false }
coremidi = "0.9"
coremidi-sys = "3.2"
core-foundation = "0.10"
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString"] }
objc2-core-midi = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "MIDIMessages", "MIDIServices", "MIDIUMPCI", "MIDIUMPEndpoint", "MIDIUMPEndpointManager", "MIDIUMPFunctionBlock"] }

# Release codegen with line tables, for a sampling profiler:
#   cargo build -p tutti-nodes --profile profiling --bench engine_render
#   samply record target/profiling/deps/engine_render-<hash> --bench
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# `aeffect_params` compares function addresses across crates, which holds only
# when nothing is optimized, so this crate stays at opt-level 0.
[profile.dev.package.tutti-vst2-author]
opt-level = 0

