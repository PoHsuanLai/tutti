# Workspace root for the tutti audio engine + its Bevy adapter (bevy-tutti).
#
# tutti is a self-contained audio engine, Bevy-free at its core: `bevy` is an
# optional, off-by-default feature on every engine crate that has one, and
# `tutti-units` has none at all. bevy-tutti is the Bevy adapter layered on top,
# and is the only Bevy-mandatory member.
#
# Every member lives under crates/**, including the adapter (crates/bevy-tutti).
# This tree was extracted from the dawai app repo, where the engine sat at
# crates/tutti/ and the adapter beside it at crates/bevy-tutti/ — which is why
# the adapter used to carry an explicit `package.workspace` pointer. It no
# longer needs one: the repo root and the workspace root are the same directory.
[workspace]
resolver = "2"
members = [
    # The Bevy-free umbrella. A pure re-export crate, and it must stay one:
    # the package of this name that existed before `4b5bd2fd` was the
    # workspace ROOT package and held `TuttiEngine`, a builder and the CPAL
    # callback, and it was dissolved because `bevy-tutti` needed that logic.
    # Re-exporting was never the problem; owning logic was. See
    # `crates/tutti/src/lib.rs` and `crates/tutti/tests/no_logic.rs`.
    "crates/tutti",
    "crates/core/tutti-core",
    "crates/core/tutti-cpal",
    "crates/core/tutti-types",
    "crates/core/tutti-node",
    "crates/core/tutti-graph",
    "crates/core/tutti-mod",
    "crates/core/tutti-export",
    "crates/core/tutti-io",
    "crates/midi/tutti-midi-hardware",
    "crates/midi/tutti-midi-file",
    "crates/midi/tutti-midi-types",
    "crates/midi/tutti-midi-runtime",
    "crates/dsp/tutti-sampler",
    "crates/dsp/tutti-polysynth",
    "crates/dsp/tutti-soundfont",
    "crates/dsp/tutti-nodes",
    "crates/dsp/tutti-spatial",
    "crates/dsp/tutti-analysis",
    "crates/plugin/tutti-plugin",
    "crates/plugin/tutti-plugin-server",
    "crates/plugin/tutti-plugin-types",
    # Test-only: a loom model of tutti-plugin's shm header protocol. A separate
    # crate because `--cfg loom` is global and breaks a transitive dep of
    # tutti-plugin; see its Cargo.toml.
    "crates/plugin/tutti-shm-model",
    "crates/plugin/formats/tutti-vst3-host",
    "crates/plugin/formats/tutti-clap-host",
    "crates/plugin/formats/tutti-au-host",
    "crates/plugin/formats/tutti-vst2-host",
    "crates/plugin/vendor/vst-tutti",
    "crates/plugin/vendor/tutti-vst2-test-plugin",
    "crates/plugin/vendor/tutti-fixture-resolve",
    "crates/vendor/fundsp-tutti",
    "crates/vendor/rustysynth-tutti/rustysynth",
    "crates/vendor/tutti-clap-test-plugin",
    # The Bevy adapter — the one member that mandates Bevy, and the umbrella the
    # engine is consumed through: it depends on the subsystem crates directly
    # and re-exports them.
    "crates/bevy-tutti",
]

# Lints every member inherits with `[lints] workspace = true`.
#
# `broken_intra_doc_links` is deny, not the default warn: a doc link into a
# module is exactly what rots when that module goes private, and a warning in a
# 30-crate build scrolls past unread. Was zero-warning across both workspaces
# when set, so nothing is grandfathered in. Vendored members deliberately do not
# inherit this — they carry pre-existing broken links we do not restyle.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
# The other half of the same failure: a link that still *resolves* but points at
# something the reader cannot reach. Privatizing a module turns every link to it
# into one of these, and rustdoc renders it as plain text with no clue why.
private_intra_doc_links = "deny"

# `cfg(loom)` is set from the command line (`RUSTFLAGS="--cfg loom"`) to run the
# loom models, so rustc cannot know it is intended and warns on every `#[cfg]`
# that names it. Declared once here for every member; `tutti-shm-model` declares
# it for itself because it cannot take the workspace table.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

# A system's argument list IS its dependency declaration, and a query filter is
# the query specification — aliasing either behind a type or a SystemParam bundle
# moves the one thing a reader needs out of the signature.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

# Shared-dep pins the members inherit via `workspace = true`.
#
# The bevy 0.19 line and the `audio-automation` rev must stay in step with any
# consumer that also depends on those crates directly — dawai does. Two revs of
# `audio-automation` are two disjoint copies of `Curve`, and the error surfaces
# at the consumer's seam as `expected Curve, found Curve`, nowhere near here.
[workspace.dependencies]
bevy_app = { version = "0.19", default-features = false }
bevy_ecs = { version = "0.19", default-features = false, features = ["debug", "bevy_reflect"] }
bevy_log = { version = "0.19", default-features = false }
bevy_asset = { version = "0.19", default-features = false }
bevy_reflect = { version = "0.19", default-features = false }
bevy_tasks = "0.19"
thiserror = "2"

# Benchmarks. One version across the workspace: `tutti-core` carried 0.5 —
# dead, never with a `[[bench]]` — while the vendored fundsp fork was already
# on 0.8, so the tree resolved two criterions and two criterion-plots.
#
# No `html_reports`: in criterion 0.8 the HTML report is compiled
# unconditionally and the feature is referenced only by criterion's own tests.
# It is a leftover from 0.3, and the CI comment that blamed it for pulling
# fontconfig was wrong — see the note in `.github/workflows/ci.yml`.
criterion = "0.8"

# Automation curves. We track an unreleased commit (0.4.1, which adds the
# `bevy_reflect` feature), so this is a direct git dep rather than crates.io
# `0.4` plus a `[patch]`. Members inherit it with `workspace = true`; keep the
# rev identical to the app workspace's pin, or the two trees resolve to
# disjoint copies of the same types across the cross-workspace path deps.
#
# `default-features = false` here is the floor: members that need reflection
# opt in with `features = ["bevy_reflect"]` on their own line.
audio-automation = { git = "https://github.com/PoHsuanLai/audio-automation.git", rev = "be7ccb9", default-features = false }

midly = { version = "0.5", default-features = false }
midi2 = { version = "0.11", default-features = false, features = [
    "channel-voice1",
    "channel-voice2",
    "system-common",
    "sysex7",
    "sysex8",
    "utility",
    "ump-stream",
    "flex-data",
    # Growable `Vec` message buffers, needed by the variable-length UMP-Stream
    # text notifications (Endpoint Name / Product Instance Id).
    "std",
] }
coremidi = "0.8"
# Raw CoreMIDI FFI + Core Foundation strings — needed only for the native-UMP
# virtual source (MIDISourceCreateWithProtocol / MIDIReceivedEventList), which
# coremidi 0.8's safe wrapper doesn't expose. Versions pinned to what coremidi
# 0.8 already pulls, so no new tree.
coremidi-sys = "3.2"
core-foundation = "0.9"

# Release codegen plus the symbols a sampling profiler needs to attribute them.
#
# `samply record` on a plain `--release` binary reports raw addresses: the
# default release profile carries no debuginfo, so the call tree is unreadable
# exactly where it matters. Inheriting release keeps the optimization decisions
# identical to what ships, so a profile taken here describes shipping code —
# profiling a debug build would mostly measure code that never runs in anger.
#
# `debug = "line-tables-only"` is enough for stack attribution and costs far
# less build time and disk than full DWARF.
#
# Belongs here rather than in crates/bevy-tutti/Cargo.toml: bevy-tutti is a
# *member* of this workspace, and Cargo ignores `[profile]` in non-root manifests
# (with a warning that is easy to miss under `| tail`).
#
#   cargo build -p tutti-sampler --profile profiling --example profile_stretch_clone
#   samply record target/profiling/examples/profile_stretch_clone
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# NOTE: no `[patch.crates-io]` here. `audio-automation` is a direct git dep in
# this workspace's `[workspace.dependencies]`, inherited by the four members that
# use it (tutti-mod, tutti-nodes, tutti-plugin, tutti-plugin-types), so no
# crates.io reference survives to redirect.
