[package]
name = "tutti-neural"
version = "0.0.1"
edition = "2021"
description = "Neural audio synthesis and effects for Tutti - DDSP, vocoders, amp sims"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["audio", "neural", "neural-synth", "synthesis", "machine-learning"]
categories = ["multimedia::audio"]

[dependencies]
# Tutti core (AudioUnit trait, shared types)
tutti-core = { path = "../tutti-core", default-features = false }
tutti-asset = { path = "../tutti-asset", default-features = false, optional = true }
bevy_asset = { version = "0.18", default-features = false, optional = true }
bevy_reflect = { version = "0.18", default-features = false, optional = true }

# MIDI support (optional)
tutti-midi = { path = "../tutti-midi", optional = true }
tutti-midi-runtime = { path = "../tutti-midi-runtime", optional = true, default-features = false }

# Lock-free channels and shared state
crossbeam-channel = "0.5.15"
arc-swap = "1.7"

# Serialization for Config, ModelId
serde = { version = "1", features = ["derive"] }

# Utilities
tracing = "0.1"
thiserror = "2"

# Thread priority (macOS)
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_no_alloc = "1"

[features]
default = []

# MIDI support for neural synths
midi = ["tutti-core/midi", "dep:tutti-midi", "dep:tutti-midi-runtime"]

# Enables `impl TuttiStreamingAsset for NeuralModel` + gated derives.
bevy_asset = [
    "dep:tutti-asset",
    "tutti-asset/std",
    "dep:bevy_asset",
    "dep:bevy_reflect",
]
