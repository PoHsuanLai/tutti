# bevy-tutti is the Bevy adapter for the tutti audio engine: a member of this
# repo's workspace, one tier above the engine crates it wraps.
[package]
name = "bevy-tutti"
version = "0.1.0"
edition = "2021"
description = "Bevy plugin for the Tutti real-time audio engine: the audio graph, transport, MIDI, plugin hosting and export as ECS entities and resources"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
# Minimal Bevy (just ECS + App, no rendering)
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_log.workspace = true
bevy_asset.workspace = true
bevy_reflect.workspace = true
# AsyncComputeTaskPool + Task<T> for non-RT subsystem work (export, region
# render, plugin scan, wave import, soundfont decode). See src/task.rs.
bevy_tasks.workspace = true

# Tutti audio engine — bevy-tutti depends on the subsystem crates directly.
# `tutti-core/bevy_ecs` enables the `Component`
# derives on the entity-as-node primitives. (The Asset derive on `WaveAsset`
# is `tutti-io/bevy`, enabled by `sampler` below.) bevy-tutti supplies the
# reconcile systems and the CPAL audio callback (src/engine/).
tutti-core = { path = "../core/tutti-core", default-features = false, features = ["bevy_ecs"] }
# `bevy` here is the `Reflect` derives only (no ECS surface). Needed
# unconditionally, not just under `modulation`: `AudioConfig` reflects its
# `ChannelLayout` field; ignoring it in reflection would reset a surround
# device config to Stereo on scene load.
tutti-types = { path = "../core/tutti-types", default-features = false, features = ["bevy"] }
tutti-midi-types = { path = "../midi/tutti-midi-types", default-features = false }
# The graph's vocabulary (`IntoNode`, `ParamSet`, `ForkByClone`): the node
# contract a spawn path takes.
tutti-graph = { path = "../core/tutti-graph" }
# The Bevy-free API layer (design 015): the `Session` behind `AudioGraphRes`,
# its builder, the `!Send` `Device`, the commit and its compensation, the
# event feeds and the crossfade retry. `device` always: this crate opens the
# sound card. Each subsystem feature below forwards to the session's own. Not
# re-exported: a Bevy app sees this crate's API (`param_graph_node!` names
# `SessionNode` through `__private`).
tutti-session = { path = "../tutti-session", default-features = false, features = ["device"] }
# tutti-nodes is pure DSP; its ECS binding is this crate.
# The optional `convolution` feature below adds the convolver on top.
tutti-nodes = { path = "../dsp/tutti-nodes", default-features = false }

# Spatial audio (VBAP + binaural panners), gated by our `spatial` feature.
tutti-spatial = { path = "../dsp/tutti-spatial", default-features = false, optional = true }

# Optional subsystems (gated by bevy-tutti features below).
# The modulation compiler the declarations compile through; the `modulation`
# feature turns on its `bevy` feature (Reflect on its vocabulary).
tutti-mod = { path = "../core/tutti-mod", optional = true, default-features = false }
tutti-sampler = { path = "../dsp/tutti-sampler", optional = true, default-features = false }
# The I/O edge. Not optional: `AudioPump` (`graph::pump`, always compiled)
# is a component around `tutti_io::Recorder`, the one pump loop. `audio-io` adds the device half and re-exports `WavOut`,
# `MicMonitorNode` and `Recorder` through `crate::io`; `sampler` adds
# `Wave`/`WaveAsset`/the decoder. With no codec feature the crate compiles no
# decoder.
tutti-io = { path = "../core/tutti-io" }
tutti-polysynth = { path = "../dsp/tutti-polysynth", optional = true }
# SoundFont playback. A separate crate, not a feature of the polysynth: a `.sf2`
# player shares no voice engine with a subtractive synth.
tutti-soundfont = { path = "../dsp/tutti-soundfont", optional = true }
tutti-export = { path = "../core/tutti-export", optional = true }
tutti-midi-hardware = { path = "../midi/tutti-midi-hardware", optional = true }
# SMF / Clip File codecs. Separate from `tutti-midi-hardware` because reading a
# `.mid` needs no OS MIDI port.
tutti-midi-file = { path = "../midi/tutti-midi-file", optional = true }
tutti-midi-runtime = { path = "../midi/tutti-midi-runtime", optional = true, default-features = false }
# `json` is explicit: this crate's `PluginsRes`/`PluginScanConfig` default path
# builds a `Plugins` over the file-backed catalog (`with_json_catalog` / `empty`),
# so it needs the ready-made impl rather than an app-supplied one. tutti-plugin
# itself ships no default features.
tutti-plugin = { path = "../plugin/tutti-plugin", optional = true, features = [
    "json",
] }
tutti-plugin-server = { path = "../plugin/tutti-plugin-server", optional = true, default-features = false }

# Plugin editor windows: native child-window parenting for hosted GUIs.
bevy_window = { version = "0.19", optional = true }
raw-window-handle = { version = "0.6", optional = true }

# The device layer: CPAL stream, RT callback, mic capture, driver lifecycle.
# Bevy-free — this crate supplies only the lifecycle around it.
tutti-cpal = { path = "../core/tutti-cpal", default-features = false }

# `ModSource::as_atomic` hands out an `AtomicF32` cell.
atomic_float = "1.1"

# Error handling
thiserror.workspace = true

# Diagnostics
tracing = "0.1"

# macOS: child-window attach + live-resize observer for plugin editors.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder"], optional = true }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString", "NSGeometry", "NSObject", "NSThread"], optional = true }

[features]
default = []

# Full feature set, minus the opt-in plugin formats and convolution.
full = [
    "wav", "flac", "mp3", "ogg",
    "midi", "midi-hardware",
    "synth", "soundfont",
    "sampler",
    "audio-io",
    "export",
    "spatial",
    "hrtf",
    "modulation",
]

# Spatial audio: the VBAP / binaural panner units, in their own crate.
# Names exactly one thing — the dependency on `tutti-spatial`.
spatial = ["dep:tutti-spatial", "tutti-session/spatial"]
# The binaural panner (`tutti-spatial/hrtf`, which pulls the `hrtf` crate), so
# `HrtfBinauralNode` can be spawned as a graph node.
hrtf = ["spatial", "tutti-spatial/hrtf", "tutti-session/hrtf"]

# FFT convolution reverb (partitioned IR) in tutti-nodes.
convolution = ["tutti-nodes/convolution", "tutti-session/convolution"]

# Modulation as declarations (`Mods`, `ModRoute`, `ModRange`) that compile to
# control lanes.
# `tutti-mod/bevy` is what makes the components reflectable — it carries the
# `Reflect` derives on the shape vocabulary and pulls the reflection features of
# the units and the curve type underneath.
modulation = ["dep:tutti-mod", "tutti-mod/bevy", "tutti-types/bevy", "tutti-session/modulation"]

# Audio formats. The decoder is `tutti-io`'s (always a dependency, see above);
# the sampler forwards to it too when it is on.
wav = ["tutti-io/wav", "tutti-sampler?/wav"]
flac = ["tutti-io/flac", "tutti-sampler?/flac"]
mp3 = ["tutti-io/mp3", "tutti-sampler?/mp3"]
ogg = ["tutti-io/ogg", "tutti-sampler?/ogg"]

# MIDI — two axes. `midi` is the hardware-free engine: types, bus, routing, clip
# playback, sequencer, MPE, the clock-master *generation*, built-in synth MIDI —
# no OS I/O. `midi-hardware` adds the OS layer (endpoint enumeration, connect,
# native-UMP send/receive) on top. `plugin` also enables `midi`.
# `tutti-polysynth` is absent from this list on purpose: it has no `midi`
# feature to enable. MIDI is unconditional there — a synth you cannot send a
# note to is not a smaller synth — so pulling the crate in at all brings it.
midi = [
    "dep:tutti-midi-file",
    "dep:tutti-midi-runtime",
    "tutti-core/midi",
    "tutti-session/midi",
]
# The OS MIDI layer. Note the feature and the crate share the name `midi-hardware`
# — deliberately, since the feature does nothing but pull the crate in.
# `tutti-midi-hardware` ships one feature, `test-support`, and it adds no
# capability — only its fake device list. That is a dev concern, enabled in the
# dev-dependency below rather than cascaded from here: a host enabling
# `midi-hardware` must not thereby link a fake backend.
midi-hardware = ["midi", "dep:tutti-midi-hardware", "tutti-session/midi-hardware"]

# Synth & sampling. bevy-tutti registers these with the AssetServer, so it
# wants the asset derives on both.
synth = ["dep:tutti-polysynth", "tutti-session/synth"]
# SoundFont does NOT imply `synth`: it is its own crate and pulls no voice
# engine. `midi` is required — `tutti-soundfont` needs `tutti-core/midi`, and
# enabling it here keeps `engine/build.rs` in step with the tutti-core that
# compiles under feature unification.
soundfont = ["midi", "dep:tutti-soundfont", "tutti-session/soundfont"]
# Clip playback: the butler streaming engine and the `.wav` asset loader
# (`tutti-sampler` → `crate::sampler`).
#
# Deliberately does NOT carry the live I/O edge — that is `audio-io` below.
# `tutti-sampler` depends on `tutti-io` for `Wave` and the decoder, but not
# the other way, so folding them together would make a host wanting only
# mic→WAV compile the butler thread to get it. `tutti-io/bevy` is the
# `WaveAsset` derive the `.wav` loader hands out.
sampler = [
    "wav",
    "dep:tutti-sampler",
    "tutti-sampler/bevy",
    "tutti-io/bevy",
    "tutti-session/sampler",
]

# The live audio I/O edge: mic capture, WAV sink, and the pump between them
# (`tutti-cpal/capture`, plus `tutti-io`'s re-exports → `crate::io`). Independent of `sampler` in
# both directions — recording a take needs no clip playback, and playing a clip
# needs no microphone.
audio-io = ["tutti-cpal/capture", "tutti-session/audio-io"]

# Plugin hosting: editor windows, catalog scan, crash detection.
# `tutti-plugin-server` pulls `tutti-core` with `midi` under feature
# unification, so `plugin` enables bevy-tutti's own `midi` to keep the two in
# step.
plugin = [
    "dep:tutti-plugin",
    "dep:tutti-plugin-server",
    "dep:bevy_window",
    "dep:raw-window-handle",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "midi",
    "tutti-session/plugin",
]
vst2 = ["plugin", "tutti-plugin-server/vst2", "tutti-plugin/vst2", "tutti-session/vst2"]
vst3 = ["plugin", "tutti-plugin-server/vst3", "tutti-plugin/vst3", "tutti-session/vst3"]
clap = ["plugin", "tutti-plugin-server/clap", "tutti-plugin/clap", "tutti-session/clap"]
au = ["plugin", "tutti-plugin-server/au", "tutti-plugin/au", "tutti-session/au"]

# Export.
export = ["dep:tutti-export", "tutti-session/export"]

[dev-dependencies]
# `contract::Direct`: a node driven by hand as a graph drives it, for the
# reference renders the export tests compare against.
tutti-graph = { path = "../core/tutti-graph", features = ["contract"] }
# `tutti_nodes::testing` stimulus nodes for tests, examples and doctests. The
# feature is dev-only, so the production dependency above stays without it.
tutti-nodes = { path = "../dsp/tutti-nodes", default-features = false, features = ["testing"] }
# `DiskStreamer::manual`, for the restart test that streams a clip through the
# engine (`sampler`): a hand-stepped butler refills between blocks, where the
# threaded one would race a render that runs faster than real time. Dev-only,
# for the same reason as the fake MIDI backend below.
tutti-sampler = { path = "../dsp/tutti-sampler", default-features = false, features = [
    "test-support",
] }
# The fake MIDI backend, for the session-layer tests. A headless CI box has no
# MIDI port, so without it every path through `MidiSession` is testable only
# against "no device found". Dev-only: `midi-hardware` deliberately does not
# cascade it.
tutti-midi-hardware = { path = "../midi/tutti-midi-hardware", features = [
    "test-support",
] }
# RT-safety regression tests use the
# allocation-disabling global allocator via the harness in lib.rs.
assert_no_alloc = { version = "1", default-features = false }
# The `Recorder` round-trip test writes a real `WavOut` to a temp dir and reads
# it back with `hound` — same crates the sampler's own capture tests use.
hound = "3.5"
tempfile = "3.8"
# `AudioTap::open` hands back a `ringbuf` consumer. Naming its `Consumer` trait
# is what lets the tap test pop the frames a simulated callback pushed, rather
# than asserting only that an `is_open` flag flipped. Same version tutti-core
# builds the ring with.
ringbuf = { version = "0.4", default-features = false, features = ["alloc"] }
# `tests/plugin_capture.rs` loads the reference CLAP plugin through a real
# `plugin-server`, to pin that a loaded plugin's shadow is captured and driven.
# A dev-dependency so cargo builds the cdylib as part of the same test run; the
# test finds it (and the server) beside its own binary.
tutti-clap-test-plugin = { path = "../vendor/tutti-clap-test-plugin" }
# `tests/plugin_vst2_meter.rs` loads the reference VST2 plugin in process
# (`vst2`), and `libloading` re-opens the image the host loaded to read what
# `audioMasterGetTime` answered: the linked rlib is a separate image with
# separate statics. The same pair, for the same reason, as `tutti-plugin`'s.
tutti-vst2-test-plugin = { path = "../plugin/vendor/tutti-vst2-test-plugin" }
libloading = "0.8"
tutti-fixture-resolve = { path = "../plugin/vendor/tutti-fixture-resolve" }

# `modulated_fader`: an `AudioParam` driven by modulation, showing the
# modulation-aware read path an app cannot reconstruct on its own.
[[example]]
name = "modulated_fader"
required-features = ["modulation"]

[[example]]
name = "offline_export"
required-features = ["export", "wav"]

# `modulation` as well as `plugin`: the example declares a param modulatable to
# show that a hosted plugin's numeric param ids reach the same modulation
# vocabulary a native node's `UnitParam` does. Without it the plugin still
# loads, binds and plays — that half just has nothing to demonstrate.
[[example]]
name = "plugin_host"
required-features = ["plugin", "modulation"]

# docs.rs renders with every feature on. `default = []` keeps the engine
# Bevy-free for consumers, but it would otherwise publish a page with the
# feature-gated half of the public API missing.
[package.metadata.docs.rs]
all-features = true
