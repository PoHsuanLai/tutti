# bevy-tutti is the Bevy adapter for the tutti audio engine. It belongs to the
# engine workspace rooted at ../tutti/Cargo.toml (NOT the dawai app workspace),
# so point at that root explicitly — bevy-tutti is the one member living outside
# the crates/tutti/ tree. The app depends on this crate via a cross-workspace
# path dep, like any published crate.
[package]
name = "bevy-tutti"
workspace = "../tutti"
version = "0.1.0"
edition = "2021"
description = "Bevy plugin for Tutti - Minimal Bevy integration for real-time audio"
license = "MIT OR Apache-2.0"

[dependencies]
# Minimal Bevy (just ECS + App, no rendering)
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_log.workspace = true
bevy_asset.workspace = true
bevy_reflect.workspace = true
# AsyncComputeTaskPool + Task<T> for non-RT subsystem work (export, region
# render, plugin scan, wave import, soundfont decode). See src/task.rs.
bevy_tasks.workspace = true

# Tutti audio engine — bevy-tutti is now the umbrella, so it depends on the
# subsystem crates directly (the old `tutti` umbrella package is dissolved).
# `tutti-core/bevy_ecs` enables the `Component` derives on the entity-as-node
# primitives; `tutti-core/bevy_asset` the Asset/TypePath derives on loadable
# types. bevy-tutti supplies the reconcile systems + the CPAL audio callback
# (relocated into src/engine/).
tutti-core = { path = "../tutti/crates/core/tutti-core", default-features = false, features = ["bevy_ecs", "bevy_asset"] }
# `bevy` here is the `Reflect` derives only (no ECS surface). Needed
# unconditionally, not just under `modulation`: `AudioConfig` reflects its
# `ChannelLayout` field, and a `#[reflect(ignore)]` there silently reset a
# surround device config to Stereo on scene load.
tutti-types = { path = "../tutti/crates/core/tutti-types", default-features = false, features = ["bevy"] }
tutti-midi-types = { path = "../tutti/crates/midi/tutti-midi-types", default-features = false }
# tutti-units is pure DSP now (its ECS binding moved to dawai_model::engine_bind).
# The optional features below add convolution / automation DSP on top.
tutti-units = { path = "../tutti/crates/dsp/tutti-units", default-features = false }

# Spatial audio (VBAP + binaural panners), gated by our `spatial` feature.
tutti-spatial = { path = "../tutti/crates/dsp/tutti-spatial", default-features = false, optional = true }

# Optional subsystems (gated by bevy-tutti features below).
# `routing` is the mod-matrix layer (targets, bus, table, driver); tutti-mod's
# own `bevy` feature is deliberately left off — it adds derives to
# `ModTargetId`/`LayerKey`, which this adapter keeps inside its resources rather
# than exposing as components.
tutti-mod = { path = "../tutti/crates/core/tutti-mod", optional = true, default-features = false, features = ["routing"] }
tutti-sampler = { path = "../tutti/crates/dsp/tutti-sampler", optional = true, default-features = false }
# The live I/O edge — `WavOut`, `MicMonitorNode`, `Recorder`. Separate from the
# sampler since the layering split; re-exported through `engine`.
tutti-io = { path = "../tutti/crates/core/tutti-io", optional = true }
tutti-polysynth = { path = "../tutti/crates/dsp/tutti-polysynth", optional = true }
# SoundFont playback. A separate crate, not a feature of the polysynth: a `.sf2`
# player shares no voice engine with a subtractive synth.
tutti-soundfont = { path = "../tutti/crates/dsp/tutti-soundfont", optional = true }
tutti-export = { path = "../tutti/crates/core/tutti-export", optional = true }
tutti-midi-hardware = { path = "../tutti/crates/midi/tutti-midi-hardware", optional = true }
# SMF / Clip File codecs. Separate from `tutti-midi-hardware` because reading a
# `.mid` needs no OS MIDI port.
tutti-midi-file = { path = "../tutti/crates/midi/tutti-midi-file", optional = true }
tutti-midi-runtime = { path = "../tutti/crates/midi/tutti-midi-runtime", optional = true, default-features = false }
# `json` is explicit: this crate's `PluginsRes`/`PluginScanConfig` default path
# builds a `Plugins` over the file-backed catalog (`with_json_catalog` / `empty`),
# so it needs the ready-made impl rather than an app-supplied one. tutti-plugin
# itself ships no default features. (Inherited from `tutti-plugin-host`, whose
# code this crate absorbed.)
tutti-plugin = { path = "../tutti/crates/plugin/tutti-plugin", optional = true, features = [
    "json",
] }
tutti-plugin-server = { path = "../tutti/crates/plugin/tutti-plugin-server", optional = true, default-features = false }

# Plugin editor windows: native child-window parenting for hosted GUIs.
bevy_window = { version = "0.19", optional = true }
raw-window-handle = { version = "0.6", optional = true }

# The device layer: CPAL stream, RT callback, mic capture, driver lifecycle.
# Bevy-free — this crate supplies only the lifecycle around it.
tutti-cpal = { path = "../tutti/crates/core/tutti-cpal", default-features = false }

# Engine graph + RT primitives (used by src/engine/).
arc-swap = "1.7"
atomic_float = "1.1"
parking_lot = "0.12"

# Error handling
thiserror.workspace = true

# Diagnostics
tracing = "0.1"

# MIDI UI observer channel
crossbeam-channel = "0.5"

# macOS: child-window attach + live-resize observer for plugin editors.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder"], optional = true }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString", "NSGeometry", "NSObject", "NSThread"], optional = true }

[features]
default = []

# Full feature set (mirrors the old tutti `full` minus opt-in plugin formats).
full = [
    "wav", "flac", "mp3", "ogg",
    "midi", "midi-hardware",
    "synth", "soundfont",
    "sampler",
    "audio-io",
    "export",
    "spatial",
    "modulation",
]

# Spatial audio: the VBAP / binaural panner units, now their own crate.
#
# NOTE: this used to be `["dsp", "tutti-units/spatial"]` while `dsp` was itself
# `["tutti-units/spatial"]` — i.e. the two features were synonyms for the same
# single flag, and both doc comments pointed at `tutti_units::spatial_graph`, a
# module that moved app-side to `dawai_model::engine_bind` long ago. `spatial`
# now names exactly one thing: the dependency on `tutti-spatial`.
spatial = ["dep:tutti-spatial"]

# FFT convolution reverb (partitioned IR) in tutti-units.
convolution = ["tutti-units/convolution"]

# Control-rate modulation: LFO sources and mod-matrix edges as ECS entities.
# `tutti-mod/bevy` is what makes the components reflectable — it carries the
# `Reflect` derives on the shape vocabulary and pulls the reflection features of
# the units and the curve type underneath.
modulation = ["dep:tutti-mod", "tutti-mod/bevy", "tutti-types/bevy"]

# Audio formats (codec on tutti-core + the sampler decoder).
wav = ["tutti-core/wav", "tutti-sampler?/wav"]
flac = ["tutti-core/flac", "tutti-sampler?/flac"]
mp3 = ["tutti-core/mp3", "tutti-sampler?/mp3"]
ogg = ["tutti-core/ogg", "tutti-sampler?/ogg"]

# MIDI — two axes. `midi` is the hardware-free engine: types, bus, routing, clip
# playback, sequencer, MPE, the clock-master *generation*, built-in synth MIDI —
# no OS I/O. `midi-hardware` adds the OS layer (endpoint enumeration, connect,
# native-UMP send/receive) on top. `plugin` also enables `midi`.
# `tutti-polysynth` is absent from this list on purpose: it has no `midi`
# feature to enable. MIDI is unconditional there — a synth you cannot send a
# note to is not a smaller synth — so pulling the crate in at all brings it.
midi = ["dep:tutti-midi-file", "dep:tutti-midi-runtime", "tutti-core/midi", "tutti-cpal/midi"]
# The OS MIDI layer. Note the feature and the crate share the name `midi-hardware`
# — deliberately, since the feature does nothing but pull the crate in.
# `tutti-midi-hardware` has no features of its own; it IS the OS edge.
midi-hardware = ["midi", "dep:tutti-midi-hardware"]

# Synth & sampling. bevy-tutti registers these with the AssetServer, so it
# wants the asset derives on both.
synth = ["dep:tutti-polysynth"]
# SoundFont no longer implies `synth`. It used to, because `SoundFontUnit` was a
# feature of the one synth crate; now it is its own crate and pulls no voice
# engine. `midi` stays: `tutti-soundfont` needs `tutti-core/midi`, and enabling
# it here keeps `engine/build.rs` in step with the tutti-core that compiles
# under feature unification.
soundfont = ["midi", "dep:tutti-soundfont"]
# Clip playback: the butler streaming engine and the `.wav` asset loader
# (`tutti-sampler` → `crate::stream`).
#
# This used to also carry the live I/O edge, on the reasoning that both were
# "sampler things". They are not: they are separate engine crates, neither
# depends on the other, and a host wanting only mic→WAV was compiling the
# butler thread to get it. `audio-io` below is that half.
sampler = ["wav", "dep:tutti-sampler", "tutti-sampler/bevy"]

# The live audio I/O edge: mic capture, WAV sink, and the pump between them
# (`tutti-io` + `tutti-cpal/capture` → `crate::io`). Independent of `sampler` in
# both directions — recording a take needs no clip playback, and playing a clip
# needs no microphone.
audio-io = ["dep:tutti-io", "tutti-cpal/capture"]

# Plugin hosting: editor windows, catalog scan, crash detection.
# `tutti-plugin-server` pulls `tutti-core` with `midi` under feature
# unification, so `plugin` enables bevy-tutti's own `midi` to keep the two in
# step.
plugin = [
    "dep:tutti-plugin",
    "dep:tutti-plugin-server",
    "dep:bevy_window",
    "dep:raw-window-handle",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "midi",
]
vst2 = ["plugin", "tutti-plugin-server/vst2", "tutti-plugin/vst2"]
vst3 = ["plugin", "tutti-plugin-server/vst3", "tutti-plugin/vst3"]
clap = ["plugin", "tutti-plugin-server/clap", "tutti-plugin/clap"]
au = ["plugin", "tutti-plugin-server/au", "tutti-plugin/au"]

# Export.
export = ["dep:tutti-export"]

[dev-dependencies]
# RT-safety regression tests (relocated engine audio_io/graph tests) use the
# allocation-disabling global allocator via the harness in lib.rs.
assert_no_alloc = { version = "1", default-features = false }
# The `Recorder` round-trip test writes a real `WavOut` to a temp dir and reads
# it back with `hound` — same crates the sampler's own capture tests use.
hound = "3.5"
tempfile = "3.8"
# `AudioTap::open` hands back a `ringbuf` consumer. Naming its `Consumer` trait
# is what lets the tap test pop the frames a simulated callback pushed, rather
# than asserting only that an `is_open` flag flipped. Same version tutti-core
# builds the ring with.
ringbuf = { version = "0.4", default-features = false, features = ["alloc"] }

# NOTE: examples 29_node_entities / 30_full_pipeline were removed — they
# demonstrated engine-side ECS param reconcile (Volume/SamplerSpeed/…), which
# moved app-side to dawai_model::engine_bind ("engine Bevy = Net pump only").
# `AudioParam` brought the generic half of that reconcile back engine-side, so a
# param example belongs here again — but only the modulation-aware read path,
# which is the part an app cannot reconstruct on its own.
[[example]]
name = "modulated_fader"
required-features = ["modulation"]

[[example]]
name = "offline_export"
required-features = ["export", "wav"]

# `modulation` as well as `plugin`: the example declares a param modulatable to
# show that a hosted plugin's numeric param ids reach the same modulation
# vocabulary a native node's `UnitParam` does. Without it the plugin still
# loads, binds and plays — that half just has nothing to demonstrate.
[[example]]
name = "plugin_host"
required-features = ["plugin", "modulation"]
