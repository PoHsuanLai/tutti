[package]
name = "bevy-tutti"
version = "0.1.0"
edition = "2021"
description = "Bevy plugin for Tutti - Minimal Bevy integration for real-time audio"
license = "MIT OR Apache-2.0"

[dependencies]
# Minimal Bevy (just ECS + App, no rendering)
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_log.workspace = true
bevy_asset.workspace = true
bevy_reflect.workspace = true
# AsyncComputeTaskPool + Task<T> for non-RT subsystem work (export, region
# render, plugin scan, wave import, soundfont decode). See src/task.rs.
bevy_tasks.workspace = true

# Tutti audio engine — bevy-tutti is now the umbrella, so it depends on the
# subsystem crates directly (the old `tutti` umbrella package is dissolved).
# `tutti-core/bevy_ecs` enables the `Component` derives on the entity-as-node
# primitives; `tutti-core/bevy_asset` the Asset/TypePath derives on loadable
# types. bevy-tutti supplies the reconcile systems + the CPAL audio callback
# (relocated into src/engine/).
tutti-core = { path = "../tutti/crates/tutti-core", default-features = false, features = ["bevy_ecs", "bevy_asset"] }
tutti-midi-types = { path = "../tutti/crates/tutti-midi-types", default-features = false }
# `std` enables tutti-units' `ecs` module (the DSP / spatial / automation /
# convolution spawn pipelines + reconcilers + plugins that bevy-tutti schedules).
tutti-units = { path = "../tutti/crates/tutti-units", default-features = false, features = ["std"] }
tutti-asset = { path = "../tutti/crates/tutti-asset", features = ["std"] }
# Decode-once wave cache (Bevy-native). It is a non-optional dep that always
# needs at least one codec (its API uses tutti-core's fundsp `Wave::load` /
# `WaveMetadata`, which are codec-gated), so enable `wav` unconditionally here;
# bevy-tutti's own wav/mp3/flac/ogg features add the rest.
tutti-wavecache = { path = "../tutti/crates/tutti-wavecache", default-features = false, features = ["wav"] }

# Optional subsystems (gated by bevy-tutti features below).
tutti-sampler = { path = "../tutti/crates/tutti-sampler", optional = true, default-features = false }
tutti-synth = { path = "../tutti/crates/tutti-synth", optional = true, default-features = false }
tutti-analysis = { path = "../tutti/crates/tutti-analysis", optional = true }
tutti-export = { path = "../tutti/crates/tutti-export", optional = true }
tutti-midi-io = { path = "../tutti/crates/tutti-midi-io", optional = true }
tutti-midi-runtime = { path = "../tutti/crates/tutti-midi-runtime", optional = true, default-features = false }
tutti-plugin = { path = "../tutti/crates/tutti-plugin", optional = true }
# Plugin-hosting ECS surface (editor windows, scan, crash-detect, param
# reconcile). Owns the bevy_window / raw-window-handle / objc2 deps now.
tutti-plugin-host = { path = "../tutti/crates/tutti-plugin-host", optional = true }

# CPAL audio I/O — bevy-tutti owns the audio callback (engine/audio_io.rs).
cpal = "0.15"

# Engine graph + RT primitives (used by src/engine/).
arc-swap = "1.7"
atomic_float = "1.1"
parking_lot = "0.12"
ringbuf = "0.4"

# Error handling
thiserror.workspace = true

# MIDI UI observer channel
crossbeam-channel = "0.5"

[features]
default = []

# Full feature set (mirrors the old tutti `full` minus opt-in plugin formats).
full = [
    "files",
    "midi", "midi-hardware", "mpe",
    "synth", "soundfont",
    "sampler",
    "export", "analysis",
    "automation",
    "dsp", "spatial",
]

# Spatial audio. The spatial ECS module + position-sync (GlobalTransform) live
# in `tutti_units::ecs::spatial`, behind tutti-units' own `spatial` feature.
spatial = ["dsp", "tutti-units/spatial"]

# DSP: the DSP spawn pipeline + reconcilers live (unconditionally) in
# `tutti_units::ecs`; this feature enables the prelude re-exports + the
# VBAP/binaural panner unit. Dynamics always compiled.
dsp = ["tutti-units/spatial"]

# FFT convolution reverb (partitioned IR) in tutti-units.
convolution = ["tutti-units/convolution"]

# Audio formats (codec on tutti-core + the wave cache decoder).
wav = ["tutti-core/wav", "tutti-sampler?/wav", "tutti-wavecache/wav"]
flac = ["tutti-core/flac", "tutti-sampler?/flac", "tutti-wavecache/flac"]
mp3 = ["tutti-core/mp3", "tutti-sampler?/mp3", "tutti-wavecache/mp3"]
ogg = ["tutti-core/ogg", "tutti-sampler?/ogg", "tutti-wavecache/ogg"]
files = ["wav", "flac", "mp3", "ogg"]

# MIDI.
midi = ["dep:tutti-midi-io", "dep:tutti-midi-runtime", "tutti-core/midi", "tutti-export?/midi", "tutti-synth?/midi"]
midi-hardware = ["midi", "tutti-midi-io/midi-hardware"]
mpe = ["midi", "tutti-midi-io/mpe", "tutti-midi-runtime?/mpe"]

# Synth & sampling. bevy-tutti always wants the bevy_asset derives on these
# (SoundFontAsset, StreamingSample) — it registers them with the AssetServer.
synth = ["dep:tutti-synth"]
soundfont = ["synth", "tutti-synth/soundfont", "tutti-synth/bevy_asset"]
sampler = ["wav", "dep:tutti-sampler"]

# Plugin hosting. The ECS surface (editor windows, scan, crash-detect, param
# reconcile) + the native subprocess plugin-server + editor windowing deps all
# live in `tutti-plugin-host`. bevy-tutti keeps a direct `tutti-plugin` dep for
# the catalog / handles / metadata re-exports in its prelude.
# `tutti-plugin-host` → `tutti-plugin-server` pulls `tutti-core` with `midi`,
# so tutti-core compiles with midi under feature unification. bevy-tutti's
# `engine/builder.rs` gates the `MidiRoutingTable` arg to `from_parts` on its
# OWN `midi` feature, so `plugin` must enable `midi` to keep the call shape in
# sync with the compiled `tutti-core`.
plugin = ["dep:tutti-plugin", "dep:tutti-plugin-host", "midi"]
vst2 = ["plugin", "tutti-plugin-host/vst2", "tutti-plugin/vst2", "tutti-plugin/vst2-in-process"]
vst3 = ["plugin", "tutti-plugin-host/vst3", "tutti-plugin/vst3"]
clap = ["plugin", "tutti-plugin-host/clap", "tutti-plugin/clap"]
au = ["plugin", "tutti-plugin-host/au", "tutti-plugin/au"]

# Export & analysis.
export = ["dep:tutti-export"]
analysis = ["dep:tutti-analysis"]

# Automation (transport-driven envelope AudioUnit in tutti-units::automation).
automation = ["tutti-units/automation"]

[dev-dependencies]
# RT-safety regression tests (relocated engine audio_io/graph tests) use the
# allocation-disabling global allocator via the harness in lib.rs.
assert_no_alloc = "1"

[[example]]
name = "29_node_entities"
required-features = ["sampler", "wav"]

[[example]]
name = "30_full_pipeline"
required-features = ["sampler", "wav", "automation"]
