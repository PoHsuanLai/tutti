[package]
name = "tutti-core"
version = "0.0.1"
edition = "2021"
description = "Core audio graph runtime kernel - Net/Graph, Transport, Metering, PDC"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["audio", "dsp", "real-time", "daw", "fundsp"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
# The DSP graph runtime (Net, transport, metering, PDC) is framework-free.
# `bevy` adds only the `Component` derive on `AudioNode`, so that an entity can
# *be* a node in the graph; the systems that reconcile against it live in the
# host adapter.
default = []
bevy = ["dep:bevy_ecs", "dep:bevy_reflect"]

# Back-compat alias: sibling crates still pass `features = ["bevy_ecs"]`, which
# maps onto the `bevy` feature.
bevy_ecs = ["bevy"]
# Asset loading is a distinct axis (fundsp's `WaveAsset` derives).
bevy_asset = ["bevy", "dep:bevy_asset", "fundsp/bevy_asset"]

# Individual audio format support (each pulls only its codec)
wav = ["fundsp/wav"]
flac = ["fundsp/flac"]
mp3 = ["fundsp/mp3"]
ogg = ["fundsp/ogg"]

# Optional subsystems
midi = []

# `Serialize`/`Deserialize` on the shared value vocabulary — the meter types and
# `ChannelLayout`. Needed by hosts that persist a document (the app writes its
# meter map into a CRDT); off by default, since the engine itself never
# serializes.
serde = ["tutti-types/serde"]

[dependencies]
thiserror.workspace = true
dyn-clone = { version = "1.0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }

# The node contract — `AudioUnit`, the planar block buffers, the numeric tower,
# the `Signal` routing vocabulary, `Setting`. Named directly rather than reached
# through the fork: this crate re-exports the contract to the rest of the
# engine, and a re-export should name the crate that *defines* what it forwards.
tutti-node = { version = "0.0.1", path = "../tutti-node" }

# Audio: the graph runtime (`Net`, `NetBackend`), the DSP node library, and the
# combinators that build sub-graphs out of it. What a consumer may reach through
# this crate is the named list in `dsp` — see that module's docs.
fundsp = { package = "fundsp-tutti", version = "0.23.0", path = "../../vendor/fundsp-tutti", default-features = false }

# MIDI types (pure types from tutti-midi-types) — always included for SmpteFrameRate etc.
tutti-midi-types = { version = "0.0.1", path = "../../midi/tutti-midi-types" }

# Shared RT primitives (AudioThreadCell, RtEventBuf).
tutti-types = { version = "0.0.1", path = "../tutti-types" }

# Lock-free (no_std compatible)
ringbuf = { version = "0.4", default-features = false, features = ["alloc"] }
crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }
atomic_float = { version = "1.1", default-features = false, features = ["atomic_f64"] }
arc-swap = "1.7"
hashbrown = { version = "0.16", default-features = false }
parking_lot = { version = "0.12", default-features = false }

# Bevy — optional, gated by the `bevy` feature. tutti-core hosts the ECS
# graph-reconcile hub (GraphReconcileSystems, AudioGraphRes,
# GraphReconcilePlugin, the param components) that every leaf audio crate
# schedules against. Pinned to the same Bevy minor as the rest of the
# workspace. `--no-default-features` drops all of these.
bevy_ecs = { version = "0.19", default-features = false, features = ["bevy_reflect"], optional = true }
bevy_reflect = { version = "0.19", default-features = false, optional = true }
bevy_asset = { version = "0.19", default-features = false, optional = true }

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
criterion.workspace = true
proptest = "1.9.0"
insta = { version = "1.41", features = ["yaml"] }
approx = "0.5"
tempfile = "3.8"
rand = "0.8"

[[bench]]
name = "engine_render"
harness = false
