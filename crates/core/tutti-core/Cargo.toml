[package]
name = "tutti-core"
version = "0.0.1"
edition = "2021"
description = "Core audio graph runtime kernel - Net/Graph, Transport, Metering, PDC"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["audio", "dsp", "real-time", "daw", "fundsp"]
categories = ["multimedia::audio"]

[features]
# tutti-core is a std crate; its DSP graph runtime (Net/AudioGraph, transport,
# metering, PDC) is Bevy-free. The `bevy` feature adds the ECS reconcile hub
# (GraphReconcileSystems, AudioGraphRes, GraphReconcilePlugin, the param
# Components) that leaf audio crates schedule against. On by default so Bevy
# consumers are unaffected; `--no-default-features` builds a Bevy-free kernel a
# non-Bevy DAW can link.
default = ["bevy"]
bevy = ["dep:bevy_ecs", "dep:bevy_reflect", "dep:bevy_app", "dep:bevy_tasks", "dep:bevy_log"]

# Back-compat aliases: sibling crates still pass `features = ["std"|"bevy_ecs"]`.
# `std` is unconditional now (no-op); `bevy_ecs` maps onto the `bevy` feature.
std = []
bevy_ecs = ["bevy"]
# Bevy asset loading is a distinct axis (fundsp WaveAsset derives); it also
# implies `bevy` since the loaders live in the ECS layer.
bevy_asset = ["bevy", "dep:bevy_asset", "fundsp/bevy_asset"]

# Individual audio format support (each pulls only its codec)
wav = ["fundsp/wav"]
flac = ["fundsp/flac"]
mp3 = ["fundsp/mp3"]
ogg = ["fundsp/ogg"]

# All file formats
files = ["wav", "flac", "mp3", "ogg"]

# Optional subsystems
midi = []

[dependencies]
thiserror = { version = "2", default-features = false }
dyn-clone = { version = "1.0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }

# Audio
fundsp = { package = "fundsp-tutti", version = "0.23.0", path = "../../vendor/fundsp-tutti", default-features = false, features = ["std"] }

# MIDI types (pure types from tutti-midi-types) — always included for SmpteFrameRate etc.
tutti-midi-types = { version = "0.0.1", path = "../../midi/tutti-midi-types" }

# Shared RT primitives (AudioThreadCell, RtEventBuf).
tutti-types = { version = "0.0.1", path = "../tutti-types" }

# Lock-free (no_std compatible)
ringbuf = { version = "0.4", default-features = false, features = ["alloc"] }
crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }
atomic_float = { version = "1.1", default-features = false, features = ["atomic_f64"] }
arc-swap = "1.7"
hashbrown = { version = "0.16", default-features = false }
parking_lot = { version = "0.12", default-features = false }

# Metering (EBU R128 loudness measurement). Unconditional now that tutti-core
# is std. crossbeam-channel carries the metering sample pipe.
crossbeam-channel = { version = "0.5" }
ebur128 = { version = "0.1" }

# Bevy — optional, gated by the `bevy` feature. tutti-core hosts the ECS
# graph-reconcile hub (GraphReconcileSystems, AudioGraphRes,
# GraphReconcilePlugin, the param components) that every leaf audio crate
# schedules against. Pinned to the same Bevy minor as the rest of the
# workspace. `--no-default-features` drops all of these.
bevy_ecs = { version = "0.19", default-features = false, features = ["bevy_reflect"], optional = true }
bevy_reflect = { version = "0.19", default-features = false, optional = true }
bevy_app = { version = "0.19", default-features = false, optional = true }
bevy_asset = { version = "0.19", default-features = false, optional = true }
bevy_tasks = { version = "0.19", optional = true }
bevy_log = { version = "0.19", default-features = false, optional = true }

[dev-dependencies]
assert_no_alloc = "1"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.9.0"
insta = { version = "1.41", features = ["yaml"] }
approx = "0.5"
tempfile = "3.8"
rand = "0.8"
