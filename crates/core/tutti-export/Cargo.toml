[package]
name = "tutti-export"
version = "0.0.1"
edition = "2021"
description = "Offline audio export and rendering for Tutti audio engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["audio", "export", "render", "wav", "flac", "aiff", "ogg"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = ["wav", "flac", "aiff", "ogg"]
wav = ["hound"]
flac = ["flacenc"]
aiff = ["aifc"]
ogg = ["vorbis_rs"]

[dependencies]
thiserror.workspace = true
tutti-core = { path = "../tutti-core", default-features = false }
tutti-types = { path = "../tutti-types", default-features = false }
# EBU R128 loudness measurement lives in tutti-analysis (the crate's
# Config/State/step analysis home) — `render_normalized_to_file` measures with
# it. Acyclic: tutti-analysis does NOT depend on tutti-export.
tutti-analysis = { path = "../../dsp/tutti-analysis", default-features = false }
rubato = "0.16"
hound = { version = "3.5", optional = true }
flacenc = { version = "0.4", optional = true }
vorbis_rs = { version = "0.5", optional = true }
# AIFF/AIFF-C. Replaced ~200 lines of hand-rolled IFF chunk writing (including a
# by-hand 80-bit IEEE 754 extended encoder); its I16/I24/F32 formats match our
# three bit depths exactly and it back-patches sizes on finalize, so AIFF
# streams like the other three.
aifc = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3.10"
approx = "0.5"
fundsp = { package = "fundsp-tutti", path = "../../vendor/fundsp-tutti", default-features = false, features = ["std"] }
# Convolution nodes for the end-to-end export integration tests. Acyclic:
# tutti-nodes does NOT depend on tutti-export.
tutti-nodes = { path = "../../dsp/tutti-nodes", default-features = false, features = ["convolution"] }
# Surround producer nodes (SpatialPannerNode + build_surround_mix) for the
# end-to-end multichannel-export integration test. Also acyclic.
tutti-spatial = { path = "../../dsp/tutti-spatial", default-features = false }
# Voice/VoicePool producers for `sampler_to_export.rs`, which renders a sampler
# voice through the offline clock and asserts on the exported pitch. Also
# acyclic: tutti-sampler does NOT depend on tutti-export.
tutti-sampler = { path = "../../dsp/tutti-sampler", default-features = false }
# An independent decoder for every container this crate writes, for
# `tests/oracle_decode.rs`. `hound` only speaks WAV, so FLAC/AIFF/Ogg were
# checked by frame count and header, never by content. The feature list is the
# minimum that reads what this crate emits — do NOT add `isomp4` or the
# mp3/aac bundles; nothing here writes those.
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "pcm", "flac", "ogg", "vorbis", "aiff"] }
