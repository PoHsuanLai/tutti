[package]
name = "tutti-export"
version = "0.0.1"
edition = "2021"
description = "Offline audio export and rendering for Tutti audio engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["audio", "export", "render", "wav", "flac", "aiff", "ogg"]
categories = ["multimedia::audio"]

[features]
default = ["wav", "flac", "aiff", "ogg"]
wav = ["hound"]
flac = ["flacenc"]
aiff = ["aifc"]
ogg = ["vorbis_rs"]
# Reads clip-reader / sampler units when rendering from a live graph.
# VERIFIED acyclic: tutti-sampler does NOT depend on tutti-export.
# tutti-sampler's file-loading path (its `Wave::load`) is codec-gated, so pull
# `wav` to give it a codec.
sampler = ["dep:tutti-sampler", "tutti-sampler/wav"]

[dependencies]
thiserror = "1.0"
tutti-core = { path = "../tutti-core", default-features = false }
tutti-types = { path = "../tutti-types", default-features = false }
# EBU R128 loudness measurement lives in tutti-analysis (the crate's
# Config/State/step analysis home). Acyclic: tutti-analysis does NOT depend on
# tutti-export.
tutti-analysis = { path = "../../dsp/tutti-analysis", default-features = false }
# Optional: reads clip-reader / sampler units when rendering from a live graph.
tutti-sampler = { path = "../../dsp/tutti-sampler", optional = true, default-features = false }
rubato = "0.16"
hound = { version = "3.5", optional = true }
flacenc = { version = "0.4", optional = true }
vorbis_rs = { version = "0.5", optional = true }
# AIFF/AIFF-C. Replaced ~200 lines of hand-rolled IFF chunk writing (including a
# by-hand 80-bit IEEE 754 extended encoder); its I16/I24/F32 formats match our
# three bit depths exactly and it back-patches sizes on finalize, so AIFF
# streams like the other three.
aifc = { version = "0.7", optional = true }

# The example measures loudness to show the composed-normalization path.
[dev-dependencies]
tutti-analysis = { path = "../../dsp/tutti-analysis", default-features = false }
tempfile = "3.10"
approx = "0.5"
fundsp = { package = "fundsp-tutti", path = "../../vendor/fundsp-tutti", default-features = false, features = ["std"] }
# Surround producer nodes (SpatialPannerNode + ChannelSumUnit) for the
# end-to-end multichannel-export integration test. Acyclic: tutti-units does
# NOT depend on tutti-export.
tutti-units = { path = "../../dsp/tutti-units", default-features = false, features = ["spatial"] }
