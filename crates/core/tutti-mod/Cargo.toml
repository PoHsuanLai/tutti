[package]
name = "tutti-mod"
version = "0.0.1"
edition = "2021"
description = "Modulation for the Tutti engine: a pure compiler from sources and routes to one control program per target"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["audio", "modulation", "lfo"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
# Everything (the compiler, the program, the shaping vocabulary) builds with
# no features.
default = []
# `Reflect` on the `LfoShape`/`Polarity` vocabulary a Bevy component carries.
#
# Enables the reflection features of the crates whose types ride inside the
# reflected ones (a `CurveType` inside a reflected route does not compile
# otherwise). These are reflection-completeness edges rather than the
# transitive Bevy leak the feature-hygiene rule guards against:
# `audio-automation/bevy_reflect` pulls `bevy_reflect` alone, no ECS and no
# runtime.
bevy = [
    "tutti-types/bevy",
    "audio-automation/bevy_reflect",
    "dep:bevy_reflect",
]

[dependencies]
# `CurveType`, the project's response-curve vocabulary, and the automation
# envelope that is a `Curve`.
audio-automation = { workspace = true }

# The value vocabulary: `Depth`, `Beat`, `PhaseIncrement`, `ParamAddr` (a
# target's param), `PlayReading`. A leaf crate: Bevy-free.
tutti-types = { path = "../tutti-types", default-features = false }

# Bevy derives, gated on the `bevy` feature.
bevy_reflect = { workspace = true, optional = true }

# docs.rs renders with every feature on. `default = []` keeps the engine
# Bevy-free for consumers, but it would otherwise publish a page with the
# feature-gated half of the public API missing.
[package.metadata.docs.rs]
all-features = true
