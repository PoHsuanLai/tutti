[package]
name = "tutti-types"
version = "0.0.1"
edition = "2021"
description = "Shared vocabulary for the Tutti audio engine — RT primitives, the AudioIn/AudioOut I/O traits, and latency compensation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["audio", "real-time"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
# The vocabulary crate every other engine crate names, so the engine-wide rule
# — Bevy is opt-in, never a default — is stated here rather than inherited.
default = []
# Enables `Serialize`/`Deserialize` on wire-carried value types: `ChannelLayout`
# (which rides the plugin-load IPC reply via `BusChannels`), `ChannelTopology`
# (which rides the same reply once the format hosts report placement), the meter
# vocabulary (which round-trips through the host's document), and the unit
# newtypes the latter is built from.
#
# `smallvec/serde` because `ChannelTopology` stores its positions inline; the
# same edge `tutti-plugin-types` already carries for `BusChannels`.
serde = ["dep:serde", "smallvec/serde"]
# Enables `Reflect` on the unit newtypes and the param vocabulary, so a Bevy
# component built from them can be inspected and scene-serialized. Reflection
# only — no `Component`/`Resource` derives: an app stores a `Volume`, never a
# bare `Db`.
bevy = ["dep:bevy_reflect"]

[dependencies]
# `const_generics` provides the blanket `Array for [T; N]` impl so RtEventBuf
# can be generic over its inline capacity `N`.
smallvec = { version = "1", default-features = false, features = ["const_generics"] }
# `Param<U>` wraps an `AtomicF32`; `AtomicSamplePosition` an `AtomicF64`.
atomic_float = { version = "1.1", default-features = false, features = ["atomic_f64"] }
serde = { version = "1", optional = true, features = ["derive"] }
# Reflection derives only, gated on `bevy`. No `bevy_ecs` here — this crate
# defines vocabulary, not ECS surface.
bevy_reflect = { workspace = true, optional = true }

# `RtPublish`'s and `PosRing`'s atomics become loom's under `--cfg loom`, so the
# models in `tests/rt_publish_loom.rs` and `tests/pos_ring_loom.rs` check the
# shipped protocols rather than replicas.
# Only that flag pulls this in; a normal build never sees loom.
#
#     RUSTFLAGS="--cfg loom" cargo test -p tutti-types --release --test rt_publish_loom
#
# This can live here, unlike `tutti-shm-model`, because nothing in this crate's
# dependency closure has `cfg(loom)` support of its own to break under the flag.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
# The baseline in `benches/rt_publish_read.rs`: `RtPublish` wrapped
# `ArcSwap` until its reclamation became structural, and the bench measures the
# read against the `load()` it replaced. Nothing in `src/` uses it.
arc-swap = "1.7"
criterion.workspace = true
assert_no_alloc = { version = "1", default-features = false }
# The meter `Deserialize` impls are the untrusted-document edge, so they are
# tested against a real format rather than a hand-rolled deserializer.
serde_json = "1"

[[bench]]
name = "rt_publish_read"
harness = false
