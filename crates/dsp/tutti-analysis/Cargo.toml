[package]
name = "tutti-analysis"
version = "0.0.1"
edition = "2021"
description = "Audio analysis tools: waveform thumbnails, transient detection, pitch detection, stereo correlation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["audio", "analysis", "waveform", "pitch", "dsp"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# `default-features = false` matches every sibling and keeps this crate immune
# if tutti-core ever grows a default — it has none today (`default = []`), so
# the flag currently suppresses nothing.
tutti-core = { path = "../../core/tutti-core", default-features = false }
# The unit vocabulary (Hz / Seconds / Samples / Amplitude / Confidence / …) and
# the downmix matrices. Direct rather than through tutti-core's re-exports so
# the units this crate's signatures speak are named at their source.
tutti-types = { path = "../../core/tutti-types", default-features = false }

# FFT for spectral analysis (transient detection, pitch detection)
rustfft = "6"

# EBU R128 loudness metering (`loudness`). An online meter, which is why the
# streaming Config/State/step shape fits it without buffering the signal.
ebur128 = "0.1"

# The `Error` enum's Display/Error impls.
thiserror.workspace = true

# Serialization (optional)
serde = { version = "1", features = ["derive"], optional = true }

[features]
# No `bevy` feature, and no default features. This crate is a library of
# analysis algorithms over `&[f32]`; the ECS surface it used to carry belonged
# to the live-analysis subsystem, which computed four analyses that nobody read
# and has been removed. A host that wants these results in an ECS wires them up
# on its own side.
default = []
# `dep:serde` (not bare `serde`) so this feature replaces the implicit
# optional-dep feature rather than colliding with it.
#
# `tutti-types/serde` is not optional bookkeeping: the only type this feature
# derives on (`PitchResult`) is built from `Hz` and `Confidence`, so without it
# the derive fails to find `Serialize`/`Deserialize` on its own fields and the
# crate does not compile under `--all-features`. Any new `serde` derive here
# will be over unit newtypes too, so the edge stays required.
serde = ["dep:serde", "tutti-types/serde"]

[dev-dependencies]
# Reproducible noise for the correlation tests, which otherwise hand-roll a
# generator. Seeded, so an uncorrelated-input assertion is not flaky.
#
# No `assert_no_alloc` here, unlike most sibling crates: everything this crate
# does is cold-path batch analysis that legitimately allocates its output. The
# one thread-adjacent path (`live.rs`) is being removed rather than gated.
rand = "0.8"
# An independent YIN, as a second opinion on ours, for `tests/oracle_pitch.rs`.
# Unmaintained (last release 2022) — see that file's header for why it is still
# a usable oracle and what is deliberately not compared against it.
pitch-detection = "0.3"
