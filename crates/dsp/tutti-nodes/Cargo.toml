[package]
name = "tutti-nodes"
version = "0.0.1"
edition = "2021"
description = "Built-in graph nodes for the Tutti audio engine: filters, delays, dynamics, modulation effects, LFOs, mixing, automation, convolution"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[lints]
workspace = true

[features]
default = []
# No `bevy` feature: ECS bindings are host-side. No `spatial` feature: the
# panners are `tutti-spatial`, which depends on this crate.
# FFT convolution reverb (partitioned IR).
convolution = ["dep:realfft"]
# `tutti_nodes::testing` — stimulus and plumbing nodes for tests, examples and
# benches (`Const`, `Osc`, `Through`, `Split`, `Sink`). Off by default and
# enabled only from `[dev-dependencies]`, so it is never production API: the
# same pattern as `tutti-sampler`'s `test-support`.
testing = []

[dependencies]
# The filters' `Real` (`src/filter/real.rs`) calls `libm`'s pure-Rust
# transcendentals, so results do not depend on the platform's C math library.
libm = "0.2.15"
# Engine vocabulary (units, `Param`, `ChannelLayout`, `Tail`) from tutti-core's
# root. default-features = false: tutti-nodes is pure DSP and needs none of
# tutti-core's Bevy layer.
tutti-core = { path = "../../core/tutti-core", default-features = false }

# Value vocabulary (the `Curve` trait), for `impl Curve for AutomationEnvelope`.
# tutti-core re-exports these too, but the impl needs to name `Curve` directly.
# default-features = false so bevy does not re-leak.
tutti-types = { path = "../../core/tutti-types", default-features = false }

# Pure, audio-free modulation math: the `Modulator` trait + `Lfo`/`LfoShape`,
# plus the `routing` feature's `ModTarget`/`AtomicTarget` and `ModParams`,
# re-exported for the plugin host's impl. `default-features = false` keeps
# tutti-mod's default-on `bevy` feature (Component/Reflect) from re-leaking into
# this deliberately bevy-free crate; `routing` is std-only, no bevy.
tutti-mod = { path = "../../core/tutti-mod", default-features = false, features = ["routing"] }

# The graph's param-modulation vocabulary (`ParamShaping`, `ShapeLut`):
# `ParamModShaping::shaping` bakes `tutti_mod::shape` into the table the
# compiler's fused step reads. tutti-graph depends on
# no tutti crate but tutti-types, so the edge adds no cycle.
tutti-graph = { path = "../../core/tutti-graph" }

# The real FFT under the partitioned convolver (optional, gated by the
# `convolution` feature). The convolution itself is this crate's
# (`convolution/convolver.rs`), so its IR spectra can be stored once and
# shared.
realfft = { version = "3.5", optional = true }

# Envelope primitives consumed by `AutomationLaneNode` + `Recorder`, re-exported via
# `tutti_nodes::automation`.
audio-automation = { workspace = true }

[dev-dependencies]
# The crate's own `testing` module, for its integration tests and bench. A
# self dev-dependency rather than `required-features`, which would *skip*
# those targets when the feature is off — see `tutti-sampler`'s manifest.
tutti-nodes = { path = ".", features = ["testing"] }
approx = "0.5"
# An independent RBJ-cookbook biquad, as a second opinion on the SVF's magnitude
# response in `tests/oracle_biquad.rs`. Adds no transitive crates — `num-traits`
# is already in the tree.
biquad = "0.5"
assert_no_alloc = { version = "1", default-features = false }
criterion.workspace = true
# `engine_render`'s Graph backend rows: the graph behind `Engine`.
# `contract`: the graph's sample-accuracy contract harness, which
# `tests/contract.rs` runs the latency-bearing nodes through.
tutti-graph = { path = "../../core/tutti-graph", features = ["contract"] }

# The engine's graph-render bench. It measures `Engine::process`, which is
# `tutti-core`'s, but it lives here because the graph it renders is built from
# this crate's nodes and `tutti-core` cannot depend on them (the edge runs the
# other way).
[[bench]]
name = "engine_render"
harness = false

[[bench]]
name = "width_generic"
harness = false

# docs.rs renders with every feature on. `default = []` keeps the engine
# Bevy-free for consumers, but it would otherwise publish a page with the
# feature-gated half of the public API missing.
[package.metadata.docs.rs]
all-features = true
