[package]
name = "tutti-sampler"
version = "0.0.1"
edition = "2021"
description = "Sampler, Butler disk-streaming thread, time stretch"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[lints]
workspace = true

[features]
default = ["wav"]

# Bevy ECS integration: the entity-as-node marker derives on the voice-pool
# handles, and nothing else. The Plugins and asset loaders moved to bevy-tutti
# (house rule R1), so this feature adds only `derive(Component)` — the DSP
# leaves (MemorySource, DiskVoice, VoicePool, the butler streaming engine, the
# stretch::Unit) compile Bevy-free for direct FunDSP-graph use either way.
bevy = ["dep:bevy_ecs"]

# Drive the butler's cycle by hand instead of by its thread.
#
# Exposes `DiskStreamer::manual` + `step_once`, which run the *same*
# `ButlerCycle::step` the butler thread runs — the thread contributes only
# pacing. A butler-driven stream is otherwise observable to an out-of-crate test
# only through wall clock (send, sleep, look), and the butler parks 1 ms idle /
# 3 ms healthy, so such a test is racing a producer it cannot see. Off by
# default: a host has no use for it, and the assertions it adds are about a
# constraint only a hand driver can violate.
test-support = []

# Audio format support - cascade to tutti-core
wav = ["tutti-core/wav"]
flac = ["tutti-core/flac"]
mp3 = ["tutti-core/mp3"]
ogg = ["tutti-core/ogg"]
files = ["wav", "flac", "mp3", "ogg"]

[dependencies]
# Base dependency - format features added above. `default-features = false`
# matches every sibling and keeps this crate immune if tutti-core ever grows a
# default — it has none today (`default = []`), so the flag currently
# suppresses nothing.
tutti-core = { path = "../../core/tutti-core", default-features = false }

# The STFT analysis grid + the one periodic Hann. The time-stretch vocoder is an
# STFT, so it shares `StftGeometry` (window/hop/rate validated together, COLA
# checked) and `window::hann` rather than keeping a ninth copy of each.
tutti-analysis = { path = "../tutti-analysis", default-features = false }

# The entity-as-node marker derives on the voice-pool handles. Optional,
# gated by the `bevy` feature.
bevy_ecs = { version = "0.19", default-features = false, optional = true }

# The vocoder's fixed-size, allocation-free FFT (`stretch::fft`). Same versions
# and features `fundsp-tutti` carries, so the tree still resolves one copy of
# each and the transform is the one it always was.
microfft = { version = "0.6.0", features = ["size-32768"] }
num-complex = { version = "0.4.6", default-features = false, features = ["libm"] }

tracing = "0.1"
thiserror = "2"

# Lock-free
ringbuf = "0.4"
crossbeam-channel = "0.5"
dashmap = "6.1"
arc-swap = "1.7"
parking_lot = "0.12"

# Parallel I/O
rayon = "1.10"

# Thread priority
thread-priority = "1.1"

# Async butler loop
smol = "2"
futures-lite = "2"



[dev-dependencies]
criterion.workspace = true
# The crate's own `test-support` surface, for the integration tests.
#
# A dev-dependency on self is how a feature reaches `tests/` unconditionally.
# The alternative — `required-features` on the test target — *skips* the test
# when the feature is off, so a plain `cargo nextest run` would report green
# without having run `tier_parity` at all. That is the failure mode this
# workspace's testing policy names outright: a test that cannot fail claims
# coverage it does not have, and one that silently does not run is the same
# claim with fewer clues.
tutti-sampler = { path = ".", features = ["test-support"] }
# Stimulus nodes (`tutti_nodes::testing`). No cycle: `tutti-nodes` names
# nothing above `tutti-core`.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }

tracing-subscriber = "0.3"
insta = { version = "1.41", features = ["yaml"] }
approx = "0.5"
tempfile = "3.8"
rand = "0.8"
serde_json = "1"
assert_no_alloc = { version = "1", default-features = false }

# Tests only: several fixtures write a real WAV to disk and stream it back, so
# they need a writer. The library itself no longer touches `hound` — the live
# WAV sink moved to `tutti-io` — which is why this is a dev-dependency and not
# a dependency. Moving it back up would re-add a codec to a DSP crate that
# decodes through `symphonia`.
hound = "3.5"

[[bench]]
name = "voice_pool"
harness = false
