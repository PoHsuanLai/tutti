[package]
name = "tutti-sampler"
version = "0.0.1"
edition = "2021"
description = "Sampler, Butler disk-streaming thread, time stretch"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[features]
default = ["bevy", "wav"]

# Bevy ECS integration: the playback Plugins, Components, Systems, and asset
# loaders. Off → the DSP leaves (SamplerUnit,
# StreamingSamplerUnit, TrackClipReaderUnit, the butler streaming engine, the
# stretch::Unit) compile Bevy-free for direct FunDSP-graph use. Pulls
# `tutti-core/bevy` (the playback systems schedule against the graph hub and
# `#[require(Volume)]` a core Component) and `tutti-core/bevy_asset` (the
# `WaveAsset` loader).
bevy = ["dep:bevy_ecs", "dep:bevy_app", "dep:bevy_reflect", "dep:bevy_asset", "dep:bevy_tasks", "dep:bevy_log", "tutti-core/bevy", "tutti-core/bevy_asset"]

# Audio format support - cascade to tutti-core
wav = ["tutti-core/wav"]
flac = ["tutti-core/flac"]
mp3 = ["tutti-core/mp3"]
ogg = ["tutti-core/ogg"]
files = ["wav", "flac", "mp3", "ogg"]

[dependencies]
# Base dependency - format features added above. default-features = false so
# tutti-core's default `bevy` doesn't leak in; this crate's `bevy` feature
# re-adds `tutti-core/bevy` + `tutti-core/bevy_asset`.
tutti-core = { path = "../../core/tutti-core", default-features = false }

# Bevy ECS integration: Components / Systems / Plugins live next to the audio
# logic. Optional, gated by the `bevy` feature.
bevy_ecs = { version = "0.19", default-features = false, optional = true }
bevy_app = { version = "0.19", default-features = false, optional = true }
bevy_reflect = { version = "0.19", default-features = false, optional = true }
bevy_asset = { version = "0.19", default-features = false, optional = true }
bevy_tasks = { version = "0.19", optional = true }
bevy_log = { version = "0.19", default-features = false, optional = true }

thiserror = "2"

# Lock-free
ringbuf = "0.4"
crossbeam-channel = "0.5"
dashmap = "6.1"
arc-swap = "1.7"
parking_lot = "0.12"

# Parallel I/O
rayon = "1.10"

# Thread priority
thread-priority = "1.1"

# Async butler loop
smol = "2"
futures-lite = "2"

# WAV encode for the WavOut AudioOut impl
hound = "3.5"


[dev-dependencies]
tracing-subscriber = "0.3"
insta = { version = "1.41", features = ["yaml"] }
approx = "0.5"
tempfile = "3.8"
rand = "0.8"
serde_json = "1"
assert_no_alloc = { version = "1", default-features = false }
