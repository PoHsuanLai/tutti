[package]
name = "tutti-soundfont"
version = "0.0.1"
edition = "2021"
description = "SoundFont (.sf2) synthesis for Tutti, via RustySynth"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

# No features. The crate IS the SoundFont unit — rustysynth and the MIDI inbox
# are both load-bearing, and gating either leaves a `SoundFontUnit` that cannot
# be built or cannot receive notes. It was split out of the old `tutti-synth`
# (renamed `tutti-polysynth`) because a `.sf2` player shares no code with a
# subtractive voice engine: the old `soundfont` feature reached for none of that
# crate's voice allocation, tuning, portamento or unison.

[lints]
workspace = true

[dependencies]
tutti-core = { path = "../../core/tutti-core", default-features = false, features = ["midi"] }
tutti-midi-types = { path = "../../midi/tutti-midi-types", default-features = false }
tutti-midi-runtime = { path = "../../midi/tutti-midi-runtime", default-features = false }
# `ForkSource`, `Legacy`: `SoundFontUnit::fork_source`, the unit's own way into
# a fork of the native graph (an export), as `tutti-plugin`'s `PluginClient`
# has one. No cycle: `tutti-graph` names only `tutti-types` and `tutti-node`.
tutti-graph = { path = "../../core/tutti-graph" }

rustysynth = { package = "rustysynth-tutti", version = "1.3.6", path = "../../vendor/rustysynth-tutti/rustysynth" }

thiserror = "2"

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
# Upstream rustysynth beside the vendored fork, for `tests/oracle_rustysynth.rs`.
# The production dep is already aliased to `rustysynth`, so upstream joins under
# its own name with no collision. Adds no transitive crates.
rustysynth_upstream = { package = "rustysynth", version = "1.3.6" }
