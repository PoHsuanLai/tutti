[package]
name = "tutti-soundfont"
version = "0.0.1"
edition = "2021"
description = "SoundFont (.sf2) playback as a Tutti graph node, via RustySynth"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

# No features. RustySynth and the MIDI event input are both essential: gating
# either would leave a `SoundFontUnit` that cannot be built or cannot receive
# notes. This is a separate crate from `tutti-polysynth` because a `.sf2`
# player shares none of that crate's voice allocation, tuning, portamento or
# unison.

[lints]
workspace = true

[dependencies]
tutti-core = { path = "../../core/tutti-core", default-features = false, features = ["midi"] }
tutti-midi-types = { path = "../../midi/tutti-midi-types", default-features = false }
tutti-midi-runtime = { path = "../../midi/tutti-midi-runtime", default-features = false }
# `Node`, `ForkSource`: the player as a graph node, and its own way into a
# fork of the graph (an export), as `tutti-plugin`'s `PluginClient`
# has one. No cycle: `tutti-graph` names no tutti crate but `tutti-types`.
tutti-graph = { path = "../../core/tutti-graph" }

rustysynth = { package = "rustysynth-tutti", version = "1.3.6", path = "../../vendor/rustysynth-tutti/rustysynth" }

thiserror = "2"

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
# `contract::{drive_in, Direct}`: the unit driven by hand, as a graph drives
# it, in its tests and allocation gate.
tutti-graph = { path = "../../core/tutti-graph", features = ["contract"] }
# Upstream rustysynth beside the vendored fork, for `tests/oracle_rustysynth.rs`.
# The production dep is already aliased to `rustysynth`, so upstream joins under
# its own name with no collision. Adds no transitive crates.
rustysynth_upstream = { package = "rustysynth", version = "1.3.6" }
