[package]
name = "tutti-synth"
version = "0.0.1"
edition = "2021"
description = "Synth building blocks for Tutti (voice allocation, modulation, unison, portamento, tuning, SoundFont)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[features]
default = ["midi", "bevy"]
std = []
midi = ["tutti-core/midi", "dep:tutti-midi-types", "dep:tutti-midi-runtime", "dep:tutti-midi-io"]
# Bevy ECS surface. The only Bevy code in this crate is the `soundfont` module's
# entity-as-node trigger + `.sf2` AssetLoader, so `soundfont` implies `bevy`.
# The voice/unison/portamento/tuning/synth DSP itself is Bevy-free.
bevy = ["dep:bevy_app", "dep:bevy_ecs", "dep:bevy_reflect", "dep:bevy_asset", "dep:bevy_tasks", "dep:bevy_log", "tutti-core/bevy_asset"]
soundfont = ["std", "dep:rustysynth", "midi", "bevy_asset"]
full = ["soundfont"]

# Propagates bevy_asset derives into rustysynth (gates on soundfont) and pulls
# the Bevy surface + tutti-core's bevy_asset.
bevy_asset = ["bevy", "soundfont", "rustysynth?/bevy_asset"]

[dependencies]
# default-features = false so tutti-core's default `bevy` doesn't leak in; the
# `bevy` feature above re-adds `tutti-core/bevy_asset` when wanted.
tutti-core = { path = "../../core/tutti-core", default-features = false }

# The `ModParams` control-rate-modulation trait + its target surface
# (`AtomicTarget`/`ModTarget`), so `PolySynth` implements the same modulation
# trait every other node does. `routing` (std-only) keeps it bevy-free.
tutti-mod = { path = "../../core/tutti-mod", default-features = false, features = ["routing"] }

# Bevy-native ECS surface (entity-as-node SoundFont trigger). Optional, gated by
# the `bevy` feature (implied by `soundfont`).
bevy_app = { version = "0.19", default-features = false, optional = true }
bevy_ecs = { version = "0.19", default-features = false, optional = true }
bevy_reflect = { version = "0.19", default-features = false, optional = true }
bevy_asset = { version = "0.19", default-features = false, optional = true }
bevy_tasks = { version = "0.19", optional = true }
bevy_log = { version = "0.19", default-features = false, optional = true }
tutti-midi-types = { path = "../../midi/tutti-midi-types", optional = true, default-features = false }
tutti-midi-runtime = { path = "../../midi/tutti-midi-runtime", optional = true, default-features = false }
# For MidiBusRes — registering a promoted SoundFont unit's sender on the bus
# inline at promote (acyclic: midi-io does not depend on synth).
tutti-midi-io = { path = "../../midi/tutti-midi-io", optional = true, default-features = false }

# Lock-free collections (for SoundFont manager)
dashmap = "6.1"

# RT-safe small vectors
smallvec = "1.13"

# Lock-free shared cell for the MIDI-source override slot, so an install on any
# fundsp graph-commit clone reaches the box the audio thread runs. See the
# plugin-side fix for the same pattern.
arc-swap = "1"

# Error handling
thiserror = "2"

# Optional - SoundFont
rustysynth = { package = "rustysynth-tutti", version = "1.3.6", path = "../../vendor/rustysynth-tutti/rustysynth", optional = true }

[dev-dependencies]
approx = "0.5"
assert_no_alloc = { version = "1", default-features = false }
tutti-midi-types = { path = "../../midi/tutti-midi-types", default-features = false }
tutti-midi-runtime = { path = "../../midi/tutti-midi-runtime", default-features = false }
