[package]
name = "tutti-units"
version = "0.0.1"
edition = "2021"
description = "Built-in AudioUnit implementations for the Tutti audio engine — LFOs, filters, delays, dynamics, modulation, spatial audio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[features]
default = ["bevy"]
# Bevy ECS integration: the param/marker components (`dsp_params`,
# `node_markers`), the reconcile/spawn systems (`dsp`, `reconcile`), and the
# graph-binding glue (`spatial_graph`, `pending_convolver`, `automation::graph`).
# Off → the DSP units (LFO/filter/delay/dynamics/modulation/spatial panners/
# convolver) compile Bevy-free; a non-Bevy host drives them through the tutti-core
# `AudioGraph` API directly.
# `tutti-core/bevy_asset` gives the `pending_convolver` glue (all(bevy,convolution))
# the `WaveAsset` loader; it also implies `tutti-core/bevy`.
bevy = ["dep:bevy_ecs", "dep:bevy_app", "dep:bevy_reflect", "dep:bevy_log", "dep:bevy_asset", "tutti-core/bevy", "tutti-core/bevy_asset"]
# VBAP + binaural panning DSP (Bevy-free) plus the position-sync graph binding
# (`spatial_graph`, Bevy-only — gated on `all(bevy, spatial)`). `bevy_transform`
# is only consumed by that binding.
spatial = ["dep:vbap", "dep:bevy_transform"]
# FFT convolution reverb (partitioned IR). The `pending_convolver` graph module
# loads IRs via `bevy_asset` + the `WaveAsset`, so the feature pulls
# tutti-core's `bevy_asset` + a default decode codec (`wav`). That graph binding
# is Bevy-only; the convolver DSP unit itself is Bevy-free.
convolution = ["dep:fft-convolver", "tutti-core/wav"]
# Transport-driven envelope nodes (`AutomationLane`). Folded in from the
# old `tutti-automation` crate; envelope primitives come from the
# `audio_automation` crate, re-exported via `tutti_units::automation`.
automation = ["dep:audio-automation", "dep:dashmap", "dep:parking_lot", "dep:serde"]

[dependencies]
# AudioUnit trait, DSP primitives, and (under `bevy`) the entity-as-node ECS hub
# from tutti-core. default-features = false so tutti-core's default `bevy` only
# comes in when this crate's `bevy` feature re-adds `tutti-core/bevy`.
tutti-core = { path = "../../core/tutti-core", default-features = false }

# Bevy ECS integration (the `dsp` / `reconcile` / `*_graph` modules): Components
# / Systems / Plugins live next to the audio logic. Optional, gated by `bevy`.
bevy_ecs = { version = "0.19", default-features = false, optional = true }
bevy_app = { version = "0.19", default-features = false, optional = true }
bevy_reflect = { version = "0.19", default-features = false, optional = true }
bevy_log = { version = "0.19", default-features = false, optional = true }
# `pending_convolver` (convolution+bevy) loads IR files via the AssetServer.
bevy_asset = { version = "0.19", default-features = false, optional = true }
# Spatial position sync reads `GlobalTransform` (spatial+bevy module).
bevy_transform = { version = "0.19", optional = true }

# Spatial audio VBAP library (optional)
vbap = { version = "0.1", optional = true }

# Partitioned FFT convolver (optional, gated by `convolution` feature)
fft-convolver = { version = "0.3", optional = true }

# Envelope primitives consumed by `AutomationLane` (optional, gated by
# the `automation` feature).
audio-automation = { version = "0.4", default-features = false, optional = true }
# Automation *recording* (`Recorder`/`Manager`): concurrent lane map, envelope
# lock, and snapshot (de)serialization. All gated by `automation`.
dashmap = { version = "6.1", optional = true }
parking_lot = { version = "0.12", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

# Error handling
thiserror = { version = "2", default-features = false }

[dev-dependencies]
approx = "0.5"
assert_no_alloc = { version = "1", default-features = false }
serde_json = "1"
