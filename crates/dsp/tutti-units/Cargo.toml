[package]
name = "tutti-units"
version = "0.0.1"
edition = "2021"
description = "Built-in AudioUnit implementations for the Tutti audio engine — LFOs, filters, delays, dynamics, modulation, spatial audio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[features]
default = []
# NOTE: tutti-units is now fully Bevy-free — the entire ECS binding layer
# (param/marker components, reconcile/spawn systems, spatial + automation graph
# glue, deferred convolver load) moved app-side to `dawai_model::engine_bind`
# ("engine Bevy = Net pump only"). This crate is pure DSP + the `set(UnitParam)`
# surface the app drives it through, so there is no longer a `bevy` feature.
# VBAP + binaural panning DSP.
spatial = ["dep:vbap"]
# FFT convolution reverb (partitioned IR). The convolver DSP unit is Bevy-free;
# its deferred-load ECS glue lives app-side now.
convolution = ["dep:fft-convolver"]
# Transport-driven envelope nodes (`AutomationLane`). Folded in from the
# old `tutti-automation` crate; envelope primitives come from the
# `audio_automation` crate, re-exported via `tutti_units::automation`.
automation = ["dep:audio-automation", "dep:tutti-types", "dep:dashmap", "dep:parking_lot", "dep:serde"]

[dependencies]
# AudioUnit trait + DSP primitives from tutti-core. default-features = false:
# tutti-units is pure DSP and needs none of tutti-core's Bevy layer.
tutti-core = { path = "../../core/tutti-core", default-features = false }

# Value vocabulary (the `Curve` trait), for `impl Curve for AutomationEnvelope`.
# Optional + gated by `automation`: only that path names the trait. tutti-core
# re-exports these too, but the impl needs to name `Curve` directly.
# default-features = false so bevy does not re-leak.
tutti-types = { path = "../../core/tutti-types", default-features = false, optional = true }

# Spatial audio VBAP library (optional)
vbap = { version = "0.1", optional = true }

# Partitioned FFT convolver (optional, gated by `convolution` feature)
fft-convolver = { version = "0.3", optional = true }

# Envelope primitives consumed by `AutomationLane` (optional, gated by
# the `automation` feature).
audio-automation = { version = "0.4", default-features = false, optional = true }
# Automation *recording* (`Recorder`/`Manager`): concurrent lane map, envelope
# lock, and snapshot (de)serialization. All gated by `automation`.
dashmap = { version = "6.1", optional = true }
parking_lot = { version = "0.12", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

# Error handling
thiserror = { version = "2", default-features = false }

[dev-dependencies]
approx = "0.5"
assert_no_alloc = { version = "1", default-features = false }
serde_json = "1"
