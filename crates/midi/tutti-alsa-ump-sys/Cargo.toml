[package]
name = "tutti-alsa-ump-sys"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Raw FFI to the ALSA sequencer and UMP functions that alsa-sys lacks"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-alsa-ump-sys"
readme = "README.md"
keywords = ["alsa", "ump", "midi", "ffi"]
categories = ["external-ffi-bindings", "multimedia::audio"]
# `alsa-sys` (via cpal) has `links = "alsa"`, so "asound" does not collide with
# it. The key is what carries this crate's probe result (`DEP_ASOUND_*`) to the
# crates that depend on it.
links = "asound"
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
