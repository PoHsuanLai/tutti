[package]
name = "tutti-midi-file"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "MIDI file codecs — Standard MIDI File (SMF) and MIDI 2.0 Clip File"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-midi-file"
readme = "README.md"
keywords = ["midi", "smf", "audio", "codec"]
categories = ["multimedia::audio", "parser-implementations"]

[lints]
workspace = true

[dependencies]
thiserror = "2"
tracing = "0.1"

tutti-midi-types = { path = "../tutti-midi-types" }
tutti-core = { path = "../../core/tutti-core", default-features = false, features = ["midi"] }

# midly's workspace base is no_std; re-add the `std` + `parallel` features this
# crate's SMF I/O relies on (midly's own default).
midly = { workspace = true, features = ["std", "parallel"] }

[dev-dependencies]
# The path-based clip tests need a private directory. nextest runs each test in
# its own process, so a fixed name under `std::env::temp_dir()` is a shared
# mutable path that two concurrent runs of the same binary race on.
tempfile = "3.8"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
