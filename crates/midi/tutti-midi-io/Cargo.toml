[package]
name = "tutti-midi-io"
version = "0.0.1"
edition = "2021"
description = "MIDI hardware I/O — device connection, SMF file read/write"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[features]
default = []
# OS MIDI I/O, native UMP. On macOS this pulls CoreMIDI (`coremidi` +
# `coremidi-sys` for the one call the safe wrapper lacks). Off → the engine still
# has full MIDI (bus, routing, clips, sequencer, MPE, clock-master *generation*)
# but no OS ports. This is the engine-vs-OS-I/O axis.
midi-hardware = ["coremidi", "coremidi-sys", "core-foundation"]

[dependencies]
thiserror = "2"
tracing = "0.1"

# Core types
tutti-midi-types = { path = "../tutti-midi-types" }
# The SMF / Clip File codecs. Re-exported for the `tutti_midi_io::smf` spelling;
# a consumer that only wants files should depend on it directly instead.
tutti-midi-file = { path = "../tutti-midi-file" }
tutti-core = { path = "../../core/tutti-core", default-features = false, features = ["midi"] }
# MIDI fan-out runtime (MidiBus, MpeProcessor, PerNoteExpression, MidiEventSlot).
# Acyclic: tutti-midi-runtime does NOT depend on tutti-midi-io.
tutti-midi-runtime = { path = "../tutti-midi-runtime", default-features = false }

# Lock-free
crossbeam-channel = "0.5"
arc-swap = "1.7"
ringbuf = "0.4"


[target.'cfg(target_os = "macos")'.dependencies]
coremidi = { workspace = true, optional = true }
# Raw FFI for the native-UMP virtual source (the safe `coremidi` wrapper only
# exposes MIDI-1.0 virtual sources). Enabled with `coremidi` via `midi-hardware`.
coremidi-sys = { workspace = true, optional = true }
core-foundation = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = "0.3"
# The RT gate in tests/rt_no_alloc_hardware_poll.rs drives the real
# `HardwareMidiInputs` through `MidiPreBlock` under a disabled allocator.
assert_no_alloc = { version = "1", default-features = false }

# These examples drive the OS `MidiIo` orchestrator, so they need the hardware axis.
[[example]]
name = "list_devices"
required-features = ["midi-hardware"]

[[example]]
name = "iac_loopback_test"
required-features = ["midi-hardware"]
