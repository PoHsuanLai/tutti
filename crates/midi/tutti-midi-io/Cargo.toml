[package]
name = "tutti-midi-io"
version = "0.0.1"
edition = "2021"
description = "MIDI hardware I/O — device connection, SMF file read/write"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[features]
default = ["bevy"]
# Bevy ECS integration: the bus / input / routing / sequence / scheduled /
# device / mpe / midi_plugin modules (Components / Events / Systems / Plugins).
# Off → the MIDI I/O + SMF + port management compiles Bevy-free (the real
# fan-out logic lives in tutti-midi-runtime, which is Bevy-free). Pulls
# `tutti-core/bevy` because the routing/sequence systems schedule against
# tutti-core's ECS graph hub (AudioGraphRes, GraphReconcileSystems, …).
bevy = ["dep:bevy_ecs", "dep:bevy_app", "dep:bevy_reflect", "dep:bevy_tasks", "dep:bevy_log", "tutti-core/bevy"]
# MPE: forwards to tutti-midi-runtime's `mpe` (MpeProcessor / PerNoteExpression)
# and compiles the `mpe` module (MpeReceiver component, MpeExpressionResource /
# MpeModeConfig, MpePlugin) + the `routing` MPE-receiver path. The `mpe` ECS
# surface additionally needs `bevy`.
mpe = ["tutti-midi-runtime/mpe"]
# Hardware device connect / disconnect / hot-plug poll (the `device` module:
# ConnectMidiDevice / MidiDeviceState / MidiIoRes / device systems). midir is a
# hard dep, so this only gates the Bevy ECS surface, not the underlying I/O.
midi-hardware = []
virtual-midi = ["coremidi"]

[dependencies]
thiserror = "2"
tracing = "0.1"

# Core types
tutti-midi-types = { path = "../tutti-midi-types" }
tutti-core = { path = "../../core/tutti-core", default-features = false, features = ["std", "midi"] }
# MIDI fan-out runtime (MidiBus, MpeProcessor, PerNoteExpression, MidiEventSlot).
# The `ecs` module's MidiBusRes wraps tutti-midi-runtime's MidiBus. Acyclic:
# tutti-midi-runtime does NOT depend on tutti-midi-io.
tutti-midi-runtime = { path = "../tutti-midi-runtime", default-features = false }

# Bevy ECS integration: Components / Events / Systems / Plugins live next to the
# I/O logic. Optional, gated by the `bevy` feature.
bevy_ecs = { version = "0.19", default-features = false, optional = true }
bevy_app = { version = "0.19", default-features = false, optional = true }
bevy_reflect = { version = "0.19", default-features = false, optional = true }
bevy_tasks = { version = "0.19", optional = true }
bevy_log = { version = "0.19", default-features = false, optional = true }

# Lock-free
crossbeam-channel = "0.5"
arc-swap = "1.7"
ringbuf = "0.4"
parking_lot = "0.12"

# MIDI hardware + file I/O. midly's workspace base is no_std; re-add the
# `std` + `parallel` features this crate's SMF I/O relies on (midly's default).
midir = { workspace = true }
midly = { workspace = true, features = ["std", "parallel"] }

[target.'cfg(target_os = "macos")'.dependencies]
coremidi = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = "0.3"
