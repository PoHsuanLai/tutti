[package]
name = "tutti-midi-io"
version = "0.0.1"
edition = "2021"
description = "MIDI hardware I/O — device connection, SMF file read/write"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[features]
default = []
# OS MIDI hardware I/O: pulls `midir` (device connect / poll / send, the `MidiIo`
# orchestrator + hardware input/output threads) and, on macOS, `coremidi` for
# virtual ports. Off → the engine still has full MIDI (bus, routing, clips,
# sequencer, MPE, clock-master *generation*) but no OS ports; `midir` is not
# linked. This is the engine-vs-OS-I/O axis.
midi-hardware = ["dep:midir", "coremidi", "coremidi-sys", "core-foundation"]

[dependencies]
thiserror = "2"
tracing = "0.1"

# Core types
tutti-midi-types = { path = "../tutti-midi-types" }
tutti-core = { path = "../../core/tutti-core", default-features = false, features = ["midi"] }
# MIDI fan-out runtime (MidiBus, MpeProcessor, PerNoteExpression, MidiEventSlot).
# The `ecs` module's MidiBusRes wraps tutti-midi-runtime's MidiBus. Acyclic:
# tutti-midi-runtime does NOT depend on tutti-midi-io.
tutti-midi-runtime = { path = "../tutti-midi-runtime", default-features = false }

# Bevy ECS integration: Components / Events / Systems / Plugins live next to the
# I/O logic. Optional, gated by the `bevy` feature.

# Lock-free
crossbeam-channel = "0.5"
arc-swap = "1.7"
ringbuf = "0.4"
parking_lot = "0.12"

# OS MIDI hardware, gated by `midi-hardware`. `midly` (SMF file I/O) is a hard
# dep — SMF read/write is engine-side, not OS hardware. midly's workspace base
# is no_std; re-add the `std` + `parallel` features this crate's SMF I/O relies
# on (midly's default).
midir = { workspace = true, optional = true }
midly = { workspace = true, features = ["std", "parallel"] }

[target.'cfg(target_os = "macos")'.dependencies]
coremidi = { workspace = true, optional = true }
# Raw FFI for the native-UMP virtual source (the safe `coremidi` wrapper only
# exposes MIDI-1.0 virtual sources). Enabled with `coremidi` via `midi-hardware`.
coremidi-sys = { workspace = true, optional = true }
core-foundation = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = "0.3"

# These examples drive the OS `MidiIo` orchestrator, so they need the hardware axis.
[[example]]
name = "list_devices"
required-features = ["midi-hardware"]

[[example]]
name = "iac_loopback_test"
required-features = ["midi-hardware"]
