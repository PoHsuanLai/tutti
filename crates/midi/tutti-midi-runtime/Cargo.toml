[package]
name = "tutti-midi-runtime"
version = "0.0.1"
edition = "2021"
description = "MIDI runtime state machines for the Tutti audio engine: registry, snapshot, routing table, MPE processor, CC mapping, output collection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["audio", "midi", "real-time", "daw"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []

[dependencies]
tutti-midi-types = { version = "0.0.1", path = "../tutti-midi-types" }
tutti-core = { version = "0.0.1", path = "../../core/tutti-core", default-features = false, features = ["midi"] }

# Lock-free / concurrent
arc-swap = "1.7"
atomic_float = "1.1"
crossbeam-queue = "0.3"
dashmap = "6.1"
parking_lot = "0.12"

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
# The native graph, to drive a clip source as a `Legacy` node through the
# graph engine and an offline `render_graph` (`tests/frame_exact_clip.rs`).
# No cycle: `tutti-graph` names only `tutti-types` and `tutti-node`.
tutti-graph = { path = "../../core/tutti-graph" }
