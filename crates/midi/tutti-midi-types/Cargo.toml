[package]
name = "tutti-midi-types"
version = "0.0.1"
edition = "2021"
description = "Pure MIDI types for Tutti - MidiEvent (UMP) + tutti-domain routing/MPE/sync"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["midi", "audio", "real-time"]
categories = ["multimedia::audio"]

[features]
default = []
# Serialization for the **authored-configuration** types only — MPE zone setup
# today. Off by default, so the crate's Bevy-free, dependency-light floor is
# unchanged for anyone who does not persist MIDI config.
#
# **This is not a licence to derive serde on the wire types.** The criterion, so
# it is not re-litigated: a MIDI type may carry these derives only when all three
# of `dawai_core::NoteEvent`'s reasons for existing are absent — it must be
# authored configuration, carry no audio-thread-stamped field, and have the same
# shape at rest as on the wire. `MpeMode` passes all three. `MidiEvent` fails the
# last two (its `frame_offset` is stamped by the audio thread against a block
# size the document never sees, and MIDI has no durational note record), so it
# must never get this treatment even now that the feature exists.
#
# Forwards to `tutti-types`, which is pulled with `default-features = false`:
# `MpeZoneConfig` is built from that crate's newtypes, so without the forward the
# derives here would fail to resolve.
serde = ["dep:serde", "tutti-types/serde"]

[dependencies]
bitflags = "2"
# `RtPublish` — atomic snapshot publishing for MidiRoutingTable.
tutti-types = { path = "../../core/tutti-types", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = [
    "derive",
] }

# midi2's feature set is fully specified at the workspace level (this is its
# only consumer). midly's alloc feature gives it owned event buffers.
midi2 = { workspace = true }
midly = { workspace = true, features = ["alloc"] }

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
# The MPE-config `Deserialize` impls are a document edge, so they are tested
# against a real format rather than a hand-rolled deserializer — the same
# argument `tutti-types` makes for its meter types.
serde_json = "1"
tutti-midi-types = { path = ".", features = ["serde"] }
