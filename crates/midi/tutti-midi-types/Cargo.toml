[package]
name = "tutti-midi-types"
version = "0.0.1"
edition = "2021"
description = "Pure MIDI types for Tutti - MidiEvent (UMP) + tutti-domain routing/MPE/sync"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["midi", "audio", "real-time"]
categories = ["multimedia::audio"]

[dependencies]
bitflags = "2"
# Atomic snapshot publishing for MidiRoutingTable.
arc-swap = "1.7"

# midi2's feature set is fully specified at the workspace level (this is its
# only consumer). midly's alloc feature gives it owned event buffers.
midi2 = { workspace = true }
midly = { workspace = true, features = ["alloc"] }

[dev-dependencies]
assert_no_alloc = "1"
