[package]
name = "tutti-au-host"
version = "0.0.1"
edition = "2021"
description = "Audio Unit (AUv2) plugin hosting for macOS via AudioToolbox framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[lints]
workspace = true

[dependencies]
tutti-plugin-types = { path = "../../tutti-plugin-types" }
# UMP MidiEvent decode (message view + MIDI 2.0→1.0 value scaling) for
# MusicDeviceMIDIEvent delivery to instrument / music-effect AUs.
tutti-midi-types = { path = "../../../midi/tutti-midi-types", default-features = false }
# The engine's unit newtypes: `Bpm`/`Beat` on `TransportState` and `Seconds` on
# `get_tail_time`. `default-features = false` drops this crate's codec/midi
# defaults, which the unit vocabulary does not need.
tutti-types = { path = "../../../core/tutti-types", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
coreaudio-sys = "0.2"
# `relax-void-encoding`: the AU Cocoa view factory protocol takes the unit as
# `AudioUnit`, an opaque pointer each plugin SDK binds under its own struct name
# (`ComponentInstanceRecord` from JUCE, `OpaqueAudioComponentInstance` from
# Apple's own view factories). objc2's debug-build encoding check compares what
# we send against the *plugin's* declared signature, so no single Rust type can
# satisfy every plugin. This feature lets `*mut c_void` stand in for any
# pointer, which is the case objc2 documents it for. It relaxes only pointer
# identity at the top level — arity, scalar types and struct layouts are still
# verified. See `editor/cocoa.rs::make_view`.
objc2 = { version = "0.6", features = ["relax-void-encoding"] }
# `AUEventListenerCreateWithDispatchQueue` takes an Objective-C *block*, not a
# function pointer, and it is the only listener constructor that works without a
# running CFRunLoop (see `listener.rs`). `block2` builds the block; it is already
# in the tree via objc2-foundation, named here because this crate uses it
# directly.
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSString", "NSGeometry", "NSObject"] }

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }

# The Cocoa editor-lifecycle tests, run on the main thread. `harness = false` so
# this target owns `main()` — the only way to reach the main thread under cargo,
# and macOS requires it for AppKit. `main()` also calls `mark_main_thread()`,
# which arms the affinity assert `AuEditor` makes. See the module docs; the test
# bodies are shared with `tests/au_gui_lifecycle.rs`, not duplicated.
[[test]]
name = "au_gui_lifecycle_main"
path = "tests/au_gui_lifecycle_main.rs"
harness = false
