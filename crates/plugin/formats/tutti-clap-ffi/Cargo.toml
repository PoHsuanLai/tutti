[package]
name = "tutti-clap-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The unsafe half of the CLAP host: safe handles over clap-sys"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-clap-ffi"
readme = "README.md"
keywords = ["clap", "audio", "plugin", "ffi"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
clap-sys = "0.5"
libloading = "0.8"
# `WindowHandle`, the one value whose unsafe constructor carries the claim that
# a parent window is valid; the editor entries take it by reference.
tutti-plugin-types = { path = "../../tutti-plugin-types" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The reference plugin the wrapper tests load; Cargo builds its cdylib in the
# same `cargo test` invocation and `build.rs` resolves the artifact path.
tutti-clap-test-plugin = { path = "../../../vendor/tutti-clap-test-plugin" }
tutti-fixture-resolve = { path = "../../vendor/tutti-fixture-resolve" }
assert_no_alloc = { version = "1", default-features = false }

[build-dependencies]
tutti-fixture-resolve = { path = "../../vendor/tutti-fixture-resolve" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
