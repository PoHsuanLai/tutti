[package]
name = "tutti-clap-host"
version = "0.1.0"
edition = "2021"
description = "CLAP plugin hosting library for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["clap", "audio", "plugin", "dsp", "host"]
categories = ["multimedia::audio"]
readme = "README.md"

[features]
# Off by default. Gates the speculative ~40% of the CLAP surface that no
# consumer (`tutti-plugin-server` loader, in-process GUI host) currently calls:
# param-indication, remote-controls, context-menus, triggers, tuning,
# audio-port reconfiguration, POSIX-fd polling, preset-load, and the plugin
# undo/redo + resource-directory extensions. The code and its tests stay
# compiled — enable the feature to build/test them — but the default build is
# lean. Consumed extensions (audio/note ports, params, state, gui, latency,
# voice-info, render-mode, note-names) are always on.
default = []
clap-extras = []

[dependencies]
arc-swap = "1.7"
bitflags = "2"
clap-sys = "0.5"
libloading = "0.8"
smallvec = "1"
thiserror = "2"
tutti-midi-types = { path = "../../../midi/tutti-midi-types" }
tutti-plugin-types = { path = "../../tutti-plugin-types" }
tutti-types = { path = "../../../core/tutti-types" }

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
tempfile = "3"
# The reference plugin used by the clap_conformance harness. As a
# dev-dependency, Cargo builds its cdylib in the same `cargo test`
# invocation (no nested cargo / no target-dir-lock deadlock); the rlib
# side gives the test the `ProcessCapture` type directly. build.rs
# resolves the cdylib artifact path for the test to dlopen.
tutti-clap-test-plugin = { path = "../../../vendor/tutti-clap-test-plugin" }
