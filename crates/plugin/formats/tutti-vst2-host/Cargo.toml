[package]
name = "tutti-vst2-host"
version = "0.0.1"
edition = "2021"
description = "VST2 plugin hosting (audio + native editor) via the vst-tutti crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[lints]
workspace = true

[dependencies]
arc-swap = "1"
# The two plugin→host callback queues. `ArrayQueue`, not `crossbeam-channel`:
# `automate` and `process_events` are invoked from inside the plugin's
# `processReplacing`, so their push runs on the audio thread. An unbounded
# channel allocates a list node there per event and can never report
# back-pressure; a bounded lock-free queue does neither.
crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }
parking_lot = "0.12"
smallvec = "1"
thiserror = "2"
tutti-midi-types = { path = "../../../midi/tutti-midi-types" }
tutti-plugin-types = { path = "../../tutti-plugin-types" }
# Tutti fork of the `vst` crate: adds the host-side audioMaster callbacks
# (get_sample_rate / size_window / io_changed / latency / process_level /
# automation_state) that upstream vst-rs's host_dispatch swallowed.
vst-tutti = { path = "../../vendor/vst-tutti" }

[build-dependencies]
# Shared with the other three crates that locate a reference plugin
# cdylib; see that crate's docs for the newest-wins and never-skip rules.
tutti-fixture-resolve = { path = "../../vendor/tutti-fixture-resolve" }

[dev-dependencies]
# The shared resolver; see its docs for the newest-wins rule.
tutti-fixture-resolve = { path = "../../vendor/tutti-fixture-resolve" }
assert_no_alloc = { version = "1", default-features = false }
# Used by the conformance harness to re-open the reference plugin and read
# its capture. The test cannot use the linked rlib's globals for this: the
# rlib and the cdylib are separate images with separate statics, and the host
# only ever touches the cdylib's. The rlib is still linked, for the shared
# `#[repr(C)]` type definitions.
libloading = "0.8"
tempfile = "3"
# The reference plugin the conformance harness loads. As a dev-dependency,
# Cargo builds its cdylib in the same `cargo test` invocation (no nested
# cargo / no target-dir-lock deadlock — see build.rs); the rlib side gives
# the test the `ProcessCapture` type and the misbehaviour switches directly
# instead of hand-mirroring them across the dlopen seam.
tutti-vst2-test-plugin = { path = "../../vendor/tutti-vst2-test-plugin" }
