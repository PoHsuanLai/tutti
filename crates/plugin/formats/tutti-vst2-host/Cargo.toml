[package]
name = "tutti-vst2-host"
version = "0.0.1"
edition = "2021"
description = "VST2 plugin hosting (audio + native editor) via the vst crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[dependencies]
arc-swap = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
smallvec = "1"
thiserror = "2"
tutti-midi-types = { path = "../../../midi/tutti-midi-types" }
tutti-plugin-types = { path = "../../tutti-plugin-types" }
vst = "0.3"

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
tempfile = "3"
