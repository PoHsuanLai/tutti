[package]
name = "tutti-vst3-host"
version = "0.1.0"
edition = "2021"
description = "VST3 plugin hosting library for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["vst3", "audio", "plugin", "dsp", "host"]
categories = ["multimedia::audio"]
readme = "README.md"

[dependencies]
libloading = "0.9"
thiserror = "2"
smallvec = "1.13"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tutti-midi-types = { path = "../../../midi/tutti-midi-types" }
tutti-plugin-types = { path = "../../tutti-plugin-types" }
tutti-types = { path = "../../../core/tutti-types" }
vst3 = "0.3"

# The VST3 macOS module entry point is `bundleEntry(CFBundleRef)`, so building a
# CFBundleRef for the `.vst3` bundle needs CoreFoundation. macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
tempfile = "3"
winit = "0.30"
raw-window-handle = "0.6"

[[example]]
name = "gui_test"
path = "examples/gui_test.rs"
