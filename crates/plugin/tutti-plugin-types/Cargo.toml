[package]
name = "tutti-plugin-types"
version = "0.0.1"
edition = "2021"
description = "Shared value vocabulary for tutti's plugin host crates (VST2/VST3/CLAP/AU)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[features]
default = []
# Enables Serialize/Deserialize on the wire-eligible types (TransportInfo,
# ParameterChanges, EditorSize, EditorCapabilities, WindowHandle). Required
# by tutti-plugin's bincode IPC protocol; host crates that don't need IPC
# don't pay for the serde dep.
serde = ["dep:serde", "smallvec/serde", "bitflags/serde", "tutti-types/serde"]

[dependencies]
smallvec = "1"
# Plugin capability flag set (`Features`) — wgpu-style bitflags.
bitflags = "2"
tutti-midi-types = { path = "../../midi/tutti-midi-types", default-features = false }
# The engine's AudioIn/AudioOut I/O vocabulary — this crate's `Sample` is the
# plugin-width narrowing of that vocabulary's element type, and `AudioBuffer`
# names its roles in the doc contract.
tutti-types = { path = "../../core/tutti-types" }
serde = { version = "1", features = ["derive"], optional = true }
# Parameter range/scaling, for `ParameterInfo::to_range`.
audio-automation = "0.4"
# Structured editor-open errors (`EditorError`).
thiserror = "1"

[dev-dependencies]
# Wire-format round-trip tests for the serde-gated metadata types.
bincode = "1"
