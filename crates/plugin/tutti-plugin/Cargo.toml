[package]
name = "tutti-plugin"
version = "0.0.1"
edition = "2021"
description = "Multi-process plugin hosting client for Tutti - loads VST2, VST3, CLAP plugins in isolated processes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[lints]
workspace = true

[features]
# Nothing on by default. This is a library: persistence and format support are
# the embedding app's choices, so every one of them is opt-in and the default
# build pulls no `serde_json` and no format FFI.
default = []

# Opt-in JSON-file-backed `JsonCatalog` — one ready-made `PluginCatalog` impl,
# not the shape of the API. Leave it off and bring your own impl, or skip the
# trait entirely and use the pure `discover` / `PluginRecord::probe` pair.
json = ["dep:serde_json"]

# In-process GUI support (loads plugin library in host for editor only)
vst3 = ["dep:tutti-vst3-host"]
clap = ["dep:tutti-clap-host"]
au = ["dep:tutti-au-host"]

# In-process VST2 hosting (audio + native editor on the host process).
# Unlike VST3/CLAP/AU, VST2 is always in-process: its `AEffect` fuses the
# editor and audio processor into one instance, so the editor cannot live
# in a different process from the audio. There is no subprocess VST2 path
# here.
vst2 = ["dep:tutti-vst2-host"]

[dependencies]
# Core types (for AudioUnit trait)
tutti-core = { path = "../../core/tutti-core", default-features = false, features = ["midi"] }
# The AudioIn/AudioOut I/O vocabulary — the slab is the concrete process edge
# realising those two roles (see util/transport/shm/slab.rs).
tutti-types = { path = "../../core/tutti-types" }

# Parameter range/scaling
audio-automation = { workspace = true }

# The `Curve` trait (+ its `AutomationEnvelope` impl), which the plugin
# parameter-automation source evaluates. default-features = false so bevy does
# not re-leak.
tutti-nodes = { path = "../../dsp/tutti-nodes", default-features = false }

# Lock-free f64 cursor for the harmony source
atomic_float = "1.1"

# MIDI support
tutti-midi-types = { path = "../../midi/tutti-midi-types", default-features = false }
tutti-midi-runtime = { path = "../../midi/tutti-midi-runtime" }

# Shared value vocabulary used across host crates + IPC protocol.
tutti-plugin-types = { path = "../tutti-plugin-types", features = ["serde"] }

# Serialization for IPC
serde = { version = "1", features = ["derive"] }
bincode = "1"

# Shared memory
memmap2 = "0.9"

# Lock-free channels and queues
arc-swap = "1"
crossbeam-channel = "0.5"
crossbeam = "0.8"
parking_lot = "0.12"
ringbuf = "0.4"

# Stack-first vectors for MIDI events (zero-alloc for typical case)
smallvec = { version = "1.13", features = ["serde"] }

# Cross-platform local IPC (Unix sockets on Unix, named pipes on Windows)
interprocess = { version = "2" }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Typed parent-window handle for editor embedding. The public API accepts
# anything that impls `HasWindowHandle` (Bevy, winit, wgpu, …) and we
# extract the platform pointer internally.
raw-window-handle = "0.6"

# In-process plugin GUI (optional — loads plugin library for editor only).
# `tutti-vst2-host` is different: it owns the audio path too (single in-process
# AEffect), since VST2 fuses editor and processor.
tutti-vst3-host = { path = "../formats/tutti-vst3-host", optional = true }
tutti-clap-host = { path = "../formats/tutti-clap-host", optional = true }
tutti-au-host = { path = "../formats/tutti-au-host", optional = true }
tutti-vst2-host = { path = "../formats/tutti-vst2-host", optional = true }

# Platform-specific (shared memory)
[target.'cfg(unix)'.dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Foundation",
    # `PeekNamedPipe`, which is how a control read gets a deadline on Windows.
    # `interprocess` refuses `set_recv_timeout` on a named pipe, so without this
    # every read blocks until the peer speaks. See `util::transport::control`.
    "Win32_System_Pipes",
] }

[dependencies.serde_json]
version = "1"
optional = true

[build-dependencies]
# Shared with the other three crates that locate a reference plugin
# cdylib; see that crate's docs for the newest-wins and never-skip rules.
tutti-fixture-resolve = { path = "../vendor/tutti-fixture-resolve" }

[dev-dependencies]
criterion.workspace = true
# The shared resolver; see its docs for the newest-wins rule.
tutti-fixture-resolve = { path = "../vendor/tutti-fixture-resolve" }
tempfile = "3"
assert_no_alloc = { version = "1", default-features = false }
tutti-midi-types = { path = "../../midi/tutti-midi-types" }
# The reference VST2 plugin the in-process lifecycle tests load, plus
# `libloading` to re-open the image the host loaded and read its capture — the
# linked rlib is a separate image with separate statics, so only the cdylib's
# globals see the host's calls. The same pair, for the same reasons, as
# `tutti-vst2-host`'s dev-dependencies; here it lets a test assert what the
# *node* dispatched rather than what the instance API does.
libloading = "0.8"
tutti-vst2-test-plugin = { path = "../vendor/tutti-vst2-test-plugin" }
# The reference CLAP plugin the OUT-OF-PROCESS correctness suites drive. A
# dev-dependency for the artifact, not the API: cargo builds its cdylib in this
# same `cargo test` (no nested cargo, no target-dir-lock deadlock) and
# `build.rs` names where it landed. Unlike the VST2 probe, nothing here links
# its rlib — the plugin is loaded by a `plugin-server` subprocess, so the only
# thing this crate needs is the file on disk.
tutti-clap-test-plugin = { path = "../../vendor/tutti-clap-test-plugin" }
# `dyn_clone::clone_box`, to probe a node's latency the way `LatencyGraph for
# Net` does. Reached through the same re-export fundsp uses, so the test clones
# exactly as the planner will.
dyn-clone = "1"

# NOTE: the `loom` model of this crate's shared-memory header protocol lives in
# the sibling `tutti-shm-model` crate, not here. `--cfg loom` is a global
# RUSTFLAG and `lfqueue` — a mandatory transitive dependency of this crate, via
# fundsp-tutti → tutti-core — fails to compile under it. See that crate's
# Cargo.toml for the full reasoning.

# docs.rs renders with every feature on. `default = []` keeps the engine
# Bevy-free for consumers, but it would otherwise publish a page with the
# feature-gated half of the public API missing.
[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "vst2_in_process"
harness = false
required-features = ["vst2"]
