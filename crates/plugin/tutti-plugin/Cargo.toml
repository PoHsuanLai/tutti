[package]
name = "tutti-plugin"
version = "0.0.1"
edition = "2021"
description = "Multi-process plugin hosting client for Tutti - loads VST2, VST3, CLAP plugins in isolated processes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[features]
default = ["json"]

# Default JSON-file-backed `JsonCatalog`. Disable with `default-features = false`
# if you're bringing your own `PluginCatalog` impl and don't want the
# serde_json dep.
json = ["dep:serde_json"]

# In-process GUI support (loads plugin library in host for editor only)
vst3 = ["dep:tutti-vst3-host"]
clap = ["dep:tutti-clap-host"]
au = ["dep:tutti-au-host"]

# In-process VST2 hosting (audio + native editor on the host process).
# Unlike VST3/CLAP/AU, VST2 is always in-process: its `AEffect` fuses the
# editor and audio processor into one instance, so the editor cannot live
# in a different process from the audio. There is no subprocess VST2 path
# here.
vst2 = ["dep:tutti-vst2-host"]

# In-process WASM Component Model audio plugins (`dawai:audio-plugin@0.1.0`)
# live in the separate `tutti-wasm-plugin` crate, which reuses this crate's
# `backend` machinery. The heavy wasmtime stack stays out of this crate.

[dependencies]
# Core types (for AudioUnit trait)
tutti-core = { path = "../../core/tutti-core", default-features = false, features = ["midi"] }
# The AudioIn/AudioOut I/O vocabulary — the slab is the concrete process edge
# realising those two roles (see util/transport/shm/slab.rs).
tutti-types = { path = "../../core/tutti-types" }

# Parameter range/scaling
audio-automation = "0.4"

# The `Curve` trait (+ its `AutomationEnvelope` impl), which the plugin
# parameter-automation source evaluates. default-features = false so bevy does
# not re-leak.
tutti-units = { path = "../../dsp/tutti-units", default-features = false }

# Lock-free f64 cursor for the harmony source
atomic_float = "1.1"

# MIDI support
tutti-midi-types = { path = "../../midi/tutti-midi-types", default-features = false }
tutti-midi-io = { path = "../../midi/tutti-midi-io", default-features = false }
tutti-midi-runtime = { path = "../../midi/tutti-midi-runtime" }

# Shared value vocabulary used across host crates + IPC protocol.
tutti-plugin-types = { path = "../tutti-plugin-types", features = ["serde"] }

# Serialization for IPC
serde = { version = "1", features = ["derive"] }
bincode = "1"

# Shared memory
memmap2 = "0.9"

# Lock-free channels and queues
arc-swap = "1"
crossbeam-channel = "0.5"
crossbeam = "0.8"
parking_lot = "0.12"
ringbuf = "0.4"

# Stack-first vectors for MIDI events (zero-alloc for typical case)
smallvec = { version = "1.13", features = ["serde"] }

# Cross-platform local IPC (Unix sockets on Unix, named pipes on Windows)
interprocess = { version = "2" }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Typed parent-window handle for editor embedding. The public API accepts
# anything that impls `HasWindowHandle` (Bevy, winit, wgpu, …) and we
# extract the platform pointer internally.
raw-window-handle = "0.6"

# Fork-based plugin probe (Unix)
libc = "0.2"

# In-process plugin GUI (optional — loads plugin library for editor only).
# `tutti-vst2-host` is different: it owns the audio path too (single in-process
# AEffect), since VST2 fuses editor and processor.
tutti-vst3-host = { path = "../formats/tutti-vst3-host", optional = true }
tutti-clap-host = { path = "../formats/tutti-clap-host", optional = true }
tutti-au-host = { path = "../formats/tutti-au-host", optional = true }
tutti-vst2-host = { path = "../formats/tutti-vst2-host", optional = true }

# Platform-specific (shared memory)
[target.'cfg(unix)'.dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[dependencies.serde_json]
version = "1"
optional = true

[dev-dependencies]
tempfile = "3"
assert_no_alloc = { version = "1", default-features = false }
tutti-midi-types = { path = "../../midi/tutti-midi-types" }
