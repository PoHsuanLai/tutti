# vst-tutti — a Tutti fork of the `vst` crate (vst-rs 0.3.0).
#
# The fork adds host-side `audioMaster` query callbacks upstream vst-rs
# swallows in its `host_dispatch` `_ =>` arm (GetSampleRate, SizeWindow,
# IOChanged, GetInputLatency, GetOutputLatency, GetCurrentProcessLevel,
# GetAutomationState): the opcodes already exist in `host::OpCode`, so the
# fork only adds the matching `Host`-trait methods + dispatch arms.
[package]
name = "vst-tutti"
version = "0.3.0"
edition = "2021"
resolver = "2"
description = "VST 2.4 API implementation in Rust (Tutti fork with host-side audioMaster callbacks). Create plugins or hosts."
readme = "README.md"
keywords = ["vst", "vst2", "plugin"]
license = "MIT"
homepage = "https://github.com/PoHsuanLai/Tutti"
repository = "https://github.com/PoHsuanLai/Tutti"
authors = [
    "Marko Mijalkovic <marko.mijalkovic97@gmail.com>",
    "Boscop",
    "Alex Zywicki <alexander.zywicki@gmail.com>",
    "doomy <notdoomy@protonmail.com>",
    "Ms2ger",
    "Rob Saunders",
    "David Lu",
    "Aske Simon Christensen",
    "kykc",
    "Jordan Earls",
    "xnor104",
    "Nathaniel Theis",
    "Colin Wallace",
    "Henrik Nordvik",
    "Charles Saracco",
    "Frederik Halkjær",
]

[dependencies]
bitflags = "1"
libc = "0.2"
libloading = "0.7"
log = "0.4"
num-traits = "0.2"
num_enum = "0.5.2"
