[package]
name = "tutti-alsa-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe bindings to the Linux ALSA sequencer and its MIDI 2.0 (UMP) interface, for tutti"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["alsa", "ump", "midi", "ffi"]
