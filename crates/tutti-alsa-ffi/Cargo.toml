[package]
name = "tutti-alsa-ffi"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "The unsafe half of the Linux MIDI backend: safe handles over the ALSA sequencer and its UMP API"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-alsa-ffi"
readme = "README.md"
keywords = ["alsa", "ump", "midi", "ffi"]
categories = ["external-ffi-bindings", "multimedia::audio", "os::linux-apis"]
links = "asound"
publish = false

[lints]
workspace = true

[features]
# Hooks that rename a client and change a port's capabilities.
testing = []

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
thiserror = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
