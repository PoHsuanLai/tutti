[package]
name = "tutti-asset"
version = "0.0.1"
edition = "2021"
description = "Host-agnostic asset loading vocabulary for Tutti (TuttiAsset, TuttiStreamingAsset)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["audio", "asset", "bevy"]
categories = ["multimedia::audio"]

[features]
# no_std by default (trait uses core::error::Error only).
default = []

# Enables `TuttiStreamingAsset` (requires std::path) and the `from_reader`
# convenience method on `TuttiAsset`.
std = []

[dependencies]
thiserror = { version = "2", default-features = false }
