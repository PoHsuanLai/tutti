[package]
name = "tutti-au-host"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Audio Unit (AUv2) plugin hosting for macOS via AudioToolbox framework"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-au-host"
readme = "README.md"
keywords = ["audio-unit", "au", "audio", "plugin", "host"]
categories = ["multimedia::audio", "os::macos-apis"]

[lints]
workspace = true

[features]
# What the integration tests need from `tutti-au-ffi` to build their own raw
# calls beside the safe API (the raw `AudioUnit` behind a `Unit`, the packet-list
# walkers). Off in a production build.
test-support = ["tutti-au-ffi/test-support"]
# `tests/au_midi_map.rs`'s claim about third-party Audio Units that are
# installed on the machine (TDR Nova, TAL-NoiseMaker, TAL Reverb 4). It fails,
# never skips, where they are absent, so it is compiled out unless asked for:
# CI lints it (`clippy (macos)`) and a developer with the units runs it with
# `cargo xtask test-au-installed`. It gates one test and adds no code to the library.
installed-units = []

[dependencies]
tutti-plugin-types = { path = "../tutti-plugin-types" }
# Every raw AudioToolbox, CoreAudio and CoreFoundation call; this crate forbids
# `unsafe`.
tutti-au-ffi = { path = "../tutti-au-ffi" }
# Structured errors (`AuError`), matching the sibling format hosts.
thiserror.workspace = true
# `Offset`: where an event sits in the block `send_midi` is given; `Ump`: the packet.
tutti-graph = { path = "../tutti-graph" }
tutti-ump = { path = "../tutti-ump", default-features = false }
# `midi1`: a channel voice message as the MIDI 1.0 bytes `MusicDeviceMIDIEvent`
# takes (the narrowing and a banked Program Change's three messages).
tutti-midi-protocol = { path = "../tutti-midi-protocol" }
# The engine's unit newtypes: `Bpm`/`Beat` on `TransportState` and `Seconds` on
# `get_tail_time`. `default-features = false` drops this crate's codec/midi
# defaults, which the unit vocabulary does not need.
tutti-types = { path = "../tutti-types", default-features = false }
tutti-rt = { path = "../tutti-rt" }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"

[dev-dependencies]
# The tests build SysEx and MIDI 1.0 fixtures with its helpers.
tutti-midi-types = { path = "../tutti-midi-types", default-features = false }
# The tests that build their own raw calls beside the safe API.
tutti-au-host = { path = ".", features = ["test-support"] }
tutti-au-ffi = { path = "../tutti-au-ffi", features = ["test-support"] }
tutti-graph = { path = "../tutti-graph" }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
assert_no_alloc = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The probe AU and a few tests build CoreFoundation objects of their own.
core-foundation = "0.10"
core-foundation-sys = "0.8"

# The Cocoa editor-lifecycle tests, run on the main thread. `harness = false` so
# this target owns `main()` — the only way to reach the main thread under cargo,
# and macOS requires it for AppKit, which `AuEditor` checks with the OS
# (`pthread_main_np`). See the module docs; the test
# bodies are shared with `tests/au_gui_lifecycle.rs`, not duplicated.
[[test]]
name = "au_gui_lifecycle_main"
path = "tests/au_gui_lifecycle_main.rs"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
