[package]
name = "tutti-au-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A host for Audio Unit (AUv2) plugins on macOS"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio-unit", "au", "audio", "plugin", "host"]
categories = ["multimedia::audio", "os::macos-apis"]

[lints]
workspace = true

[features]
# What the integration tests need from `tutti-au-ffi` to build their own raw
# calls beside the safe API (the raw `AudioUnit` behind a `Unit`, the packet-list
# walkers). Off in a production build.
testing = ["tutti-au-ffi/testing"]
[dependencies]
# The editor's sizes, which name their unit (`dpi::Size`).
dpi.workspace = true
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types" }
# Every raw AudioToolbox, CoreAudio and CoreFoundation call; this crate forbids
# `unsafe`.
tutti-au-ffi = { version = "0.0.1", path = "../tutti-au-ffi" }
# Structured errors (`AuError`), matching the sibling format hosts.
thiserror.workspace = true
# `Offset`: where an event sits in the block `send_midi` is given; `Ump`: the packet.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
# `midi1`: a channel voice message as the MIDI 1.0 bytes `MusicDeviceMIDIEvent`
# takes (the narrowing and a banked Program Change's three messages).
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol" }
# The engine's unit newtypes: `Bpm`/`Beat` on `TransportState` and `Seconds` on
# `get_tail_time`. `default-features = false` drops this crate's codec/midi
# defaults, which the unit vocabulary does not need.
tutti-types = { version = "0.0.1", path = "../tutti-types", default-features = false }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"

[dev-dependencies]
# The tests build SysEx and MIDI 1.0 fixtures with its helpers.
# The tests that build their own raw calls beside the safe API.
tutti-au-host = { path = ".", features = ["testing"] }
tutti-au-ffi = { path = "../tutti-au-ffi", features = ["testing"] }
# `mapping_contract!`: the laws `ParamBounds` is held to.
tutti-plugin-types = { path = "../tutti-plugin-types", features = ["contract"] }
tutti-graph = { path = "../tutti-graph" }
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["plugin", "au"] }
assert_no_alloc = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tutti-shared-plugin = { path = "../../testing/tutti-shared-plugin" }
# The probe AU and a few tests build CoreFoundation objects of their own.
core-foundation = "0.10"
core-foundation-sys = "0.8"

# The Cocoa editor-lifecycle tests, run on the main thread. `harness = false` so
# this target owns `main()` — the only way to reach the main thread under cargo,
# and macOS requires it for AppKit, which `AuEditor` checks with the OS
# (`pthread_main_np`). See the module docs; the test
# bodies live in `tests/support/gui_lifecycle.rs`.
[[test]]
name = "au_gui_lifecycle_main"
path = "tests/au_gui_lifecycle_main.rs"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
