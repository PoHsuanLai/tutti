[package]
name = "tutti-clap-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe bindings for hosting CLAP plugins, built on clap-sys, for tutti"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["clap", "audio", "plugin", "ffi"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
# The hooks a test uses to drive the raw C vtables the safe API hides (raw
# lists, streams and host vtables, a context-menu builder). Off in a
# production build; the host crate's tests turn it on.
testing = []

[dependencies]
# The editor's sizes, which name their unit (`dpi::Size`).
dpi.workspace = true
clap-sys = "0.5"
libloading.workspace = true
bitflags = "2"
# `WindowHandle`, the one value whose unsafe constructor carries the claim that
# a parent window is valid; the editor entries take it by reference.
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types" }
# `GraphPool`: a graph worker pool as the `TaskPool` that serves `clap.thread-pool`.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
# `Beat` and `BeatDuration`: what a `transport-control` request carries.
tutti-types = { version = "0.0.1", path = "../tutti-types" }
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The reference plugin the wrapper tests load; Cargo builds its cdylib in the
# same `cargo test` invocation and the tests find the artifact beside the test
# binary (`tutti-fixtures`).
tutti-clap-test-plugin = { path = "../../testing/tutti-clap-test-plugin" }
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["plugin"] }
assert_no_alloc = { version = "1", default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
