[package]
name = "tutti-codec"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Tutti's audio file codecs: WAV, AIFF, FLAC and Ogg Vorbis out behind one Encoder, and WAV, FLAC, MP3 and Ogg in as a Wave or a FileIn"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-codec"
readme = "README.md"
keywords = ["audio", "wav", "flac", "aiff", "ogg"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
# No format by default, as on every engine crate: a build names the containers
# it writes (`encode-*`) and the ones it reads (`decode-*`), and a feature of
# one side pulls nothing of the other. A `Format` variant exists only with its
# `encode-*` feature on.
default = []
encode-wav = []
encode-flac = ["dep:flacenc", "dep:md-5"]
encode-aiff = ["dep:aifc"]
# Ogg Vorbis. Its C library (`ogg_next_sys`) does not cross-compile to Windows
# MSVC from Linux, so `cargo xtask check-windows` leaves it out of the lint run. A
# decode-only build never reaches it.
encode-vorbis = ["dep:vorbis_rs"]
# Each `decode-*` feature pulls exactly one symphonia container (and its codec)
# for `Wave::read`, `Wave::read_metadata` and `FileIn`: a build lists exactly
# what it can read. `decode-wav` needs `pcm`: WAV is only the container. AIFF
# is not here: symphonia's `aiff` is not enabled by any feature.
decode-wav = ["dep:symphonia", "symphonia/wav", "symphonia/pcm"]
decode-flac = ["dep:symphonia", "symphonia/flac"]
decode-mp3 = ["dep:symphonia", "symphonia/mp3"]
decode-ogg = ["dep:symphonia", "symphonia/ogg", "symphonia/vorbis"]
# `Serialize`/`Deserialize` on the range-checked `Quality`.
serde = ["dep:serde"]

[dependencies]
thiserror.workspace = true
# An unfinished file that cannot be removed is logged.
tracing = "0.1"
tutti-types = { path = "../tutti-types", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }
# No default features: the encoder drives flacenc's frame encoder on its own
# workers, so flacenc's `par` (and its `serde`/`log`) are unused.
flacenc = { version = "0.4", optional = true, default-features = false }
# The FLAC STREAMINFO's MD5, over the samples as written. flacenc computes one
# only inside its own encode loop, which pads the last block; the FLAC encoder
# drives flacenc's frame encoder itself, so it hashes the samples here. The
# same crate and version flacenc already pulls in.
md-5 = { version = "0.10", optional = true }
vorbis_rs = { version = "0.5", optional = true }
# File decode for `Wave::read` / `FileIn`. No default features: each codec is a
# `decode-*` feature above. Used by the `decode` module alone, and named in no
# public signature.
symphonia = { version = "0.5.5", optional = true, default-features = false }
# AIFF/AIFF-C: its I16/I24/F32 formats match our three depths exactly and it
# back-patches sizes on finalize, so AIFF streams like the others.
aifc = { version = "0.7", optional = true }

[dev-dependencies]
# `check_range_contract` for `Quality`, and `assert_golden` for the files whose
# encoders do float math.
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
# `serde` and every decoder on, so `Quality`'s contract test and the decode
# suites run on every plain run: a dev-dependency on self is how a feature
# reaches the test targets, where `required-features` would *skip* a suite on a
# plain run and report green having decoded nothing. The encoder features are
# not named here (Ogg's C library cannot cross-compile to Windows), and are on
# in a workspace run through `tutti-export`.
tutti-codec = { path = ".", features = ["serde", "decode-wav", "decode-flac", "decode-mp3", "decode-ogg"] }
tempfile = "3.10"
# An independent reader for what the WAV writer emits.
hound = "3.5"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
