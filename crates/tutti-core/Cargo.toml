[package]
name = "tutti-core"
version = "0.0.1"
edition = "2021"
description = "Core audio graph runtime kernel - Net/Graph, Transport, Metering, PDC"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["audio", "dsp", "real-time", "daw", "fundsp"]
categories = ["multimedia::audio"]

[features]
# tutti-core is now a std crate with hard Bevy deps (it hosts the ECS graph
# hub). `std` and `bevy_ecs`/`bevy_asset` are no longer features — they're
# unconditional. The names below are kept as no-op aliases so sibling crates'
# existing `features = ["std", "bevy_ecs", ...]` requests keep resolving until
# they're cleaned up; they pull nothing extra.
default = []
std = []
bevy_ecs = []
bevy_asset = ["fundsp/bevy_asset"]

# Individual audio format support (each pulls only its codec)
wav = ["fundsp/wav"]
flac = ["fundsp/flac"]
mp3 = ["fundsp/mp3"]
ogg = ["fundsp/ogg"]

# All file formats
files = ["wav", "flac", "mp3", "ogg"]

# Optional subsystems
midi = []

[dependencies]
thiserror = { version = "2", default-features = false }
dyn-clone = { version = "1.0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }

# Audio
fundsp = { package = "fundsp-tutti", version = "0.23.0", path = "../fundsp-tutti", default-features = false, features = ["std"] }

# MIDI types (pure types from tutti-midi-types) — always included for SmpteFrameRate etc.
tutti-midi-types = { version = "0.0.1", path = "../tutti-midi-types", default-features = false, features = ["std"] }

# Shared RT primitives (AudioThreadCell, RtEventBuf).
tutti-types = { version = "0.0.1", path = "../tutti-types" }

# Host-agnostic asset vocabulary (TuttiAsset / TuttiStreamingAsset) used by the
# generic `TuttiLoader` Bevy AssetLoader adapters in `loader`.
tutti-asset = { version = "0.0.1", path = "../tutti-asset", features = ["std"] }

# Lock-free (no_std compatible)
ringbuf = { version = "0.4", default-features = false, features = ["alloc"] }
crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }
atomic_float = { version = "1.1", default-features = false, features = ["atomic_f64"] }
arc-swap = "1.7"
hashbrown = { version = "0.16", default-features = false }
parking_lot = { version = "0.12", default-features = false }

# Metering (EBU R128 loudness measurement). Unconditional now that tutti-core
# is std. crossbeam-channel carries the metering sample pipe.
crossbeam-channel = { version = "0.5" }
ebur128 = { version = "0.1" }

# Bevy — hard deps. tutti-core hosts the ECS graph-reconcile hub
# (GraphReconcileSystems, TuttiGraphRes, TuttiGraphPlugin, the param
# components) that every leaf audio crate schedules against. Pinned to the
# same Bevy minor as the rest of the workspace.
bevy_ecs = { version = "0.18", default-features = false, features = ["bevy_reflect"] }
bevy_reflect = { version = "0.18", default-features = false }
bevy_app = { version = "0.18", default-features = false }
bevy_asset = { version = "0.18", default-features = false }
bevy_tasks = { version = "0.18" }
bevy_log = { version = "0.18", default-features = false }

[dev-dependencies]
assert_no_alloc = "1"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.9.0"
insta = { version = "1.41", features = ["yaml"] }
approx = "0.5"
tempfile = "3.8"
rand = "0.8"
