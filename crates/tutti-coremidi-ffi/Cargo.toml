[package]
name = "tutti-coremidi-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe bindings to Apple's CoreMIDI for MIDI 2.0 virtual ports and device endpoints, for tutti"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["coremidi", "ump", "midi", "ffi"]
categories = ["external-ffi-bindings", "multimedia::audio", "os::macos-apis"]

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
coremidi-sys = { workspace = true }
thiserror = { workspace = true }
block2 = "0.6"
core-foundation = { workspace = true }
mach2 = "0.7"
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-core-midi = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-midi = { workspace = true, features = ["block2", "MIDIUMPMutableEndpoint", "MIDIUMPMutableFunctionBlock"] }

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]
