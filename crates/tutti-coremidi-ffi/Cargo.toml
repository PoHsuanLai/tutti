[package]
name = "tutti-coremidi-ffi"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "The unsafe half of the macOS MIDI backend: a native-UMP virtual source and destination, the UMP Endpoints and Function Blocks the OS reports, and the host clock, behind safe handles"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-coremidi-ffi"
readme = "README.md"
keywords = ["coremidi", "ump", "midi", "ffi"]
categories = ["external-ffi-bindings", "multimedia::audio", "os::macos-apis"]
publish = false

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
coremidi-sys = { workspace = true }
thiserror = { workspace = true }
block2 = "0.6"
core-foundation = { workspace = true }
mach2 = "0.6"
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-core-midi = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-midi = { workspace = true, features = ["block2", "MIDIUMPMutableEndpoint", "MIDIUMPMutableFunctionBlock"] }

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]
