[package]
name = "tutti-cpal"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "CPAL device layer for Tutti — output stream, mic capture, and the driver lifecycle"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-cpal"
readme = "README.md"
keywords = ["audio", "cpal", "audio-io", "real-time"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# Mic capture (`MicIn`). Gated because it needs the capture ring and the
# monitor node `tutti-io` defines; without it this crate is output-only.
capture = ["dep:tutti-io", "dep:tutti-codec"]

# JACK, through cpal's implicitly-featured optional `jack` dependency.
#
# Linux/BSD only in effect: cpal declares no `jack` feature of its own — the
# name is the implicit feature of an optional dependency that appears ONLY in
# cpal's Linux/BSD target table, and `#[cfg(feature = "jack")]` appears only
# inside its Linux `platform_impl`. So enabling this on macOS or Windows
# compiles cleanly and reaches nothing.
#
# Left enableable on every target deliberately: `AudioHost::Jack` exists on
# every platform and answers `Error::HostUnavailable` where it cannot be
# served, so a host's config type does not change shape per OS.
#
# Needs libjack at BUILD time on Linux (`libjack-jackd2-dev` /
# `jack-audio-connection-kit-devel`), which is why `just check-jack` is a
# separate recipe from `just check-features`.
jack = ["cpal/jack"]

[dependencies]
cpal = "0.15"
thiserror.workspace = true

tutti-transport = { path = "../tutti-transport" }
tutti-engine = { path = "../tutti-engine" }
# `TapReader` and `TapWriter`, the mic's rings.
tutti-graph = { path = "../tutti-graph" }

# The live I/O edge: the capture ring and the monitor node `MicIn` hands back.
tutti-io = { path = "../tutti-io", optional = true }
# `Pcm`, the width of the WAV sink `MicIn::matching_sink` opens.
tutti-codec = { path = "../tutti-codec", optional = true }

tutti-types = { path = "../tutti-types", default-features = false }
tutti-rt = { path = "../tutti-rt" }

[dev-dependencies]
# `contract::prepared`, to drive the mic's monitor node by hand in the capture tests.
tutti-graph = { path = "../tutti-graph", features = ["contract"] }
# The RT gates render a real graph under a disabled allocator.
assert_no_alloc = { version = "1", default-features = false }
criterion.workspace = true
# Stimulus nodes (`tutti_nodes::testing`) and a real filter for the fixture
# graphs. `tutti-nodes` does not depend on this crate.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }
# The master meter type the RT gate reads back.
tutti-metering = { path = "../tutti-metering" }

[[bench]]
name = "audio_callback"
harness = false

# Not `jack`: it links libjack, which the docs.rs builder does not provide.
[package.metadata.docs.rs]
features = ["capture"]
rustdoc-args = ["--cfg", "docsrs"]
