[package]
name = "tutti-curve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Easing curves and automation: how a value moves between points over time"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["audio", "automation", "easing"]
categories = ["multimedia::audio"]

[lints]
workspace = true

# No features: a `Law` is a plain `Copy` value. Nothing here persists a curve,
# so there is no `serde`.

[dependencies]
# `Beat`, the position of an automation point.
tutti-types = { version = "0.0.1", path = "../tutti-types" }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
