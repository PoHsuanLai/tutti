[package]
name = "tutti-dsp"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Pure DSP algorithms for Tutti over plain sample slices: a CPU-independent real FFT, the window functions and the filter, dynamics, convolution, delay and waveshaping algorithms behind the built-in effect nodes"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-dsp"
readme = "README.md"
keywords = ["audio", "dsp", "fft", "filter", "reverb"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# The unit vocabulary (Hz / Seconds / Samples / Amplitude / Confidence / …),
# `ChannelLayout`, `Interleaved` and the downmix helpers. Nothing here needs
# the engine runtime, so this is the only tutti edge.
tutti-types = { path = "../tutti-types", default-features = false }

# `RealFft` (`fft/real.rs`), the one real-input FFT of the convolver, the
# analyzers in `tutti-measure`, the time-stretch vocoder, the HRTF panner and the export
# resampler, planned on rustfft's *scalar* planner. Its auto planner (and so
# `realfft`, which cannot be handed another) picks AVX, SSE or NEON at run
# time, and those round differently, so a render would differ bitwise between
# CPUs. Same version as `Cargo.lock`'s.
rustfft = { version = "6.4", default-features = false }

# The filters' `Real` (`filter/real.rs`) calls `libm`'s pure-Rust
# transcendentals, so results do not depend on the platform's C math library.
libm = "0.2.15"

# The `Error` enum's Display/Error impls.
thiserror.workspace = true

[features]
# No `bevy` feature, and no default features. This crate is a library of
# algorithms over `&[f32]` (filters, dynamics, convolution, delay, reverb);
# a host that wants these results in an ECS wires them up on its own side.
default = []

[dev-dependencies]
# Reproducible noise for the reverb's tests. Seeded, so an assertion is not
# flaky.
rand = "0.8"
# `check_range_contract` for `MaxDecay`, and `Seconds`'s serde for it.
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
tutti-types = { path = "../tutti-types", default-features = false, features = ["serde"] }
serde = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
