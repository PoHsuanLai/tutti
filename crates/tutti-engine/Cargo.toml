[package]
name = "tutti-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Renders tutti's audio graph block by block, together with a playback clock"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "dsp", "real-time", "daw"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
tutti-types = { version = "0.0.1", path = "../tutti-types" }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
bytemuck = { version = "1.16", features = ["derive"] }
# `Engine` renders a `tutti_graph::Executor`.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }
tutti-transport = { version = "0.0.1", path = "../tutti-transport" }
tutti-metering = { version = "0.0.1", path = "../tutti-metering" }
# The hand-over queues of the after-the-fader tap (the crate `tutti-graph` uses
# for its editor queue).
ringbuf = { version = "0.6", default-features = false, features = ["alloc"] }

[dev-dependencies]
# The same crate as the dependency above, with the sample-accuracy contract
# harness on (`tests/render/graph_contract.rs`): its `Pulse` and
# `Latent` nodes are the engine-level rows' sources.
tutti-graph = { version = "0.0.1", path = "../tutti-graph", features = ["contract"] }
assert_no_alloc = { version = "1", default-features = false }
# `TempoMap`, for the step-map tests.
tutti-tempo = { path = "../tutti-tempo" }
tutti-ump = { path = "../tutti-ump", default-features = false }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
# The metronome node (`ClickNode`) the engine-level tests render.
tutti-nodes = { path = "../tutti-nodes", default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
