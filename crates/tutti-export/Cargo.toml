[package]
name = "tutti-export"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Offline audio export and rendering for Tutti audio engine"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-export"
readme = "README.md"
keywords = ["audio", "export", "render", "wav", "flac", "aiff", "ogg"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = ["wav", "flac", "aiff", "ogg"]
# The formats `tutti-codec` writes; a `Format` variant exists only with its
# feature on.
wav = ["tutti-codec/encode-wav"]
flac = ["tutti-codec/encode-flac"]
aiff = ["tutti-codec/encode-aiff"]
ogg = ["tutti-codec/encode-vorbis"]

[dependencies]
thiserror.workspace = true
tutti-transport = { path = "../tutti-transport" }
tutti-types = { path = "../tutti-types", default-features = false }
# The encoders and the file's format; the pipeline in this crate hands them
# blocks. No features of its own: the four above turn each format on.
tutti-codec = { path = "../tutti-codec" }
# The graph: `RenderGraph` is a forked or built
# `Editor`/`Executor` pair, the only thing an export renders. Acyclic:
# tutti-graph depends on no tutti crate but tutti-types, tutti-rt and tutti-ump.
tutti-graph = { path = "../tutti-graph" }
# EBU R128 loudness measurement lives in tutti-dsp (the crate's
# Config/State/step analysis home) — `render_normalized_to_file` measures with
# it — and so does the resampler's `RealFft`. Acyclic: tutti-dsp does NOT depend on tutti-export.
tutti-dsp = { path = "../tutti-dsp", default-features = false }

[dev-dependencies]
criterion.workspace = true
# An independent reader for the WAV files the tests export.
hound = "3.5"
tempfile = "3.10"
approx = "0.5"
# Convolution nodes and the `testing` stimulus nodes for the end-to-end export
# tests, examples and bench. Acyclic: tutti-nodes does NOT depend on
# tutti-export.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["convolution", "testing"] }
# Surround producer nodes (SpatialPannerNode + build_surround_mix) for the
# end-to-end multichannel-export integration test. Also acyclic.
tutti-spatial = { path = "../tutti-spatial", default-features = false }
# Voice/VoicePool producers for `sampler_to_export.rs`, which renders a sampler
# voice through the offline clock and asserts on the exported pitch. Also
# acyclic: tutti-sampler does NOT depend on tutti-export.
tutti-sampler = { path = "../tutti-sampler", default-features = false }
# An independent decoder for every container this crate writes, for
# `tests/oracle_decode.rs`. `hound` only speaks WAV, so FLAC/AIFF/Ogg were
# checked by frame count and header, never by content. The feature list is the
# minimum that reads what this crate emits — do NOT add `isomp4` or the
# mp3/aac bundles; nothing here writes those.
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "pcm", "flac", "ogg", "vorbis", "aiff"] }

[[bench]]
name = "offline_render"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
