[package]
name = "tutti-export"
version = "0.0.1"
edition = "2021"
description = "Offline audio export and rendering for Tutti audio engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
keywords = ["audio", "export", "render", "wav", "flac", "aiff", "ogg"]
categories = ["multimedia::audio"]

[features]
default = ["wav", "flac", "aiff", "ogg"]
wav = ["hound"]
flac = ["flacenc"]
aiff = []
ogg = ["vorbis_rs"]
# Expose `MidiTrack` and `GraphExport::with_midi` for MIDI-driven offline
# renders. Also lets the umbrella engine inject live MIDI events into the
# export snapshot.
midi = ["tutti-core/midi", "dep:tutti-midi-runtime"]
# Offline per-node region render (`ecs::render_region`). It isolates and
# rebinds clip-reader / sampler units from tutti-sampler, so it needs that
# crate. VERIFIED acyclic: tutti-sampler does NOT depend on tutti-export.
# `ecs::export` is unconditional; only `ecs::render_region` is gated here.
# tutti-sampler's file-loading path (its `Wave::load`) is codec-gated, so pull
# `wav` to give it a codec — matches how the umbrella turns on the sampler.
sampler = ["dep:tutti-sampler", "tutti-sampler/wav"]

[dependencies]
thiserror = "1.0"
tutti-core = { path = "../tutti-core", default-features = false }
tutti-midi-runtime = { path = "../tutti-midi-runtime", optional = true, default-features = false }
# Optional: only the `ecs::render_region` module references sampler units.
tutti-sampler = { path = "../tutti-sampler", optional = true, default-features = false }
rubato = "0.16"
ebur128 = "0.1"
hound = { version = "3.5", optional = true }
flacenc = { version = "0.4", optional = true }
vorbis_rs = { version = "0.5", optional = true }
crossbeam-channel = "0.5"

# Bevy ECS surface (mirrors tutti-wavecache): the export pipeline ships its own
# Bevy plugins now. Hard deps — the `ecs` module is unconditional.
bevy_app = { version = "0.18", default-features = false }
bevy_ecs = { version = "0.18", default-features = false }
bevy_reflect = { version = "0.18", default-features = false }
bevy_tasks = { version = "0.18" }
bevy_log = { version = "0.18", default-features = false }

[dev-dependencies]
tempfile = "3.10"
approx = "0.5"
fundsp = { package = "fundsp-tutti", path = "../fundsp-tutti", default-features = false, features = ["std"] }
