[package]
name = "tutti-graph"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "The audio graph for the Tutti engine: a graph value, a pure compiler to an immutable plan, and a real-time editor/executor pair that runs it"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-graph"
keywords = ["audio", "real-time", "dsp"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
# No `bevy` feature: nothing here is a component. The Bevy adapter derives
# what it needs on its own side.
default = []
# The sample-accuracy contract suite's harness, `tutti_graph::contract`:
# test support, so off by default. This crate's own
# tests turn it on through the self dev-dependency below; a node crate adding
# rows turns it on in its dev-dependency on this crate.
contract = []
# `Reference`, the naive interpreter the differential suites compare the
# executor with: test support (about 2,700 lines), so off by default. This
# crate's own tests turn it on through the self dev-dependency below.
testing = ["dep:assert_no_alloc"]

[dependencies]
# The value (`Topology`, `NodeKey`, ports), the unit newtypes and the latency /
# tail vocabulary.
tutti-types = { version = "0.0.1", path = "../tutti-types" }
tutti-rt = { path = "../tutti-rt" }
# `Law`, the closed set of easings a param segment and a ramp move along.
tutti-curve = { path = "../tutti-curve" }
# `Ump`, the packet an event carries, and its note-off test. No other tutti
# crate and no codec: this is why the packet is not in `tutti-types`.
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
# Safe casts between the 64-byte-aligned arena lines and the `f32` slices a
# node is handed. This is what keeps the executor free of `unsafe`: alignment
# comes from the element type, the reinterpretation from a checked `Pod` cast,
# and the disjoint borrows from `split_at_mut`. See `src/arena.rs`.
bytemuck = { version = "1.16", features = ["derive"] }
# The preallocated SPSC rings between an editor and its executor: commits in,
# retired boxes back. Already the engine's ring (tutti-metering,
# tutti-sampler use it); lock-free and allocation-free once built, which is
# what the audio-thread side of the queue needs.
ringbuf = { version = "0.6", default-features = false, features = ["alloc"] }
# `testing` only: `TestPool::no_alloc` runs each participant under the gate.
assert_no_alloc = { version = "1", default-features = false, optional = true }

[dev-dependencies]
# Turns `contract` and `testing` on for this crate's own tests (the pattern
# `tutti-nodes` uses for `testing`).
tutti-graph = { path = ".", features = ["contract", "testing"] }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
assert_no_alloc = { version = "1", default-features = false }
criterion.workspace = true
proptest = "1.9.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "graph_render"
harness = false

[[bench]]
name = "event_path"
harness = false

[[bench]]
name = "held_keys"
harness = false

[package.metadata.docs.rs]
features = ["contract"]
rustdoc-args = ["--cfg", "docsrs"]
