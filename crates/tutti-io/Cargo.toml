[package]
name = "tutti-io"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Tutti's live audio I/O edge: mic monitoring and the analysis tap in, WAV out, and the recorder pump between them"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-io"
readme = "README.md"
keywords = ["audio", "recording", "capture", "wav"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# `AudioTap`, the analysis tap `TapIn` reads.
tutti-metering = { path = "../tutti-metering" }

thiserror.workspace = true

# The node contract `MicMonitorNode` is written against. No cycle:
# tutti-graph names no tutti crate but tutti-types, tutti-rt and tutti-ump.
tutti-graph = { path = "../tutti-graph" }

# The capture ring `MicMonitorNode` drains. The producer half lives in the
# device layer (`tutti-cpal`), which sits *above* this crate.
ringbuf = "0.6"

# The WAV writer behind the `WavOut` sink, the one an export writes through.
tutti-codec = { path = "../tutti-codec", features = ["encode-wav"] }

tutti-types = { path = "../tutti-types", default-features = false }

[dev-dependencies]
# An independent reader for the WAV files the tests write.
hound = "3.5"
# Finds the repo's `assets/` for the tests.
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
# `FileIn` as the pump's source, in `tests/file_in_pump.rs`: the decoders on
# for this crate's own tests.
tutti-codec = { path = "../tutti-codec", features = ["encode-wav", "decode-wav", "decode-flac"] }
# `contract::Direct`, the by-hand driver the monitor's allocation gate runs.
tutti-graph = { path = "../tutti-graph", features = ["contract"] }
tempfile = "3.8"
# The RT gate: `MicMonitorNode::process` must not allocate.
assert_no_alloc = { version = "1", default-features = false }
# The gate builds a ring by hand to feed the node under a disabled allocator.
ringbuf = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
