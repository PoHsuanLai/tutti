[package]
name = "tutti-measure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Measures audio: loudness (EBU R128), pitch, onsets, stereo correlation, spectra, tempo, key and chords"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "analysis", "pitch", "loudness", "onset"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
# The unit vocabulary (Hz / Seconds / Samples / Amplitude / Confidence / …),
# `ChannelLayout`, `Interleaved` and the downmix helpers.
tutti-types = { version = "0.0.1", path = "../tutti-types", default-features = false }

# `RealFft`/`FftScratch` (the CPU-independent real FFT every kernel here runs
# on), `Complex`, `StftGeometry`, `Grid` and the `Error` they share with the
# sampler's vocoder.
tutti-dsp = { version = "0.0.1", path = "../tutti-dsp", default-features = false }

# EBU R128 loudness metering (`loudness`). An online meter, which is why the
# streaming Config/State/step shape fits it without buffering the signal.
ebur128 = "0.1"

# The `Error` enum's Display/Error impls.
thiserror.workspace = true

[features]
default = []

[dev-dependencies]
# The README's "Reading from a running graph" doctest shows the engine-side
# seam (a graph tap's `TapReader`); nothing in the library reaches tutti-graph.
tutti-graph = { path = "../tutti-graph" }
# Reproducible noise for the correlation tests, which otherwise hand-roll a
# generator. Seeded, so an uncorrelated-input assertion is not flaky.
rand = "0.10"
# The shared sine, impulse and level readings (`signal`), and
# `check_range_contract` for the range-checked settings, which are serde's
# `try_from` shape in the tests only.
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
tutti-types = { path = "../tutti-types", default-features = false, features = ["serde"] }
serde = "1"
# `benches/fft_analyses`.
criterion.workspace = true
# An independent YIN, as a second opinion on ours, for `tests/oracle_pitch.rs`.
pitch-detection = "0.3"

[[bench]]
name = "fft_analyses"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
