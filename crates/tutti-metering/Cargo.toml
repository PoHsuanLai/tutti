[package]
name = "tutti-metering"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Load metering for the Tutti audio engine"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-metering"
readme = "README.md"
publish = false
keywords = ["audio", "metering", "real-time", "daw"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
tutti-types = { version = "0.0.1", path = "../tutti-types" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
