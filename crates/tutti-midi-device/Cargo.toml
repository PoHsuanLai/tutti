[package]
name = "tutti-midi-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Keeps track of MIDI devices and speaks MIDI-CI, MIDI 2.0's discovery and profile protocol"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["midi", "audio", "hot-plug"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# `Serialize`/`Deserialize` on `DeviceId`, `Identity`, `SavedDevice` and `Learned`.
serde = ["dep:serde", "tutti-ump/serde"]

[dependencies]
bitflags = "2"
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
winnow = { workspace = true }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
proptest = "1.9.0"
serde_json = "1"
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
