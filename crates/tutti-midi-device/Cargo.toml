[package]
name = "tutti-midi-device"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "MIDI device core for the Tutti audio engine: DeviceId, the pure DeviceTable, the UMP Endpoint and Connection, and the MIDI-CI codec"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-midi-device"
readme = "README.md"
publish = false
keywords = ["midi", "audio", "hot-plug"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# `Serialize`/`Deserialize` on `DeviceId`, `Identity`, `SavedDevice` and `Learned`.
serde = ["dep:serde", "tutti-ump/serde"]

[dependencies]
bitflags = "2"
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
tutti-ump = { path = "../tutti-ump", default-features = false }
winnow = { workspace = true }
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
proptest = "1.9.0"
serde_json = "1"
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
