[package]
name = "tutti-midi-file"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Reads and writes Standard MIDI Files and MIDI 2.0 Clip Files"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["midi", "smf", "audio", "codec"]
categories = ["multimedia::audio", "parser-implementations"]

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }

tutti-midi-protocol = { path = "../tutti-midi-protocol" }

tutti-tempo = { path = "../tutti-tempo" }
tutti-types = { path = "../tutti-types", default-features = false }
tutti-ump = { path = "../tutti-ump", default-features = false }
winnow = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
