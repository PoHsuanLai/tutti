[package]
name = "tutti-midi-file"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "MIDI file codecs — Standard MIDI File (SMF) and MIDI 2.0 Clip File"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-midi-file"
readme = "README.md"
keywords = ["midi", "smf", "audio", "codec"]
categories = ["multimedia::audio", "parser-implementations"]

[lints]
workspace = true

[dependencies]
thiserror = "2"

# `channel_voice`, the note-on width read by `Track::notes`.
tutti-midi-protocol = { path = "../tutti-midi-protocol" }

tutti-tempo = { path = "../tutti-tempo" }
tutti-types = { path = "../tutti-types", default-features = false }
tutti-ump = { path = "../tutti-ump", default-features = false }
# The SMF reader (`src/smf/read.rs`) alone names it; no signature does.
winnow = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
# The path-based clip tests need a private directory. nextest runs each test in
# its own process, so a fixed name under `std::env::temp_dir()` is a shared
# mutable path that two concurrent runs of the same binary race on.
tempfile = "3.8"
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
