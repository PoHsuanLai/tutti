[package]
name = "tutti-midi-hardware"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "MIDI 2.0 device input and output through CoreMIDI on macOS and ALSA on Linux, for tutti"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["midi", "ump", "audio", "real-time"]
categories = ["multimedia::audio", "hardware-support"]

[features]
# Exports `test_support::FakeBackend`, a device list with no OS behind it.
testing = []
# The suites that need a real ALSA sequencer (`/dev/snd/seq`); Linux only.
sequencer-tests = []

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = "0.1"

tutti-midi-device = { path = "../tutti-midi-device" }
tutti-graph = { path = "../tutti-graph" }
tutti-midi-runtime = { path = "../tutti-midi-runtime", default-features = false }
tutti-types = { path = "../tutti-types", default-features = false }
tutti-rt = { path = "../tutti-rt" }
tutti-ump = { path = "../tutti-ump", default-features = false }
tutti-midi-protocol = { path = "../tutti-midi-protocol" }

ringbuf = "0.6"


[target.'cfg(target_os = "linux")'.dependencies]
tutti-alsa-ffi = { path = "../tutti-alsa-ffi" }

[target.'cfg(target_os = "macos")'.dependencies]
tutti-coremidi-ffi = { path = "../tutti-coremidi-ffi" }
coremidi = { workspace = true }
core-foundation = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tutti-alsa-ffi = { path = "../tutti-alsa-ffi", features = ["testing"] }

[dev-dependencies]
tutti-midi-hardware = { path = ".", features = ["testing"] }

assert_no_alloc = { version = "1", default-features = false }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
