[package]
name = "tutti-midi-protocol"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "MIDI 1.0 to MIDI 2.0 translation for the Tutti audio engine: stateless widening and M2-115 scaling"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-midi-protocol"
readme = "README.md"
# Not published: whether and when this goes to crates.io is the maintainer's
# call, not a side effect of a workspace change. Remove this line to publish.
publish = false
keywords = ["midi", "ump", "audio", "real-time"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# serde for `PitchBendSensitivity`, which `MpeZoneConfig` persists.
serde = ["dep:serde", "tutti-ump/serde"]

[dependencies]
tutti-types = { path = "../tutti-types", default-features = false }
tutti-ump = { path = "../tutti-ump", default-features = false }
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1"
# The persisted-value tests run on every build, not only under `--features serde`.
tutti-midi-protocol = { path = ".", features = ["serde"] }

