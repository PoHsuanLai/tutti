[package]
name = "tutti-midi-runtime"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "MIDI runtime for the Tutti audio engine: MIDI graph nodes (input, queue, clip, clock, out), MPE ingest, MIDI-CI, SysEx"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-midi-runtime"
readme = "README.md"
keywords = ["audio", "midi", "real-time", "daw"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []

[dependencies]
tutti-midi-types = { version = "0.0.1", path = "../tutti-midi-types" }
# The graph's node contract and event ports: `MidiClipNode` is an event
# source node. No cycle: tutti-graph names no MIDI crate.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }

# Lock-free / concurrent
atomic_float = "1.1"
bytemuck = { version = "1.16", features = ["derive"] }
crossbeam-queue = "0.3"
tutti-types = { path = "../tutti-types", default-features = false }
tutti-rt = { path = "../tutti-rt" }
tutti-ump = { path = "../tutti-ump", default-features = false }
# The input edge's MIDI 1.0 to MIDI 2.0 `Translator` (design 017 §4).
tutti-midi-protocol = { path = "../tutti-midi-protocol" }

[dev-dependencies]
# The graph's by-hand node driver, `tutti_graph::contract::Direct`.
tutti-graph = { path = "../tutti-graph", features = ["contract"] }
assert_no_alloc = { version = "1", default-features = false }
criterion.workspace = true
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[[bench]]
name = "clip_node"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
