[package]
name = "tutti-midi-types"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "The decoded MIDI view (MidiMessage) and the MIDI 1.0 translation of the old API, until stage 5b part (c) deletes them"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-midi-types"
readme = "README.md"
keywords = ["midi", "audio", "real-time"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
tutti-ump = { path = "../tutti-ump", default-features = false }
# The widths: `widen` in `normalize`, `narrow_*` in `to_midi1_bytes`.
tutti-midi-protocol = { path = "../tutti-midi-protocol" }
# `MidiMessage` and `translation` read and write through `midi2`; part (c)
# of stage 5b deletes both and the dependency with them.
midi2 = { workspace = true }

[dev-dependencies]
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
assert_no_alloc = { version = "1", default-features = false }
criterion.workspace = true

# The old read path (`MidiMessage::from_ump`) against `tutti_ump::decode`, on the
# same packets.
[[bench]]
name = "message_baseline"
harness = false
