[package]
name = "tutti-modulation"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Describes how LFOs, envelopes and other sources drive settings, and works out what each setting does"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "modulation", "lfo"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# `Law`, the project's response-curve vocabulary, and the automation trajectory
# that is a `Curve`.
tutti-curve = { path = "../tutti-curve" }

# The value vocabulary: `Depth`, `Beat`, `PhaseIncrement`, `ParamAddr` (a
# target's param), `PlayReading`.
tutti-types = { path = "../tutti-types", default-features = false }

# The MIDI a note envelope hears (`Ump`, its held `Key`). Layer 0.
tutti-ump = { path = "../tutti-ump" }

