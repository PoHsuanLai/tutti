[package]
name = "tutti-nodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Built-in audio effects for tutti: filters, delays, dynamics, reverbs, modulation effects, mixing and automation"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "dsp", "effects", "filters", "real-time"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# `tutti_nodes::testing` — stimulus and plumbing nodes for tests, examples and
# benches (`Const`, `Osc`, `Through`, `Split`, `Sink`).
testing = []

[dependencies]
# Value vocabulary (the `Curve` trait), for `impl Curve for Trajectory`.
tutti-types = { version = "0.0.1", path = "../tutti-types", default-features = false }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }

# The modulation compiler and its vocabulary (`ControlProgram`, `Curve`,
# `LfoShape`, `compile`): the control lane evaluates its programs, and the
# reconcile (`Modulation`) calls the compiler.
tutti-modulation = { version = "0.0.1", path = "../tutti-modulation", default-features = false }

# The algorithms every node adapts.
tutti-dsp = { version = "0.0.1", path = "../tutti-dsp", default-features = false }

# The node contract every node here implements.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }

# Trajectory primitives consumed by `AutomationLaneNode` + `Recorder`, re-exported via
# `tutti_nodes::automation`.
tutti-curve = { version = "0.0.1", path = "../tutti-curve" }

# `ClickNode` reads the count-in flag off a `Transport` and follows a
# `ProjectMeter`.
tutti-transport = { version = "0.0.1", path = "../tutti-transport" }

# `VbapError`.
thiserror = { workspace = true }

[dev-dependencies]
libm = "0.2.15"
tutti-nodes = { path = ".", features = ["testing"] }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
# `check_range_contract` for `TailCeiling`, and `Seconds`'s serde for it.
serde = "1"
tutti-types = { path = "../tutti-types", default-features = false, features = ["serde"] }
approx = "0.5"
assert_no_alloc = { version = "1", default-features = false }
criterion.workspace = true
wide = { version = "1.6", default-features = false }
tutti-graph = { path = "../tutti-graph", features = ["contract"] }
tutti-engine = { path = "../tutti-engine" }

[[bench]]
name = "engine_render"
harness = false

[[bench]]
name = "width_generic"
harness = false

[[bench]]
name = "parallel_render"
harness = false

[[bench]]
name = "sibling_batch"
harness = false

[[bench]]
name = "bus_strip"
harness = false

[[bench]]
name = "node_kernels"
harness = false

[[bench]]
name = "convolver_blocks"
harness = false

[[bench]]
name = "vbap_panner"
harness = false

[[bench]]
name = "hrtf_binaural"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
