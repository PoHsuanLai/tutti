[package]
name = "tutti-plugin-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Finds the audio plugins installed on a machine and remembers them"
license.workspace = true
repository.workspace = true
readme = "README.md"
# Not published: whether and when this goes to crates.io is the maintainer's
# call, not a side effect of a workspace change. Remove this line to publish.
keywords = ["audio", "plugin", "vst3", "clap", "discovery"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# `PluginDb` derives `Serialize` and `Deserialize`: the app picks the file format
# and where the bytes live. Deserializing refuses a database of another version.
serde = ["dep:serde", "dep:thiserror", "tutti-plugin-types/serde"]

[dependencies]
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types" }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = { workspace = true, optional = true }
tracing = "0.1"
# The scan's progress and delta channels.
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3"
# The format the serde round trip runs through.
serde_json = "1"
# `Db`, the level a `NeverSettles` verdict holds (`wire`'s tests).
tutti-types = { path = "../tutti-types" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
