[package]
name = "tutti-plugin-ipc-ffi"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "The operating-system calls behind tutti's plugin helper process, wrapped in safe functions"
readme = "README.md"
license.workspace = true
repository.workspace = true
publish = false
keywords = ["audio", "plugin", "ipc", "shared-memory"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# The mapping.
memmap2 = "0.9"
# The header's per-architecture cache-line padding.
crossbeam-utils = "0.8"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
# `poll`, `kill(pid, 0)` and `O_NOFOLLOW`, without a hand-written call.
rustix = { version = "1", default-features = false, features = ["std", "event", "process", "fs"] }

[target.'cfg(windows)'.dependencies]
# The process table walk and liveness probe, and the named-pipe peek.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
