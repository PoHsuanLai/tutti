[package]
name = "tutti-plugin-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "How tutti talks to its plugin helper process"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["audio", "plugin", "ipc", "sandbox"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
# The client's test-only knobs and counters (a shortened rate wait, the replies
# it settled), for `tutti-plugin`'s tests, which turn it on through their
# dev-dependency. Never on in a shipping build.
testing = []

[dependencies]
tutti-types = { version = "0.0.1", path = "../tutti-types" }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types", features = ["serde", "probe-wire"] }
# The shared mapping and the OS calls, behind safe calls.
tutti-plugin-ipc-ffi = { version = "0.0.1", path = "../tutti-plugin-ipc-ffi" }

# The wire.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

# The slab's sample views (`Pod`), so no `unsafe` byte cast of our own.
bytemuck = "1"
# Unpredictable slab and socket names (pure Rust; the OS's random source).
getrandom = "0.4"

crossbeam = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.13"

# Cross-platform local IPC (Unix sockets on Unix, named pipes on Windows).
interprocess = { version = "2" }

thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tutti-midi-protocol = { path = "../tutti-midi-protocol" }
tempfile = "3"
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["plugin"] }
assert_no_alloc = { version = "1", default-features = false }
# The reference CLAP plugin the launch tests serve: a dev-dependency for the
# artifact, which cargo builds beside the test binary.
tutti-clap-test-plugin = { path = "../../testing/tutti-clap-test-plugin" }
