[package]
name = "tutti-plugin-ipc"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "The plugin host's process edge for Tutti: the wire, the shared-memory slab, the plugin-server's launch, and the client of a served plugin"
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# The client's test-only knobs and counters (a shortened rate wait, the replies
# it settled), for `tutti-plugin`'s tests, which turn it on through their
# dev-dependency. Never on in a shipping build.
test-support = []

[dependencies]
tutti-types = { path = "../tutti-types" }
tutti-rt = { path = "../tutti-rt" }
tutti-ump = { path = "../tutti-ump", default-features = false }
tutti-plugin-types = { path = "../tutti-plugin-types", features = ["serde", "probe-wire"] }
# The shared mapping and the OS calls, behind safe calls.
tutti-plugin-ipc-ffi = { path = "../tutti-plugin-ipc-ffi" }

# The wire.
serde = { version = "1", features = ["derive"] }
bincode = "1"

# The slab's sample views (`Pod`), so no `unsafe` byte cast of our own.
bytemuck = "1"
# Unpredictable slab and socket names (pure Rust; the OS's random source).
getrandom = "0.3"

crossbeam = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Cross-platform local IPC (Unix sockets on Unix, named pipes on Windows).
interprocess = { version = "2" }

thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["plugin"] }
assert_no_alloc = { version = "1", default-features = false }
# The reference CLAP plugin the launch tests serve: a dev-dependency for the
# artifact, which cargo builds beside the test binary.
tutti-clap-test-plugin = { path = "../../testing/tutti-clap-test-plugin" }
