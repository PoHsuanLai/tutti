[package]
name = "tutti-plugin-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Types shared by every plugin format: descriptions, parameters, buffers, transport, editors and presets"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "plugin", "vst3", "clap", "types"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# Enables Serialize/Deserialize on the wire-eligible types (TransportInfo,
# ParameterChanges, EditorSize, EditorCapabilities, WindowHandle). Required
# by the plugin IPC protocol (postcard); host crates that don't need IPC
# don't pay for the serde dep.
serde = ["dep:serde", "arrayvec/serde", "bitflags/serde", "keyboard-types/serde", "rgb/serde", "tutti-types/serde"]

# The probe's result file (`ProbeOutcome`, `write_result`, `read_result`): the
# wire between `tutti-plugin-probe` and the host that spawned it.
probe-wire = ["serde", "dep:postcard"]

# The mapping contract, `tutti_plugin_types::contract` (doc 029 section 6.1): the
# laws a `ParamMapping` is held to, as `mapping_contract!`. Test support, so off
# by default: this crate's own tests turn it on through the self dev-dependency
# below, and a format host turns it on in its dev-dependency on this crate.
contract = []

# `FakePlugin`: a plugin that records every call, for testing what drives one. A
# consumer's dev-dependency; nothing ships it.
testing = []

[dependencies]
# The capped per-block containers (`MidiEventVec`, the harmony changes): a
# fixed run of slots that cannot grow, so the cap is the type's.
arrayvec = "0.7"
# Plugin capability flag set (`Features`) — wgpu-style bitflags.
bitflags = "2"
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol" }
# The engine's unit vocabulary (`Samples`, `Tail`).
tutti-types = { version = "0.0.1", path = "../tutti-types" }
# `Offset`: where a block's MIDI sits (`ProcessContext::midi_events`, `WireMidi::at`).
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
raw-window-handle = "0.6"
# The result file's payload encoding, with `probe-wire`.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"], optional = true }
# The editor key vocabulary (`KeyEvent`).
keyboard-types.workspace = true
# Structured editor-open errors (`EditorError`).
thiserror.workspace = true
# The track's colour (`TrackInfo::color`).
rgb.workspace = true

[dev-dependencies]
# Turns `contract` on for this crate's own tests (the pattern `tutti-dsp` uses).
tutti-plugin-types = { path = ".", features = ["contract"] }
# The no-alloc gates on the point storage (`PointBuf`, `ParameterChanges`).
assert_no_alloc = { version = "1", default-features = false }
# Wire-format round-trip tests for the serde-gated metadata types.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# The plugin catalog is JSON, so its backward-compat test needs it too.
serde_json = "1"
# `bundle`'s tests assemble real bundle directories on disk — the layout is the
# thing under test, so faking the filesystem would test the fake.
tempfile = "3"
# Property tests over `step`: arbitrary event sequences, no plugin loaded.
proptest = "1.9.0"
# `check_range_contract` on `ContentScale`.
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
