[package]
name = "tutti-plugin-types"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Shared value vocabulary for tutti's plugin host crates (VST2/VST3/CLAP/AU)"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-plugin-types"
readme = "README.md"
keywords = ["audio", "plugin", "vst3", "clap", "types"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# Enables Serialize/Deserialize on the wire-eligible types (TransportInfo,
# ParameterChanges, EditorSize, EditorCapabilities, WindowHandle). Required
# by tutti-plugin's bincode IPC protocol; host crates that don't need IPC
# don't pay for the serde dep.
serde = ["dep:serde", "arrayvec/serde", "bitflags/serde", "tutti-types/serde"]

# The probe's result file (`ProbeOutcome`, `write_result`, `read_result`): the
# wire between `tutti-plugin-probe` and the host that spawned it.
probe-wire = ["serde", "dep:bincode"]

# `FakePlugin`: a plugin that records every call, for testing what drives one. A
# consumer's dev-dependency; nothing ships it.
test-support = []

[dependencies]
# The capped per-block containers (`MidiEventVec`, the harmony changes): a
# fixed run of slots that cannot grow, so the cap is the type's.
arrayvec = "0.7"
# Plugin capability flag set (`Features`) — wgpu-style bitflags.
bitflags = "2"
tutti-midi-types = { path = "../tutti-midi-types", default-features = false }
# The engine's AudioIn/AudioOut I/O vocabulary — this crate's `Sample` is the
# plugin-width narrowing of that vocabulary's element type, and `AudioBuffer`
# names its roles in the doc contract.
tutti-types = { path = "../tutti-types" }
tutti-rt = { path = "../tutti-rt" }
tutti-ump = { path = "../tutti-ump", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
# The result file's payload encoding, with `probe-wire`.
bincode = { version = "1", optional = true }
# Structured editor-open errors (`EditorError`).
thiserror.workspace = true

[dev-dependencies]
# The no-alloc gates on the point storage (`PointBuf`, `ParameterChanges`).
assert_no_alloc = { version = "1", default-features = false }
# Wire-format round-trip tests for the serde-gated metadata types.
bincode = "1"
# The plugin catalog is JSON, so its backward-compat test needs it too.
serde_json = "1"
# `bundle`'s tests assemble real bundle directories on disk — the layout is the
# thing under test, so faking the filesystem would test the fake.
tempfile = "3"
# Property tests over `step`: arbitrary event sequences, no plugin loaded.
proptest = "1.9.0"
# `check_range_contract` on `ContentScale`.
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
