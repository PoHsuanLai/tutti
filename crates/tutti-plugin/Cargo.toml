[package]
name = "tutti-plugin"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Plugin hosting for Tutti: loads VST3, CLAP and AU plugins in isolated subprocesses (VST2 in-process) as audio-graph nodes"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-plugin"
readme = "README.md"
keywords = ["audio", "plugin", "vst3", "clap", "host"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
# Nothing on by default. This is a library: persistence and format support are
# the embedding app's choices, so every one of them is opt-in and the default
# build pulls no `serde_json` and no format FFI.
default = []

# Opt-in versioned JSON database file (`tutti-plugin-db`'s `save` and `load`)
# behind `Plugins::load` and `Plugins::save`. Leave it off and build a
# `PluginDb` from your own store.
json = ["tutti-plugin-db/json"]

# In-process GUI support (loads plugin library in host for editor only)
vst3 = ["dep:tutti-vst3-host"]
clap = ["dep:tutti-clap-host"]
au = ["dep:tutti-au-host"]

# In-process VST2 hosting (audio + native editor on the host process).
# Unlike VST3/CLAP/AU, VST2 is always in-process: its `AEffect` fuses the
# editor and audio processor into one instance, so the editor cannot live
# in a different process from the audio. There is no subprocess VST2 path
# here.
vst2 = ["dep:tutti-vst2-host"]

[dependencies]
# The format-generic half of hosting: the handle, the node's controls, the
# transport and parameter delivery, and the in-process node (design 021 4a).
tutti-plugin-host = { path = "../tutti-plugin-host" }

# The transport the hosted plugins read.
tutti-transport = { path = "../tutti-transport" }
tutti-tempo = { path = "../tutti-tempo" }
# The engine's value vocabulary (`Samples`, `SampleRate`).
tutti-types = { path = "../tutti-types" }

# The graph, for a plugin node's own `ForkSource` (fork by state
# transfer). No cycle: `tutti-graph` names only `tutti-types`, `tutti-rt` and `tutti-ump`.
tutti-graph = { path = "../tutti-graph" }

# MIDI support
tutti-midi-runtime = { path = "../tutti-midi-runtime" }

# The process edge: the wire, the slab, the server's launch and the client of a
# served plugin (design 021 step 3).
tutti-plugin-ipc = { path = "../tutti-plugin-ipc" }

# Shared value vocabulary used across host crates + IPC protocol.
tutti-plugin-types = { path = "../tutti-plugin-types", features = ["serde", "probe-wire"] }

# Discovery: the scanner, the catalog and its records. This crate supplies the
# subprocess probe.
tutti-plugin-db = { path = "../tutti-plugin-db" }

# Logging
tracing = "0.1"

# In-process plugin GUI (optional — loads plugin library for editor only).
# `tutti-vst2-host` is different: it owns the audio path too (single in-process
# AEffect), since VST2 fuses editor and processor.
tutti-vst3-host = { path = "../tutti-vst3-host", optional = true }
tutti-clap-host = { path = "../tutti-clap-host", optional = true }
tutti-au-host = { path = "../tutti-au-host", optional = true }
tutti-vst2-host = { path = "../tutti-vst2-host", optional = true }

# The probe's private result directory (pure Rust; removed on drop, panic included).
tempfile = "3"

[dev-dependencies]
tutti-rt = { path = "../tutti-rt" }
tutti-ump = { path = "../tutti-ump", default-features = false }
# The tests' mock listeners.
parking_lot = "0.12"
# The node tests' mock plugin-server speaks the wire by hand.
interprocess = { version = "2" }
bincode = "1"
# The catalog tests' scan hand-off.
crossbeam-channel = "0.5"
# The client's test-only knobs (`set_rate_timeout`, `settled_replies`).
tutti-plugin-ipc = { path = "../tutti-plugin-ipc", features = ["test-support"] }
tutti-engine = { path = "../tutti-engine" }
# `contract::{drive_input, Direct}`: the in-process VST2 node driven by hand, as
# a graph drives it, in its tests, allocation gate and bench.
tutti-graph = { path = "../tutti-graph", features = ["contract"] }
# `clap_fork.rs` exports through a forked plugin, to pin that a fork failing
# mid-render fails the export by name. Acyclic: tutti-export does not depend on
# tutti-plugin. WAV only, for `ExportConfig`'s `Default` (a config names its
# format when none is on); the test renders to buffers.
tutti-export = { path = "../tutti-export", default-features = false, features = ["wav"] }
# `tutti_nodes::testing` stimulus nodes for tests, examples and doctests, and
# the control lane (`ControlLaneNode::for_foreign`) that drives a plugin's
# parameters through its event input: what replaced the crate's own
# automation node. Dev-only: the node itself names no lane.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }
# The lane's `ControlProgram`, for the tests and the example that build one.
tutti-modulation = { path = "../tutti-modulation", default-features = false }
# Finds the reference plugins and the plugin-server beside the test binary.
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["plugin"] }
assert_no_alloc = { version = "1", default-features = false }
# The reference VST2 plugin the in-process lifecycle tests load, plus
# `libloading` to re-open the image the host loaded and read its capture — the
# linked rlib is a separate image with separate statics, so only the cdylib's
# globals see the host's calls. The same pair, for the same reasons, as
# `tutti-vst2-host`'s dev-dependencies; here it lets a test assert what the
# *node* dispatched rather than what the instance API does.
libloading = "0.8"
tutti-vst2-test-plugin = { path = "../../testing/tutti-vst2-test-plugin" }
# The reference CLAP plugin the OUT-OF-PROCESS correctness suites drive. A
# dev-dependency for the artifact, not the API: cargo builds its cdylib in this
# same `cargo test` (no nested cargo, no target-dir-lock deadlock) and the
# tests find it beside the test binary. Unlike the VST2 probe, nothing here links
# its rlib — the plugin is loaded by a `plugin-server` subprocess, so the only
# thing this crate needs is the file on disk.
tutti-clap-test-plugin = { path = "../../testing/tutti-clap-test-plugin" }

# `kill(pid, 0)`, so `real_plugin_pressure`'s leak check asks about the exact
# `plugin-server` pids it launched rather than spawning `pgrep` to scan the
# process table. The Windows half of the same probe is below. Also
# `getrusage(RUSAGE_THREAD)`, for the voluntary context switches its step clock
# reads on Linux.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# The Windows half of the pid probe: `OpenProcess` and its exit code.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"] }


# NOTE: the `loom` model of this crate's shared-memory header protocol lives in
# the sibling `tutti-shm-model` crate, not here. `--cfg loom` is a global
# RUSTFLAG, and the model's target must not depend on whether every crate in
# this crate's dependency tree compiles under it. See that crate's Cargo.toml
# for the full reasoning.

# docs.rs renders with every feature on; otherwise it would publish a page with
# the feature-gated half of the public API missing.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
