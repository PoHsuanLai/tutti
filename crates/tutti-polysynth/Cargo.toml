[package]
name = "tutti-polysynth"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "A polyphonic synthesizer with unison, portamento, alternative tunings and per-note expression"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "synthesizer", "polyphony", "mpe", "dsp"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []

[dependencies]
thiserror = { workspace = true }

tutti-midi-runtime = { path = "../tutti-midi-runtime", default-features = false }

# `Node`, `ForkSource`: the synth as a graph node, and its own way into a
# fork of the graph (an export), as `tutti-plugin`'s `PluginClient` has
# one.
tutti-graph = { path = "../tutti-graph" }

# The SVF and ladder coefficient functions. The voice bank runs those two
# filters' topologies across SIMD lanes and derives its coefficients from the
# same functions `SvfFilterNode`/`LadderFilterNode` use, rather than a copy.
tutti-dsp = { path = "../tutti-dsp", default-features = false }

# `f32x8` lanes for the voice bank.
wide = { version = "1.6", default-features = false }

tutti-types = { path = "../tutti-types", default-features = false }
# `Law`, the shape of the portamento glide.
tutti-curve = { path = "../tutti-curve" }
tutti-midi-protocol = { path = "../tutti-midi-protocol" }
tutti-ump = { path = "../tutti-ump", default-features = false }
tutti-voicing = { path = "../tutti-voicing" }

[dev-dependencies]
# The filter nodes the bank is compared against (`bank.rs`), and the mixing and
# lane nodes of the integration tests.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }
# The graph contract's test harness.
tutti-graph = { path = "../tutti-graph", features = ["contract"] }
criterion.workspace = true
approx = "0.5"
# `check_range_contract`'s serde shape, for `UnisonVoices`.
serde = "1"
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
assert_no_alloc = { version = "1", default-features = false }
tutti-midi-runtime = { path = "../tutti-midi-runtime", default-features = false }
# `ControlProgram` for the lane tests (`tests/param_lanes.rs`).
tutti-modulation = { path = "../tutti-modulation", default-features = false }

[[bench]]
name = "polysynth"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
