[package]
name = "tutti-rt"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Real-time-safe shared-memory primitives for the audio thread, and the one thread-priority call"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "real-time", "lock-free"]
categories = ["multimedia::audio", "concurrency"]
# Not published: it carries the engine's `unsafe` (the denormals guard, the
# parallel executor's claims), and whether it is offered as a crate of its own
# is the maintainer's call. See docs/design/012-unsafe-policy.md.
publish = false

[lints]
workspace = true

[dependencies]
# `request_priority`: the OS thread-priority call, behind one outcome type.
thread-priority = "1.1"
# `ArcLend`/`Loan`/`Reader`, re-exported at the root: the cell non-scalar state
# reaches the audio thread through. A general-purpose crate that names no tutti
# crate.
arc-lend = { path = "../arc-lend" }
# The fixed inline storage behind `RtVec` (`vec.rs`): a run of `N` slots that
# cannot grow, so the cap is the type's, not a check beside it.
arrayvec = "0.7"
# The byte views behind `SeqWriter<T>` and `PackedAtomic<T>`: a `NoUninit +
# AnyBitPattern` value to and from its bytes with no `unsafe`.
bytemuck = "1.16"

# `PosRing`'s, `PackedAtomic`'s, `SeqWriter`/`SeqReader`'s and `AudioThreadCell`'s
# atomics become loom's under `--cfg loom`, so the models in `tests/*_loom.rs`
# check the shipped protocols rather than replicas.
# Only that flag pulls this in; a normal build never sees loom.
#
#     cargo test -p tutti-rt --release --test pos_ring_loom   (with the loom cfg flag set)
#
# This can live here, unlike `tutti-shm-model`, because nothing in this crate's
# dependency closure breaks under the flag. The one dependency that reacts to
# it, `arc-lend`, does so by the same design (its atomics become loom's too).
# `monotonic_ns`: the OS clock read, `clock_gettime` on Unix and
# `QueryPerformanceCounter` on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Performance"] }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }

# `tests/spin_starvation.rs` (an ignored probe) pins its threads to one core
# and sets their scheduling policy: `sched_setaffinity`, `pthread_setschedparam`.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
