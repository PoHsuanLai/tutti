[package]
name = "tutti-rustysynth"
version = "1.3.6"
authors = ["Nobuaki Tanaka"]
edition.workspace = true
rust-version.workspace = true

description = "A SoundFont synthesizer in pure Rust, tutti's port of rustysynth"
readme = "README.md"
repository.workspace = true
license = "MIT"
keywords = ["soundfont", "midi", "synthesizer", "audio", "music"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
tutti-sf2 = { path = "../tutti-sf2" }
tutti-types = { path = "../tutti-types", default-features = false }
tutti-ump = { path = "../tutti-ump", default-features = false }
thiserror.workspace = true

[dev-dependencies]
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
