[package]
name = "tutti-rustysynth"
version = "1.3.6"
authors = ["Nobuaki Tanaka"]
edition.workspace = true
rust-version.workspace = true

description = "A SoundFont MIDI synthesizer written in pure Rust (tutti's fork of rustysynth, with Clone support)"
readme = "README.md"
repository = "https://github.com/PoHsuanLai/Tutti"
license = "MIT"
keywords = ["soundfont", "midi", "synthesizer", "audio", "music"]
categories = ["multimedia::audio"]

[features]
default = []

[dependencies]
thiserror = { version = "2", default-features = false, optional = true }
