# The Bevy-free API layer (design 015): the cross-crate composition both
# umbrellas use. `bevy-tutti` and `tutti` depend on it; nothing else does.
#
# Not an umbrella: it re-exports no crate whole (`scripts/check-adapter.sh`
# fails on `pub use tutti_x as …;`, `pub use tutti_x;` and
# `pub use tutti_x::*;`), only the single items its own signatures take. And no
# `bevy` feature: nothing here reaches Bevy (`scripts/check-bevy-free.sh` runs
# `cargo tree -p tutti-session -e normal --all-features`).
[package]
name = "tutti-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The tutti audio engine's Bevy-free API layer: a graph, its engine, its device and the order they run in"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-session"
keywords = ["audio", "real-time", "engine", "daw"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# Always: the graph, the engine and transport, the vocabulary, and the nodes
# the builder inserts (the click) and modulation applies (`Modulation`).
tutti-types = { path = "../tutti-types", default-features = false }
tutti-ump = { path = "../tutti-ump", default-features = false }
tutti-graph = { path = "../tutti-graph" }
tutti-transport = { path = "../tutti-transport" }
tutti-metering = { path = "../tutti-metering" }
tutti-engine = { path = "../tutti-engine" }
tutti-nodes = { path = "../tutti-nodes", default-features = false }
# Logging: what the `bevy_log` calls of `bevy-tutti`'s old `GraphRuntime`
# became. `bevy_log` is a `tracing` subscriber, so a Bevy app sees these
# where it saw those.
tracing = "0.1"
thiserror.workspace = true

# The sound card. Off: offline only, and no ALSA headers needed.
tutti-cpal = { path = "../tutti-cpal", default-features = false, optional = true }
tutti-modulation = { path = "../tutti-modulation", default-features = false, optional = true }
tutti-midi-types = { path = "../tutti-midi-types", default-features = false, optional = true }
tutti-midi-runtime = { path = "../tutti-midi-runtime", default-features = false, optional = true }
tutti-midi-file = { path = "../tutti-midi-file", optional = true }
tutti-midi-hardware = { path = "../tutti-midi-hardware", optional = true }
tutti-sampler = { path = "../tutti-sampler", default-features = false, optional = true }
tutti-soundfont = { path = "../tutti-soundfont", optional = true }
tutti-polysynth = { path = "../tutti-polysynth", optional = true }
tutti-export = { path = "../tutti-export", default-features = false, optional = true }
tutti-plugin = { path = "../tutti-plugin", optional = true }
# `assert_main_thread`, the debug-only guard on the calls whose frees are
# main-thread-only (design 015 §4.2).
tutti-plugin-types = { path = "../tutti-plugin-types", optional = true }

[features]
# Every subsystem is a feature, as on every engine crate. There is no `bevy`
# feature, and there must never be one (`scripts/check-bevy-free.sh`).
default = []
device = ["dep:tutti-cpal"]
# `Recorder` and its pump loop: device-free, so a host that records files or
# taps without a microphone (`bevy-tutti`'s `AudioPump`) takes it alone.
record = []
# The live I/O edge: `record`, and with `device`, the mic capture too.
audio-io = ["record", "tutti-cpal?/capture"]
modulation = ["dep:tutti-modulation"]
midi = [
    "dep:tutti-midi-types",
    "dep:tutti-midi-runtime",
    "dep:tutti-midi-file",
]
midi-hardware = ["midi", "dep:tutti-midi-hardware"]
sampler = ["dep:tutti-sampler"]
soundfont = ["midi", "dep:tutti-soundfont"]
synth = ["dep:tutti-polysynth"]
convolution = ["tutti-nodes/convolution"]
# Export. `export` is the offline renderer and WAV, which is pure Rust; FLAC and
# AIFF are pure Rust and opt-in, and `export-ogg` is the one path to C (the
# Vorbis library, `ogg_next_sys`). `scripts/check-layout.sh` holds that a build
# with `export` alone reaches no C.
export = ["dep:tutti-export", "tutti-export/wav"]
export-wav = ["export"]
export-flac = ["export", "tutti-export/flac"]
export-aiff = ["export", "tutti-export/aiff"]
export-ogg = ["export", "tutti-export/ogg"]
plugin = ["dep:tutti-plugin", "dep:tutti-plugin-types", "midi"]
vst2 = ["plugin", "tutti-plugin/vst2"]
vst3 = ["plugin", "tutti-plugin/vst3"]
clap = ["plugin", "tutti-plugin/clap"]
au = ["plugin", "tutti-plugin/au"]

[dev-dependencies]
# The SoundFont type the instrument contract's subject decodes a font into
# (`tutti-soundfont` does not re-export it).
tutti-sf2 = { path = "../tutti-sf2" }
# The `FakeBackend` the hot-plug tests drive (`plug`, `unplug`). Dev-only:
# `midi-hardware` must not link a fake backend.
tutti-midi-hardware = { path = "../tutti-midi-hardware", features = ["test-support"] }
# `ArcLend` for the tests that publish into a graph.
tutti-rt = { path = "../tutti-rt" }
# The tempo map a sampler test publishes through the transport.
tutti-tempo = { path = "../tutti-tempo" }
# Stimulus nodes (`Const`, `Osc`, `Through`) for the tests and doctests.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }
# The in-memory tone a sampler voice test plays (`Wave`).
tutti-codec = { path = "../tutti-codec", features = ["encode-wav", "decode-wav", "decode-flac"] }
# An independent reader for the WAV files the recorder tests write.
hound = "3.5"
# `test-support`'s hand-stepped streamer, and the WAV reader the disk voice's
# fork reads its file with (`export_fork_sampler`).
tutti-sampler = { path = "../tutti-sampler", default-features = false, features = ["test-support", "wav"] }
# `ManualStreamDriver`, `OutputSpec`: the device-free device tests.
tutti-cpal = { path = "../tutti-cpal", default-features = false }
# The reference CLAP plugin `tests/plugin.rs` loads, in a
# `plugin-server` (built first: `cargo build -p tutti-plugin-server`; it is
# not a dev-dependency, which would be a cycle through `tutti-plugin`).
tutti-clap-test-plugin = { path = "../../testing/tutti-clap-test-plugin" }
# The reference VST2 plugin the `vst2_*` suites load in process (`vst2`), and
# `libloading` re-opens the image the host loaded to read what it captured and
# to flip its switches: the linked rlib is a separate image with separate
# statics. The same pair, for the same reason, as `tutti-plugin`'s.
tutti-vst2-test-plugin = { path = "../../testing/tutti-vst2-test-plugin" }
libloading = "0.8"
# Finds both beside the running binary (`tests/support`).
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
# The shared test plugin the instrument contract hosts in `Notes` mode, and
# the font its SoundFont subject plays.
tutti-shared-plugin = { path = "../../testing/tutti-shared-plugin" }
assert_no_alloc = { version = "1", default-features = false }
# The directory a cancelled export's file is looked for in (`tests/export_cancel.rs`).
tempfile = "3.10"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# The device-free device tests (`ManualStreamDriver`): `device` is a feature,
# so this suite runs under it (CI's dark-features job names it; a workspace run
# no longer turns it on).
[[test]]
name = "device"
required-features = ["device"]

# A restart onto another rate, width or block (the session halves of
# `bevy-tutti`'s `engine::restart` tests), and the MIDI clock's re-rate.
[[test]]
name = "device_restart"
required-features = ["device"]

[[test]]
name = "device_listing"
required-features = ["device"]

[[test]]
name = "device_midi_clock"
required-features = ["device", "midi"]

# The recorder: its thread, and the pump over a tap and a decoded file.
[[test]]
name = "recorder_thread"
required-features = ["record"]

[[test]]
name = "tap_to_wav_roundtrip"
required-features = ["record"]

[[test]]
name = "file_in_pump"
required-features = ["record"]

# Work handed to the main thread runs on the session's update.
[[test]]
name = "deferred_main"
required-features = ["plugin"]

# The session's modulation loop (`Session::mods`, `ModInput`).
[[test]]
name = "modulation"
required-features = ["modulation"]

# Modulation on control lanes through the session: renders, takes, refusals
# and the node-side declarations (`export` and `synth` gate two cases inside
# the file).
[[test]]
name = "mod_lanes"
required-features = ["modulation"]

# The insertion paths address a node's params, so a lane's knob is its cell.
[[test]]
name = "params_at_insert"
required-features = ["modulation"]

# Indexed param addresses through the session: a graph write and a modulation
# route to a node's second param of one kind.
[[test]]
name = "indexed_params"
required-features = ["modulation"]

# A held key across a retarget and a re-route.
[[test]]
name = "held_keys"
required-features = ["midi"]

# Clips, live inputs, routes and the hardware out (`Session::midi`).
[[test]]
name = "midi"
required-features = ["midi"]

# A clip's velocity keeps its 16 bits to the event input.
[[test]]
name = "midi_velocity"
required-features = ["midi"]

# Route rules: the union of two on one target, and a disabled one.
[[test]]
name = "midi_routes"
required-features = ["midi"]

# Stopping an export and reading its progress (`ExportHandle`).
[[test]]
name = "export_cancel"
required-features = ["export"]

# A parallel export is bit-identical to the serial one.
[[test]]
name = "export_parallel"
required-features = ["export"]

# What an export renders and forks: the graph's own latency and tail, a
# prepare hook's edit and timeline, a fork's isolation from live playback,
# and where a fork is built and dropped (the session halves of the
# `bevy-tutti` export suites).
[[test]]
name = "export_fork"
required-features = ["export"]

# A SoundFont, a polysynth and their clip, exported through a fork.
[[test]]
name = "export_fork_synth"
required-features = ["export", "midi", "synth", "soundfont"]

# A sampler voice (memory and disk) exported through a fork.
[[test]]
name = "export_fork_sampler"
required-features = ["export", "sampler"]

# A voice of either tier arrives where the compiler puts it (doc 025 stage 5).
[[test]]
name = "tier_alignment"
required-features = ["sampler"]

# A sampler node the graph adds reads the session's tempo map (doc 020, stage 5).
[[test]]
name = "sampler_tempo"
required-features = ["sampler"]

# A hosted plugin exported through a fork of its own server: fails without
# `plugin-server`, by design.
[[test]]
name = "export_fork_plugin"
required-features = ["export", "clap"]

# Hosted plugins, their render mode and exports, over the reference CLAP
# plugin in a real `plugin-server`: fails without the server, by design.
[[test]]
name = "plugin"
required-features = ["clap", "export"]

# A hosted plugin's latency is the session's, across a crossfade and a
# restart (the session halves of `bevy-tutti`'s `plugin_capture` and restart
# tests): the reference CLAP plugin in a real `plugin-server`.
[[test]]
name = "plugin_latency"
required-features = ["clap", "device"]

# What `Phase::Plugins` does with a hosted plugin's health, over a fake
# backend (no `plugin-server`): the session half of `bevy-tutti`'s
# `plugin_host::health` tests.
[[test]]
name = "plugin_health"
required-features = ["plugin"]

# Modulation lanes on a hosted plugin's parameters: across a recovery and a
# crossfade, and an export equal to the live render (the session halves of
# `bevy-tutti`'s `plugin_recovery`, `plugin_capture` and `mod_plugin`).
[[test]]
name = "plugin_modulation"
required-features = ["clap", "modulation", "export"]

# The reference VST2 plugin, in process: the project meter it is given, and
# modulation lanes on its parameters (the session halves of `bevy-tutti`'s
# `plugin_vst2_meter` and `mod_plugin` VST2 tests).
[[test]]
name = "vst2_meter"
required-features = ["vst2"]

[[test]]
name = "vst2_modulation"
required-features = ["vst2", "modulation"]

# MIDI into a SoundFont unit, rendered: a clip on its beat, a live preview
# beside it, a routed hardware note.
[[test]]
name = "midi_soundfont"
required-features = ["soundfont"]

# The General MIDI setup of a SoundFont unit (`Session::add_general_midi`).
[[test]]
name = "general_midi"
required-features = ["soundfont"]

# The instrument contract (`tests/instrument_support`): the same cases against
# `PolySynth`, the SoundFont unit and a hosted plugin. The plugin subject needs
# a built `plugin-server`, and fails without it.
[[test]]
name = "instrument_polysynth"
required-features = ["synth", "soundfont", "clap"]

[[test]]
name = "instrument_soundfont"
required-features = ["synth", "soundfont", "clap"]

[[test]]
name = "instrument_plugin"
required-features = ["synth", "soundfont", "clap"]

[[test]]
name = "instrument_refusal"
required-features = ["synth", "soundfont", "clap"]

[[test]]
name = "instrument_main_pair"
required-features = ["synth", "soundfont", "clap"]

# Each block's load against its deadline, on a heavy scene of the engine's
# own nodes, serial and on the pool: a percentile harness, not criterion.
[[bench]]
name = "render_load"
harness = false
required-features = ["synth", "sampler", "convolution", "midi"]

# The §5.1 and §5.2 examples are the umbrella's (`crates/tutti/examples`):
# they import `tutti::prelude`, which this crate cannot name.

# A steady-state update's cost with modulation declared: a percentile
# harness, not criterion (`benches/mod_update.rs`).
[[bench]]
name = "mod_update"
harness = false
required-features = ["modulation"]
