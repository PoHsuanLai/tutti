# The API layer: the cross-crate composition. `tutti` depends on it.
#
# Not an umbrella: it re-exports no crate whole (`cargo xtask check-session`
# fails on `pub use tutti_x as …;`, `pub use tutti_x;` and
# `pub use tutti_x::*;`), only the single items its own signatures take.
[package]
name = "tutti-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The tutti audio engine's API layer: a graph, its engine, its device and the order they run in"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-session"
keywords = ["audio", "real-time", "engine", "daw"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# Always: the graph, the engine and transport, the vocabulary, and the nodes
# the builder inserts (the click) and modulation applies (`Modulation`).
tutti-types = { path = "../tutti-types", default-features = false }
tutti-ump = { path = "../tutti-ump", default-features = false }
tutti-graph = { path = "../tutti-graph" }
tutti-transport = { path = "../tutti-transport" }
# The project's tempo map, which a bounce's range and clock are derived from.
tutti-tempo = { path = "../tutti-tempo" }
tutti-metering = { path = "../tutti-metering" }
tutti-engine = { path = "../tutti-engine" }
# `monotonic_ns`, the OS clock the engine's block clock is on (the MIDI inputs'
# arrival stamps are related to it); `ArcLend` for the tests that publish.
tutti-rt = { path = "../tutti-rt" }
tutti-nodes = { path = "../tutti-nodes", default-features = false }
tracing = "0.1"
thiserror.workspace = true
serde = { version = "1", optional = true, features = ["derive"] }

# The sound card. Off: offline only, and no ALSA headers needed.
tutti-cpal = { path = "../tutti-cpal", default-features = false, optional = true }
tutti-modulation = { path = "../tutti-modulation", default-features = false, optional = true }
# `MpeMode`, the session builder's one MPE setting.
tutti-midi-protocol = { path = "../tutti-midi-protocol", optional = true }
tutti-midi-runtime = { path = "../tutti-midi-runtime", default-features = false, optional = true }
tutti-midi-file = { path = "../tutti-midi-file", optional = true }
tutti-midi-hardware = { path = "../tutti-midi-hardware", optional = true }
tutti-sampler = { path = "../tutti-sampler", default-features = false, optional = true }
tutti-soundfont = { path = "../tutti-soundfont", optional = true }
# The font a `Midi::load_soundfont` job opens (`tutti-soundfont` does not re-export it).
tutti-sf2 = { path = "../tutti-sf2", optional = true }
tutti-polysynth = { path = "../tutti-polysynth", optional = true }
tutti-export = { path = "../tutti-export", default-features = false, optional = true }
# `DecodeError` (in `Error::Decode`, whatever decoders are on) and `Format`,
# the file format a bounce names (`Bounce::format`). No codec feature.
tutti-codec = { path = "../tutti-codec" }
# `DitherSink`, the dither a recording opts into (the one an export uses), and
# the `DitherShape` a bounce names.
tutti-dsp = { path = "../tutti-dsp", default-features = false, optional = true }
tutti-plugin = { path = "../tutti-plugin", optional = true }
# The control handle, the node's controls and the host policy over a handle
# (`Liveness`, `PluginParamValues`): what a hosted plugin is, whatever serves it.
tutti-plugin-host = { path = "../tutti-plugin-host", optional = true }
# `MainThread`, the proof `MainSession` holds, and the editor vocabulary.
tutti-plugin-types = { path = "../tutti-plugin-types", optional = true }
# `HasWindowHandle`, the parent a view embeds an editor into (`EditorView::open`).
raw-window-handle = { version = "0.6", optional = true }

[features]
# Every subsystem is a feature, as on every engine crate.
default = []
device = ["dep:tutti-cpal"]
# `Recorder` and its pump loop: device-free, so a host that records files or
# taps without a microphone takes it alone.
record = ["dep:tutti-dsp"]
# The live I/O edge: `record`, and with `device`, the mic capture too.
audio-io = ["record", "tutti-cpal?/capture", "encode-wav"]
modulation = ["dep:tutti-modulation"]
midi = [
    "dep:tutti-midi-protocol",
    "dep:tutti-midi-runtime",
    "dep:tutti-midi-file",
]
midi-hardware = ["midi", "dep:tutti-midi-hardware"]
# `serde` for `MidiRouteRule<T>` (keyed by the app's own stable id, not a
# `NodeKey`): its Group and channel are `tutti-ump`'s, with its `serde`.
serde = ["midi", "dep:serde", "tutti-ump/serde"]
sampler = ["dep:tutti-sampler", "tutti-sampler/decode-wav"]
soundfont = ["midi", "dep:tutti-soundfont", "dep:tutti-sf2"]
synth = ["dep:tutti-polysynth"]
# Export. `export` is the offline renderer and WAV, which is pure Rust; FLAC and
# AIFF are pure Rust and opt-in (`encode-flac`, `encode-aiff`), and `encode-vorbis` is the one path to C (the
# Vorbis library, `ogg_next_sys`). `cargo xtask check-layout` holds that a build
# with `export` alone reaches no C.
export = ["dep:tutti-export", "dep:tutti-dsp", "encode-wav"]
# The encoders `tutti-codec` writes, under the codec's own names; none implies `export`.
encode-wav = ["tutti-codec/encode-wav"]
encode-flac = ["tutti-codec/encode-flac"]
encode-aiff = ["tutti-codec/encode-aiff"]
encode-vorbis = ["tutti-codec/encode-vorbis"]
plugin = ["dep:tutti-plugin", "dep:tutti-plugin-host", "dep:tutti-plugin-types", "dep:raw-window-handle", "midi"]
vst2 = ["plugin", "tutti-plugin/vst2"]
vst3 = ["plugin", "tutti-plugin/vst3"]
clap = ["plugin", "tutti-plugin/clap"]
au = ["plugin", "tutti-plugin/au"]
# What a test reads of the graph's plumbing (`Graph::testing`, `take_audio_side`,
# `AudioSide`). Off by default; this crate's own tests turn it on through the
# dev-dependency on itself below, as `tutti-graph` does.
testing = []

[dev-dependencies]
# Turns `testing` on for this crate's own tests, benches and doctests.
tutti-session = { path = ".", features = ["testing"] }
# The `FakeBackend` the hot-plug tests drive (`plug`, `unplug`). Dev-only:
# `midi-hardware` must not link a fake backend.
tutti-midi-hardware = { path = "../tutti-midi-hardware", features = ["testing"] }
# The MIDI-CI messages a fake device answers the session's Discovery with
# (`tests/midi/midi.rs`).
tutti-midi-device = { path = "../tutti-midi-device" }
# Stimulus nodes (`Const`, `Osc`, `Through`) for the tests and doctests.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }
# The in-memory tone a sampler voice test plays (`Wave`).
tutti-codec = { path = "../tutti-codec", features = ["encode-wav", "decode-wav", "decode-flac"] }
# An independent reader for the WAV files the recorder tests write.
hound = "3.5"
# `MidiRouteRule`'s serde round trip (`tests/midi/midi_front.rs`).
serde_json = "1"
# `testing`'s hand-stepped streamer, and the WAV reader the disk voice's
# fork reads its file with (`export_fork_sampler`).
tutti-sampler = { path = "../tutti-sampler", default-features = false, features = ["testing", "decode-wav"] }
# `ManualStreamDriver`, `OutputSpec`: the device-free device tests.
tutti-cpal = { path = "../tutti-cpal", default-features = false }
# The reference CLAP plugin `tests/plugin/plugin.rs` loads, in a
# `plugin-server` (built first: `cargo build -p tutti-plugin-server`; it is
# not a dev-dependency, which would be a cycle through `tutti-plugin`).
tutti-clap-test-plugin = { path = "../../testing/tutti-clap-test-plugin", features = ["probe"] }
# `PluginEntry`: a scanned plugin, which `PluginRef::from` reads (`plugin_identity`).
tutti-plugin-db = { path = "../tutti-plugin-db" }
# The reference VST2 plugin the `vst2_*` suites load in process (`vst2`), and
# `libloading` re-opens the image the host loaded to read what it captured and
# to flip its switches: the linked rlib is a separate image with separate
# statics. The same pair, for the same reason, as `tutti-plugin`'s.
tutti-vst2-test-plugin = { path = "../../testing/tutti-vst2-test-plugin" }
libloading = "0.8"
# Finds both beside the running binary (`tests/support`).
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["plugin"] }
# `FakePlugin` and its `FakeLoaded` control: a hosted plugin whose editor a test
# scripts (`tests/plugin/main_view.rs`).
tutti-plugin-types = { path = "../tutti-plugin-types", features = ["testing"] }
# The shared test plugin the instrument contract hosts in `Notes` mode, and
# the font its SoundFont subject plays.
tutti-shared-plugin = { path = "../../testing/tutti-shared-plugin" }
assert_no_alloc = { version = "1", default-features = false }
# The directory a cancelled export's file is looked for in (`tests/export/export_cancel.rs`).
tempfile = "3.10"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# The instrument contract (`tests/instrument/instrument_support`): the same cases
# against `PolySynth`, the SoundFont unit and a hosted plugin. The plugin subject
# needs a built `plugin-server`, and fails without it.
[[test]]
name = "instrument"
required-features = ["synth", "soundfont", "clap"]

# Each block's load against its deadline, on a heavy scene of the engine's
# own nodes, serial and on the pool: a percentile harness, not criterion.
[[bench]]
name = "render_load"
harness = false
required-features = ["synth", "sampler", "midi"]

# The §5.1 and §5.2 examples are the umbrella's (`crates/tutti/examples`):
# they import from `tutti`'s root, which this crate cannot name.

# A steady-state update's cost with modulation declared: a percentile
# harness, not criterion (`benches/mod_update.rs`).
[[bench]]
name = "mod_update"
harness = false
required-features = ["modulation"]
