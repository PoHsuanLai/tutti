[package]
name = "tutti-sf2"
version = "0.0.1"
authors = ["Nobuaki Tanaka"]
edition.workspace = true
rust-version.workspace = true
description = "A SoundFont 2 (.sf2) file as data: presets, instruments, sample headers and sample data, with no synthesizer"
readme = "README.md"
repository.workspace = true
license = "MIT"
keywords = ["soundfont", "sf2", "audio", "parser"]
categories = ["multimedia::audio", "parser-implementations"]
publish = false

[lints]
workspace = true

[features]
default = []
# `Serialize`/`Deserialize` on `Bank`, as the bare `wBank`.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }
thiserror.workspace = true
tutti-types = { path = "../tutti-types", default-features = false }
tutti-ump = { path = "../tutti-ump", default-features = false }

[dev-dependencies]
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
# The `Bank` contract test needs serde on.
tutti-sf2 = { path = ".", features = ["serde"] }
serde_json = "1"
