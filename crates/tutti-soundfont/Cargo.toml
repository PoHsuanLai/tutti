[package]
name = "tutti-soundfont"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Plays SoundFont 2 (.sf2) instruments from MIDI"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["soundfont", "sf2", "audio", "synthesizer", "midi"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
tutti-midi-runtime = { version = "0.0.1", path = "../tutti-midi-runtime", default-features = false }
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol" }
# `Node`, `ForkSource`: the player as a graph node, and its own way into a
# fork of the graph (an export), as `tutti-plugin`'s `PluginClient`
# has one.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }

# The voice's low-pass is `tutti-dsp`'s `SvfModel` biquad.
tutti-dsp = { version = "0.0.1", path = "../tutti-dsp" }
tutti-sf2 = { version = "0.0.1", path = "../tutti-sf2" }
tutti-voicing = { version = "0.0.1", path = "../tutti-voicing" }

thiserror = { workspace = true }
tutti-types = { version = "0.0.1", path = "../tutti-types", default-features = false }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }

[dev-dependencies]
# The font-to-synth swap of the chase test (`tests/chase.rs`).
tutti-polysynth = { path = "../tutti-polysynth" }
# Finds the repo's `assets/` for the tests, and `assert_golden`: the
# libm-recorded digest gate.
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
# `check_range_contract`'s serde shape, for `Polyphony`.
serde = "1"
assert_no_alloc = { version = "1", default-features = false }
# `contract::{drive_input, Direct}`: the unit driven by hand, as a graph drives
# it, in its tests and allocation gate.
tutti-graph = { path = "../tutti-graph", features = ["contract"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
