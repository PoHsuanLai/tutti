[package]
name = "tutti-soundfont"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "SoundFont (.sf2) playback as a Tutti graph node, via RustySynth"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-soundfont"
readme = "README.md"
keywords = ["soundfont", "sf2", "audio", "synthesizer", "midi"]
categories = ["multimedia::audio"]
# No features. RustySynth and the MIDI event input are both essential: gating
# either would leave a `SoundFontUnit` that cannot be built or cannot receive
# notes. This is a separate crate from `tutti-polysynth` because a `.sf2`
# player shares none of that crate's voice allocation, tuning, portamento or
# unison.

[lints]
workspace = true

[dependencies]
tutti-midi-types = { path = "../tutti-midi-types", default-features = false }
tutti-midi-runtime = { path = "../tutti-midi-runtime", default-features = false }
tutti-midi-protocol = { path = "../tutti-midi-protocol" }
# `Node`, `ForkSource`: the player as a graph node, and its own way into a
# fork of the graph (an export), as `tutti-plugin`'s `PluginClient`
# has one. No cycle: `tutti-graph` names no tutti crate but `tutti-types`, `tutti-rt` and `tutti-ump`.
tutti-graph = { path = "../tutti-graph" }

tutti-sf2 = { path = "../tutti-sf2" }
tutti-rustysynth = { version = "1.3.6", path = "../tutti-rustysynth" }

thiserror = "2"
tutti-types = { path = "../tutti-types", default-features = false }
tutti-ump = { path = "../tutti-ump", default-features = false }

[dev-dependencies]
# Finds the repo's `assets/` for the tests.
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
# `testing::assert_golden`: the libm-recorded digest gate.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }
assert_no_alloc = { version = "1", default-features = false }
# `contract::{drive_input, Direct}`: the unit driven by hand, as a graph drives
# it, in its tests and allocation gate.
tutti-graph = { path = "../tutti-graph", features = ["contract"] }
# Upstream rustysynth beside `tutti-rustysynth`, for `tests/oracle_rustysynth.rs`.
# The production dep is `tutti-rustysynth`, so upstream joins under its own
# name with no collision. Adds no transitive crates.
rustysynth_upstream = { package = "rustysynth", version = "1.3.6" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
