[package]
name = "tutti-spatial"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Spatial audio for the Tutti engine — VBAP speaker panning, binaural HRTF rendering, surround mix assembly"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-spatial"
readme = "README.md"
keywords = ["audio", "spatial", "vbap", "hrtf", "dsp"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# HRTF (head-related transfer function) binaural rendering via FFT
# convolution against a measured HRIR sphere (`HrtfBinauralNode`), on
# `tutti_dsp::RealFft`. The HRIR dataset is supplied by the caller as bytes
# (see `HrtfBinauralNode::new`).
hrtf = []

[dependencies]
# `ChannelLayout` and `NodeKey`, named directly by `build_vbap_mix`'s signature.
tutti-types = { path = "../tutti-types", default-features = false }

# The VBAP solve (`tutti_dsp::SpeakerLayout`) and the HRTF panner's FFT
# (`tutti_dsp::RealFft`). tutti-dsp names no tutti crate but `tutti-types`, so
# the edge adds no cycle.
tutti-dsp = { path = "../tutti-dsp", default-features = false }

# `build_vbap_mix` assembles its graph out of general-purpose units:
# `ChannelSumNode` folds the panners, `SvfFilterNode` low-passes the LFE send.
# This is a plain consumer edge — geometry depends on signal processing, not the
# reverse, and neither unit has anything spatial in it.
tutti-nodes = { path = "../tutti-nodes", default-features = false }

# `build_vbap_mix` builds into a `tutti_graph::GraphBuilder`, and the LFE
# low-pass is a graph node.
tutti-graph = { path = "../tutti-graph" }

# Error handling
thiserror = { version = "2", default-features = false }

[dev-dependencies]
# `tutti_nodes::testing` stimulus nodes for tests, examples and doctests. The
# feature is dev-only, so the production dependency above stays without it.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }
approx = "0.5"
# The RT no-alloc gate. Must be a dev-dep of the crate that OWNS the nodes:
# `assert_no_alloc` installs a global allocator, which only a test binary may do.
assert_no_alloc = { version = "1", default-features = false }
criterion.workspace = true

# A dev-dependency on self is how a feature reaches `tests/` unconditionally.
# `required-features` would skip the HRTF tests when the feature is off, so a
# plain `cargo nextest run -p tutti-spatial` would report green without having
# exercised the panner. Same pattern as `tutti-sampler`.
tutti-spatial = { path = ".", features = ["hrtf"] }
# The graph's sample-accuracy contract harness: `tests/contract.rs` runs
# the binaural renderer through it.
tutti-graph = { path = "../tutti-graph", features = ["contract"] }

[[bench]]
name = "vbap_panner"
harness = false

[[bench]]
name = "hrtf_binaural"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
