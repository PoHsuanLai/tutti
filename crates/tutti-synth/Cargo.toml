[package]
name = "tutti-synth"
version = "0.0.1"
edition = "2021"
description = "Synth building blocks for Tutti (voice allocation, modulation, unison, portamento, tuning, SoundFont)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"

[features]
default = ["midi"]
std = []
midi = ["tutti-core/midi", "dep:tutti-midi-types", "dep:tutti-midi-runtime"]
soundfont = ["std", "dep:rustysynth", "midi"]
full = ["soundfont"]

# Propagates bevy_asset derives into rustysynth (gates on soundfont).
bevy_asset = ["soundfont", "rustysynth?/bevy_asset"]

[dependencies]
tutti-core = { path = "../tutti-core", default-features = false }
tutti-midi-types = { path = "../tutti-midi-types", optional = true, default-features = false }
tutti-midi-runtime = { path = "../tutti-midi-runtime", optional = true, default-features = false }

# Lock-free collections (for SoundFont manager)
dashmap = "6.1"

# RT-safe small vectors
smallvec = "1.13"

# Error handling
thiserror = "2"

# Optional - SoundFont
rustysynth = { package = "rustysynth-tutti", version = "1.3.6", path = "../rustysynth-tutti/rustysynth", optional = true }

[dev-dependencies]
approx = "0.5"
assert_no_alloc = "1"
tutti-midi-types = { path = "../tutti-midi-types", default-features = false }
tutti-midi-runtime = { path = "../tutti-midi-runtime", default-features = false }
