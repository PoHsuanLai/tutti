[package]
name = "tutti-tempo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A tempo map: converts between beats, seconds and audio frames through tempo changes and ramps"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "tempo", "daw"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# `Serialize`/`Deserialize` on `CellGrid`, read back through its refusing `TryFrom`.
serde = ["dep:serde"]

[dependencies]
tutti-types = { version = "0.0.1", path = "../tutti-types" }
# Pure-Rust `log1p`/`expm1`/`exp`, so a ramp's figures do not depend on the
# platform's C math library.
libm = "0.2.15"
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
serde_json = "1"
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
criterion.workspace = true

[[bench]]
name = "lookup"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
