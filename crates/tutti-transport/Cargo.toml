[package]
name = "tutti-transport"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Playback control for music software: musical time, tempo, looping, and play, stop and seek at an exact frame"
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false
keywords = ["audio", "transport", "real-time", "daw"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
tutti-types = { version = "0.0.1", path = "../tutti-types" }
# `RenderClock` hands a block's transport to the graph's executor.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }
tutti-rt = { path = "../tutti-rt" }
# The project's tempo is a `TempoMap`, published through `TransportSettings`.
tutti-tempo = { version = "0.0.1", path = "../tutti-tempo" }

crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }
atomic_float = { version = "1.1", default-features = false, features = ["atomic_f64"] }
# The `Error` derive of the crate's error types.
thiserror = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
