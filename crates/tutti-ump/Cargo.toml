[package]
name = "tutti-ump"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Universal MIDI Packet storage and addressing for the Tutti audio engine: Ump, MidiGroup, MidiChannel, CCNumber"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-ump"
readme = "README.md"
publish = false
keywords = ["midi", "ump", "audio", "real-time"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# `Serialize`/`Deserialize` on the address newtypes.
serde = ["dep:serde"]

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
thiserror = { workspace = true }
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1"
assert_no_alloc = { version = "1", default-features = false }
criterion.workspace = true
proptest = "1.9.0"

[[bench]]
name = "codec"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
