[package]
name = "tutti-ump"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MIDI 2.0's Universal MIDI Packet as Rust values, carrying both MIDI 1.0 and MIDI 2.0 messages"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["midi", "ump", "audio", "real-time"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# `Serialize`/`Deserialize` on the address newtypes.
serde = ["dep:serde"]

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
thiserror = { version = "2", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
serde_json = "1"
assert_no_alloc = { version = "1", default-features = false }
criterion.workspace = true
proptest = "1.9.0"

[[bench]]
name = "codec"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
