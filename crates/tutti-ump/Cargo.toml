[package]
name = "tutti-ump"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Universal MIDI Packet storage and addressing for the Tutti audio engine: Ump, MidiGroup, MidiChannel, CCNumber"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-ump"
readme = "README.md"
keywords = ["midi", "ump", "audio", "real-time"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# `Serialize`/`Deserialize` on the address newtypes, so a document can persist
# a channel, a group or a controller number. `Ump` is wire storage and never
# gets them.
serde = ["dep:serde"]

[dependencies]
# `Ump` is `Pod`: a block of packets is one copy across a process boundary.
bytemuck = { version = "1.16", features = ["derive"] }
serde = { version = "1", optional = true, features = ["derive"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
