[package]
name = "tutti-ump-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tutti-ump = { path = ".." }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

# Not a member of the repo's workspace: `cargo fuzz` builds it with the sanitizer
# flags on a nightly toolchain, which the workspace's pinned stable does not
# take. Run it as `rustup run nightly cargo fuzz run decode` from
# `crates/tutti-ump`.
[workspace]
