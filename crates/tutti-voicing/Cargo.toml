[package]
name = "tutti-voicing"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Decides what a note-driven instrument does with each MIDI message: start, release, steal or bend a voice"
readme = "README.md"
license.workspace = true
repository.workspace = true
publish = false
keywords = ["midi", "audio", "synthesizer", "polyphony", "mpe"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
tutti-ump = { path = "../tutti-ump", default-features = false }
tutti-midi-protocol = { path = "../tutti-midi-protocol" }
tutti-types = { path = "../tutti-types", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
