[package]
name = "tutti-voicing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Decides what a note-driven instrument does with each MIDI message: start, release, steal or bend a voice"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["midi", "audio", "synthesizer", "polyphony", "mpe"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol" }
tutti-types = { version = "0.0.1", path = "../tutti-types", default-features = false }
# The portamento rate (`glide_rate`) is `libm`'s pure-Rust `expf`/`logf`, so the
# render does not depend on the platform's libm.
libm = "0.2.15"
thiserror = { workspace = true }

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
