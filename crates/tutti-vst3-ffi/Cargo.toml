[package]
name = "tutti-vst3-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The unsafe half of the VST3 host: safe handles over the vst3 crate's COM bindings"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tutti-vst3-ffi"
readme = "README.md"
keywords = ["vst3", "audio", "plugin", "ffi"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
# Exposes the run loop's activity counters (`RunLoopActivity`), which the
# host-conformance tests read. Off in a production build; the host's
# `conformance` feature turns it on.
conformance = []

[dependencies]
libloading = "0.9"
parking_lot = "0.12"
crossbeam-queue = "0.3"
arrayvec = "0.7"
tutti-plugin-types = { path = "../tutti-plugin-types" }
tutti-types = { path = "../tutti-types" }
tutti-rt = { path = "../tutti-rt" }
vst3 = "0.3"

# `IRunLoop` (Linux-only, and mandatory there per the VST3 docs) polls the
# plugin-registered file descriptors.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The VST3 macOS module entry point is `bundleEntry(CFBundleRef)`, so building a
# CFBundleRef for the `.vst3` bundle needs CoreFoundation. macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
# `module_entry`'s macOS bundle-directory test builds a bundle on disk.
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
