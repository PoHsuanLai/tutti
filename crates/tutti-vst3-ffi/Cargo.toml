[package]
name = "tutti-vst3-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe bindings for hosting VST3 plugins, built on the vst3 crate, for tutti"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["vst3", "audio", "plugin", "ffi"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
# Exposes the run loop's activity counters (`RunLoopActivity`), which the
# host-conformance tests read. Off in a production build; the host's
# `conformance` feature turns it on.
conformance = []

[dependencies]
libloading.workspace = true
parking_lot = "0.13"
crossbeam-queue = "0.3"
arrayvec = "0.7"
bitflags = "2"
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types" }
tutti-types = { version = "0.0.1", path = "../tutti-types" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
vst3 = "0.3"
# `IRunLoop` (Linux): the look at the descriptors a plugin registered.
tutti-plugin-ipc-ffi = { version = "0.0.1", path = "../tutti-plugin-ipc-ffi" }

# The VST3 macOS module entry point is `bundleEntry(CFBundleRef)`, so building a
# CFBundleRef for the `.vst3` bundle needs CoreFoundation. macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
# `module_entry`'s macOS bundle-directory test builds a bundle on disk.
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
