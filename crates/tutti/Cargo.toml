# The Bevy-free umbrella. It holds no code: src/lib.rs is only re-exports.
[package]
name = "tutti"
version = "0.0.1"
edition = "2021"
description = "The tutti audio engine behind one dependency. Bevy-free."
license = "MIT OR Apache-2.0"

[dependencies]
# Always present: the vocabulary, the runtime, the node contract, the DSP.
# Everything else is a feature, because a headless consumer that only bounces
# a file should not link ALSA, and one that only reads a .mid should not link
# CoreMIDI.
tutti-core = { path = "../core/tutti-core", default-features = false }
tutti-types = { path = "../core/tutti-types", default-features = false }
tutti-nodes = { path = "../dsp/tutti-nodes", default-features = false }
# The audio graph: what an export renders, and what `Engine` runs.
# tutti-core already depends on it, so naming it here links nothing new.
tutti-graph = { path = "../core/tutti-graph" }

tutti-cpal = { path = "../core/tutti-cpal", default-features = false, optional = true }
tutti-io = { path = "../core/tutti-io", optional = true }
tutti-export = { path = "../core/tutti-export", optional = true }
tutti-mod = { path = "../core/tutti-mod", default-features = false, optional = true }
tutti-sampler = { path = "../dsp/tutti-sampler", default-features = false, optional = true }
tutti-polysynth = { path = "../dsp/tutti-polysynth", optional = true }
tutti-soundfont = { path = "../dsp/tutti-soundfont", optional = true }
tutti-spatial = { path = "../dsp/tutti-spatial", default-features = false, optional = true }
tutti-analysis = { path = "../dsp/tutti-analysis", default-features = false, optional = true }
tutti-midi-types = { path = "../midi/tutti-midi-types", default-features = false, optional = true }
tutti-midi-runtime = { path = "../midi/tutti-midi-runtime", default-features = false, optional = true }
tutti-midi-file = { path = "../midi/tutti-midi-file", optional = true }
tutti-midi-hardware = { path = "../midi/tutti-midi-hardware", optional = true }
tutti-plugin = { path = "../plugin/tutti-plugin", optional = true }
# The API layer (design 015): a graph, its engine and its device behind one
# `Session`. `default-features = false` (its default is empty anyway): each
# feature below turns on the session's feature of the same name with `?`, so
# a build without `session` gets no session edge from a feature.
tutti-session = { path = "../tutti-session", default-features = false, optional = true }

[dev-dependencies]
# `tutti::nodes::testing` for this crate's own test, examples and README
# doctest. Dev-only: a consumer of the umbrella never sees the module.
tutti-nodes = { path = "../dsp/tutti-nodes", default-features = false, features = ["testing"] }
tempfile = "3.8"
# The reference CLAP plugin the §5.2 example plays, in a `plugin-server`
# (built first: `cargo build -p tutti-plugin-server`; not a dev-dependency,
# which would be a cycle through `tutti-plugin`), and the lookup that finds
# both beside the running binary (`tutti-session/tests/support`).
tutti-clap-test-plugin = { path = "../vendor/tutti-clap-test-plugin" }
tutti-fixture-resolve = { path = "../plugin/vendor/tutti-fixture-resolve" }

[features]
# `default = ["session"]`: the API layer is what this umbrella is for. It is
# the one member whose default is not empty, and it costs nothing a feature
# did not already ask for: `tutti-session` itself has `default = []`, so the
# default build adds the session's own code and nothing else (no device, so no
# ALSA). Set `default-features = false` for the raw crates alone.
default = ["session"]
session = ["dep:tutti-session"]

# Everything a headless host can have. Plugin FORMATS stay opt-in — each
# links an SDK — exactly as in bevy-tutti's own `full`.
full = [
    "device",
    "wav",
    "flac",
    "mp3",
    "ogg",
    "midi",
    "midi-hardware",
    "synth",
    "soundfont",
    "sampler",
    "audio-io",
    "export",
    "spatial",
    "analysis",
    "modulation",
    "convolution",
]

# The sound card. NOT default, unlike in `bevy-tutti` where it is mandatory:
# an offline render, a CI job and a server build all want this crate without
# ALSA or CoreAudio headers on the box.
device = ["dep:tutti-cpal", "tutti-session?/device"]

# JACK, through `tutti-cpal`. Linux/BSD only in effect, and it hard-links
# libjack at build time — see that crate's own `jack` feature.
jack = ["device", "tutti-cpal/jack"]

# --- codecs -----------------------------------------------------------------
#
# The decoder is `tutti-io`'s, so a codec turns on `io` (below): `Wave::load`
# and `FileIn` are reached as `tutti::io::…`. bevy-tutti forwards with
# `tutti-io?/` instead, because there `tutti-io` arrives only with an edge
# that uses it.
wav = ["io", "tutti-io/wav", "tutti-sampler?/wav"]
flac = ["io", "tutti-io/flac", "tutti-sampler?/flac"]
mp3 = ["io", "tutti-io/mp3", "tutti-sampler?/mp3"]
ogg = ["io", "tutti-io/ogg", "tutti-sampler?/ogg"]

# `tutti::io` — `tutti-io`, the I/O edge. Implied by `audio-io` and by every
# codec, so it is rarely named directly; it exists so `src/lib.rs` gates the
# module on one feature rather than a list that must track the codecs.
io = ["dep:tutti-io"]

# --- MIDI, two axes (identical to bevy-tutti) -------------------------------
midi = [
    "dep:tutti-midi-types",
    "dep:tutti-midi-file",
    "dep:tutti-midi-runtime",
    "tutti-core/midi",
    "tutti-session?/midi",
]
midi-hardware = ["midi", "dep:tutti-midi-hardware", "tutti-session?/midi-hardware"]

# --- subsystems -------------------------------------------------------------
#
# Every one of these is bevy-tutti's feature MINUS its `/bevy` forwards. That
# is the only systematic difference between the two tables, and it is the
# whole point of this crate: `bevy-tutti`'s `modulation` pulls
# `tutti-mod/bevy` + `tutti-types/bevy`, and its `sampler` pulls
# `tutti-sampler/bevy`. None of that belongs here. (Each also turns on the
# session's feature of the same name, with `?` here because `session` is
# optional; in bevy-tutti the session is always there.)
synth = ["dep:tutti-polysynth", "tutti-session?/synth"]
soundfont = ["midi", "dep:tutti-soundfont", "tutti-session?/soundfont"]
sampler = ["wav", "dep:tutti-sampler", "tutti-session?/sampler"]
audio-io = ["io", "tutti-cpal?/capture", "tutti-session?/audio-io"]
export = ["dep:tutti-export", "tutti-session?/export"]
spatial = ["dep:tutti-spatial", "tutti-session?/spatial"]
modulation = ["dep:tutti-mod", "tutti-session?/modulation"]
convolution = ["tutti-nodes/convolution", "tutti-session?/convolution"]

# Axes bevy-tutti does not have: bevy-tutti does not depend on
# `tutti-analysis` at all.
analysis = ["dep:tutti-analysis"]

# --- plugin hosting ---------------------------------------------------------
#
# No `tutti-plugin-server`: that is a BINARY the host spawns, and depending on
# it here would put a `tutti-plugin -> tutti-plugin-server -> tutti-plugin`
# cycle one edit away — the cycle `tutti-plugin`'s build script and the CI
# workflow both warn about. Build it with
# `cargo build -p tutti-plugin-server`.
plugin = ["dep:tutti-plugin", "midi", "tutti-session?/plugin"]
vst2 = ["plugin", "tutti-plugin/vst2", "tutti-session?/vst2"]
vst3 = ["plugin", "tutti-plugin/vst3", "tutti-session?/vst3"]
clap = ["plugin", "tutti-plugin/clap", "tutti-session?/clap"]
au = ["plugin", "tutti-plugin/au", "tutti-session?/au"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "headless_export"
required-features = ["export", "analysis", "wav"]

# Cannot RUN in CI — it opens a sound card — but `cargo clippy --all-targets`
# compiles it, which is the gate that matters for an example whose job is to
# be read.
[[example]]
name = "headless_engine"
required-features = ["session", "device"]

# Design 015 §5.1: doc 014 §8.1's modulation, headless, in one import.
[[example]]
name = "headless_modulation"
required-features = ["session", "modulation"]

# Design 015 §5.2: load a plugin, play a MIDI file, export to WAV, in one
# import. Run as a test (`test = true`) so CI plays it; it needs
# `plugin-server` built first, and fails without it.
[[example]]
name = "plugin_midi_export"
required-features = ["session", "clap", "export"]
test = true
