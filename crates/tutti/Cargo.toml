# The umbrella. It holds no code: src/lib.rs is only re-exports.
[package]
name = "tutti"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A type-driven, real-time audio engine for building DAWs in Rust"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "dsp", "real-time", "daw", "midi"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# Always present: the vocabulary, the runtime, the node contract, the DSP.
# Everything else is a feature.
tutti-transport = { version = "0.0.1", path = "../tutti-transport" }
tutti-tempo = { version = "0.0.1", path = "../tutti-tempo" }
tutti-metering = { version = "0.0.1", path = "../tutti-metering" }
tutti-engine = { version = "0.0.1", path = "../tutti-engine" }
tutti-types = { version = "0.0.1", path = "../tutti-types", default-features = false }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-nodes = { version = "0.0.1", path = "../tutti-nodes", default-features = false }
# The audio graph: what an export renders, and what `Engine` runs.
# `tutti-engine` already depends on it, so naming it here links nothing new.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }

tutti-cpal = { version = "0.0.1", path = "../tutti-cpal", default-features = false, optional = true }
tutti-codec = { version = "0.0.1", path = "../tutti-codec", optional = true }
tutti-export = { version = "0.0.1", path = "../tutti-export", default-features = false, optional = true }
tutti-modulation = { version = "0.0.1", path = "../tutti-modulation", default-features = false, optional = true }
tutti-sampler = { version = "0.0.1", path = "../tutti-sampler", default-features = false, optional = true }
tutti-polysynth = { version = "0.0.1", path = "../tutti-polysynth", optional = true }
tutti-soundfont = { version = "0.0.1", path = "../tutti-soundfont", optional = true }
tutti-sf2 = { version = "0.0.1", path = "../tutti-sf2", optional = true }
tutti-dsp = { version = "0.0.1", path = "../tutti-dsp", default-features = false, optional = true }
tutti-measure = { version = "0.0.1", path = "../tutti-measure", optional = true }
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol", optional = true }
tutti-midi-runtime = { version = "0.0.1", path = "../tutti-midi-runtime", default-features = false, optional = true }
tutti-midi-file = { version = "0.0.1", path = "../tutti-midi-file", optional = true }
tutti-midi-hardware = { version = "0.0.1", path = "../tutti-midi-hardware", optional = true }
tutti-plugin = { version = "0.0.1", path = "../tutti-plugin", optional = true }
tutti-plugin-host = { version = "0.0.1", path = "../tutti-plugin-host", optional = true }
# The API layer: a graph, its engine and its device behind one
# `Session`. `default-features = false` (its default is empty anyway): each
# feature below turns on the session's feature of the same name with `?`, so
# a build without `session` gets no session edge from a feature.
tutti-session = { version = "0.0.1", path = "../tutti-session", default-features = false, optional = true }

[dev-dependencies]
# `tutti::nodes::testing` for this crate's own test, examples and README
# doctest. Dev-only: a consumer of the umbrella never sees the module.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }
tempfile = "3.8"
# The reference CLAP plugin the `plugin_midi_export` example plays, in a `plugin-server`
# (built first: `cargo build -p tutti-plugin-server`; not a dev-dependency,
# which would be a cycle through `tutti-plugin`), and the lookup that finds
# both beside the running binary (`tutti-session/tests/support`). Its `Notes`
# mode renders the key it holds, so the example's test reads the frames the
# file's notes land on.
tutti-shared-plugin = { path = "../../testing/tutti-shared-plugin" }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[features]
# `default = ["session"]`: the API layer is what this umbrella is for. Set
# `default-features = false` for the raw crates alone.
default = ["session"]
session = ["dep:tutti-session"]

# Everything a headless host can have. Plugin FORMATS stay opt-in — each
# links an SDK.
full = [
    "device",
    "decode-wav",
    "decode-flac",
    "decode-mp3",
    "decode-ogg",
    "midi",
    "midi-hardware",
    "synth",
    "soundfont",
    "sampler",
    "audio-io",
    "export",
    "encode-flac",
    "encode-aiff",
    "encode-vorbis",
    "dsp",
    "modulation",
]

# The sound card. NOT default.
device = ["dep:tutti-cpal", "tutti-session?/device"]

# JACK, through `tutti-cpal`. Linux/BSD only in effect, and it hard-links
# libjack at build time — see that crate's own `jack` feature.
jack = ["device", "tutti-cpal/jack"]

# --- codecs -----------------------------------------------------------------
#
# The decoder is `tutti-codec`'s, so a format turns on `codec` (below):
# `Wave::read` and `FileIn` are reached as `tutti::codec::…`.
decode-wav = ["codec", "tutti-codec/decode-wav", "tutti-sampler?/decode-wav"]
decode-flac = ["codec", "tutti-codec/decode-flac", "tutti-sampler?/decode-flac"]
decode-mp3 = ["codec", "tutti-codec/decode-mp3", "tutti-sampler?/decode-mp3"]
decode-ogg = ["codec", "tutti-codec/decode-ogg", "tutti-sampler?/decode-ogg"]
# The encoders `tutti-codec` writes (the codec's own names). None implies
# `export`: a recording writes through them too.
encode-wav = ["codec", "tutti-codec/encode-wav"]
encode-flac = ["codec", "tutti-codec/encode-flac"]
encode-aiff = ["codec", "tutti-codec/encode-aiff"]
encode-vorbis = ["codec", "tutti-codec/encode-vorbis"]

# `tutti::codec` — `tutti-codec`: `Wave`, the decoder and the encoders `export`
# writes through. Implied by every format, so it is rarely named directly.
codec = ["dep:tutti-codec"]

# `tutti::io` — `Recorder` and its pump loop (`tutti-session`'s `record`). Implies
# `session` and `codec` with the WAV writer: the sink is `tutti::codec::FileOut`,
# which writes a `tutti::codec::Format`, and a `Format` has a value only with an
# `encode-*` feature. Implied by `audio-io`, so it is rarely named directly.
io = ["session", "tutti-session/record", "encode-wav"]

# --- MIDI, two axes --------------------------------------------------------
midi = [
    "dep:tutti-midi-protocol",
    "dep:tutti-midi-file",
    "dep:tutti-midi-runtime",
    "tutti-session?/midi",
]
midi-hardware = ["midi", "dep:tutti-midi-hardware", "tutti-session?/midi-hardware"]

# --- subsystems -------------------------------------------------------------
#
# Each also turns on the session's feature of the same name, with `?` because
# `session` is optional.
synth = ["dep:tutti-polysynth", "tutti-session?/synth"]
soundfont = ["midi", "dep:tutti-soundfont", "dep:tutti-sf2", "tutti-session?/soundfont"]
sampler = ["decode-wav", "dep:tutti-sampler", "tutti-session?/sampler"]
audio-io = ["io", "tutti-cpal?/capture", "tutti-session?/audio-io"]
# Export. `export` is the offline renderer and WAV, which is pure Rust; FLAC and
# AIFF are pure Rust and opt-in (`encode-flac`, `encode-aiff`), and `encode-vorbis` is the one path to C (the
# Vorbis library, `ogg_next_sys`).
export = ["dep:tutti-export", "encode-wav", "tutti-session?/export"]
modulation = ["dep:tutti-modulation", "tutti-session?/modulation"]

# `tutti::dsp` and `tutti::measure` are both.
dsp = ["dep:tutti-dsp", "dep:tutti-measure"]

# --- plugin hosting ---------------------------------------------------------
#
# No `tutti-plugin-server`: that is a BINARY the host spawns. Build it with
# `cargo build -p tutti-plugin-server`.
plugin = ["dep:tutti-plugin", "dep:tutti-plugin-host", "midi", "tutti-session?/plugin"]
vst2 = ["plugin", "tutti-plugin/vst2", "tutti-session?/vst2"]
vst3 = ["plugin", "tutti-plugin/vst3", "tutti-session?/vst3"]
clap = ["plugin", "tutti-plugin/clap", "tutti-session?/clap"]
au = ["plugin", "tutti-plugin/au", "tutti-session?/au"]

[package.metadata.docs.rs]
# Not `jack` (see tutti-cpal): `full` and the plugin formats, which `full` leaves out.
features = ["full", "vst2", "vst3", "clap", "au"]
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "headless_export"
required-features = ["session", "export", "dsp", "decode-wav"]

# Cannot RUN in CI: it opens a sound card.
[[example]]
name = "headless_engine"
required-features = ["session", "device"]

# The whole common path through one import: a sampler, a filter, a reverb, an
# LFO on the cutoff, the transport and a bounce to a WAV.
[[example]]
name = "song_bounce"
required-features = ["session", "export", "sampler", "dsp", "modulation"]
test = true

# Modulation, headless, in one import.
[[example]]
name = "headless_modulation"
required-features = ["session", "modulation"]

# Load a plugin, play a MIDI file, export to WAV, in one
# import. Run as a test (`test = true`) so CI plays it; it needs
# `plugin-server` built first, and fails without it.
[[example]]
name = "plugin_midi_export"
required-features = ["session", "clap", "export"]
test = true

# A plugin host: scan a plugin directory, pick a
# plugin by name, load it into a session, wire, play, set a parameter, save
# its state and bounce. It needs a plugin directory, `plugin-server` and
# `plugin-probe` built, so CI compiles it and does not run it.
[[example]]
name = "plugin_host"
required-features = ["session", "clap", "export"]

# Every piece of the session's
# MIDI together, offline and with no device. Run as a test (`test = true`).
[[example]]
name = "midi_all"
required-features = ["session", "midi-hardware", "synth"]
test = true
