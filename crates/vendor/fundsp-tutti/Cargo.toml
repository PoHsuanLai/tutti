[package]
name = "fundsp-tutti"
description = "Audio processing and synthesis library (Tutti fork with custom modifications)."
# No `no_std` keyword or `no-std` category: this fork links `std`
# unconditionally. See the note at the top of `src/lib.rs`.
keywords = ["dsp", "audio", "synthesizer", "sound"]
categories = ["multimedia::audio"]
license = "MIT OR Apache-2.0"
version = "0.23.0"
authors = ["SamiPerttu <Sami.Perttu@gmail.com>"]
homepage = "https://github.com/PoHsuanLai/fundsp"
repository = "https://github.com/PoHsuanLai/fundsp"
readme = "README.md"
edition = "2024"

[dependencies]
numeric-array = { version = "0.6.1", default-features = false }
dyn-clone = "1.0.20"
libm = "0.2.15"
wide = { version = "1.6", default-features = false }
num-complex = { version = "0.4.6", default-features = false, features = ["libm"] }
tinyvec = { version = "1.10.0", features = ["alloc"] }
hashbrown = "0.16.1"
microfft = { version = "0.6.0", features = ["size-32768"] }
funutd = { version = "0.16.0", default-features = false }
once_cell = { version = "1.21.3", default-features = false, features = ["race", "alloc"] }
# Audio file decoding - symphonia with no default features, codecs enabled individually
symphonia = { version = "0.5.5", optional = true, default-features = false }
# The AudioIn/AudioOut vocabulary the FileIn speaks, and the latency-graph
# traits `Net` implements (see `net::latency`). Std-only.
tutti-types = { version = "0.0.1", path = "../../core/tutti-types" }
# The node contract: `AudioUnit`, the planar block buffers, the numeric tower
# and the `Signal` routing vocabulary. It sits BELOW this crate so that a
# consumer can implement a node without depending on the fork; this crate
# re-exports every name at the spelling it had when it defined them, so the
# preludes and every module here are unchanged by the move.
tutti-node = { version = "0.0.1", path = "../../core/tutti-node" }
resampler = { version = "0.4.0", features = ["no_std"] }
fft-convolver = { version = "0.3.0", optional = true }
lfqueue = { version = "0.8.1", default-features = false }

bevy_asset = { version = "0.19", default-features = false, optional = true }
bevy_reflect = { version = "0.19", default-features = false, optional = true }

[dev-dependencies]
anyhow = "1.0.89"
criterion = "0.8.1"
cpal = { version = "0.17.0", features = ["audio_thread_priority"] }
assert_no_alloc = { version = "1.1.2", default-features = false }
eframe = "0.33.3"
plotters = "0.3.7"
midi-msg = "0.5.0"
midir = "0.9.1"
read_input = "0.8.6"
rayon = "1.10.0"

[features]
default = ["files-all", "fft"]
# No `std` feature: this fork links `std` unconditionally (see `src/lib.rs`).

# Individual codec features
# Note: wav needs pcm codec for actual audio decoding (wav is just the container format)
wav = ["dep:symphonia", "symphonia/wav", "symphonia/pcm"]
flac = ["dep:symphonia", "symphonia/flac"]
mp3 = ["dep:symphonia", "symphonia/mp3"]
ogg = ["dep:symphonia", "symphonia/ogg", "symphonia/vorbis"]

# Convenience: all file formats
files-all = ["wav", "flac", "mp3", "ogg"]
# Backwards compat alias
files = ["files-all"]

fft = ["dep:fft-convolver"]

# Enables `WaveAsset` (inherent `from_bytes` + `#[derive(Asset, TypePath)]`).
# Pulls in bevy_asset and bevy_reflect as optional deps.
bevy_asset = ["dep:bevy_asset", "dep:bevy_reflect"]

[[bench]]
name = "benchmark"
harness = false

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]
