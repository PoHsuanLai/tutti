# cargo-deny policy. CI and `cargo xtask deny` run `cargo deny check advisories`.
#
# Only `advisories` is checked. `bans` and `licenses` are left off: the
# workspace carries vendored VST3 SDK headers, forks and duplicate versions,
# which would need a long allow-list to pass.

[graph]
all-features = true

[advisories]
# A vulnerability always fails. An advisory for an unmaintained or unsound
# crate fails too, unless it is ignored below with a reason.
unmaintained = "all"
yanked = "deny"
# The advisory DB is fetched; a fetch failure is an error, never a pass.
ignore = []
