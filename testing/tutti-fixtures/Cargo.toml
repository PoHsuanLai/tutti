[package]
name = "tutti-fixtures"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Where the test suites find repo assets, the reference plugin cdylibs and the plugin-server binary, and a SoundFont built in memory"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
publish = false

# A dev-dependency of the crates whose tests read a repo asset or load a
# reference plugin or the plugin-server, or that check a range-checked type. It
# depends on no workspace crate and is never linked into a shipped binary.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
