[package]
name = "tutti-fixtures"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Where the test suites find repo assets, the reference plugin cdylibs and the plugin-server binary, and a SoundFont built in memory"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
publish = false

# A dev-dependency of the crates whose tests read a repo asset or load a
# reference plugin or the plugin-server, check a range-checked type, or build
# MIDI messages (`midi`). Its workspace dependencies are `tutti-ump`, the
# bottom layer, and `tutti-midi-protocol`, which depends on `tutti-ump` alone
# (the widened test values); neither dev-depends on anything here, so no crate
# meets two copies of a type through it. It is never linked into a shipped binary.
[dependencies]
tutti-ump = { path = "../../crates/tutti-ump", default-features = false }
tutti-midi-protocol = { path = "../../crates/tutti-midi-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
