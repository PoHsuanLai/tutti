[package]
name = "tutti-fixtures"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Where the test suites find repo assets, the reference plugin cdylibs and the plugin-server binary, and a SoundFont built in memory"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/Tutti"
publish = false

# A dev-dependency of the crates whose tests read a repo asset or load a
# reference plugin or the plugin-server, check a range-checked type, or build
# MIDI messages (`midi`). Its workspace dependencies without a feature are
# `tutti-ump`, the bottom layer, and `tutti-midi-protocol`, which depends on
# `tutti-ump` alone (the widened test values); neither dev-depends on anything
# here, so no crate meets two copies of a type through it. It is never linked
# into a shipped binary.
[dependencies]
tutti-ump = { path = "../../crates/tutti-ump", default-features = false }
tutti-midi-protocol = { path = "../../crates/tutti-midi-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `plugin`: what a plugin crate's tests share (`main_thread`). Only crates above
# `tutti-plugin-types` turn it on. In a workspace build the feature unifies, so
# a crate at or below it may link a second copy of itself through this one; no
# test there passes its own types into the `plugin` items, so the copies never
# meet.
tutti-plugin-types = { path = "../../crates/tutti-plugin-types", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# `clap-probe` and `vst2-probe`: the typed doors into the reference plugins'
# exported probe symbols (`ClapProbe`, `Vst2Probe`). The plugin crates are
# taken for their `#[repr(C)]` capture types (both are `rlib` as well as
# `cdylib`); the symbols are reached through `libloading` on the cdylib.
libloading = { version = "0.8", optional = true }
tutti-clap-test-plugin = { path = "../tutti-clap-test-plugin", optional = true }
tutti-vst2-test-plugin = { path = "../tutti-vst2-test-plugin", optional = true }

[features]
plugin = ["dep:tutti-plugin-types", "dep:raw-window-handle"]
clap-probe = ["dep:libloading", "dep:tutti-clap-test-plugin"]
vst2-probe = ["dep:libloading", "dep:tutti-vst2-test-plugin"]

[dev-dependencies]
# The lock test's private directory.
tempfile = "3"
