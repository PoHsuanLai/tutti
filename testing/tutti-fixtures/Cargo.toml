[package]
name = "tutti-fixtures"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Where the test suites find repo assets, the reference plugin cdylibs and the plugin-server binary, and a SoundFont built in memory"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tutti-audio/tutti"
publish = false

# A dev-dependency of the crates whose tests read a repo asset or load a
# reference plugin or the plugin-server, check a range-checked type, or build
# MIDI messages (`midi`). Its workspace dependencies without a feature are
# `tutti-ump`, the bottom layer, and `tutti-midi-protocol`, which depends on
# `tutti-ump` alone (the widened test values); neither dev-depends on anything
# here, so no crate meets two copies of a type through it. It is never linked
# into a shipped binary.
[dependencies]
tutti-ump = { path = "../../crates/tutti-ump", default-features = false }
# `MainThreadMarker`, the token `main_thread` makes: one type at the bottom of the
# workspace, which no test meets twice (`tutti-rt` names no workspace crate).
tutti-rt = { path = "../../crates/tutti-rt" }
tutti-midi-protocol = { path = "../../crates/tutti-midi-protocol" }
# The units a signal helper takes (`Hz`, `Amplitude`, `SampleRate`, `Samples`).
# `tutti-types` dev-depends on this crate, so its own tests meet a second copy
# of it here: they use none of `signal`, whose signatures name its units.
tutti-types = { path = "../../crates/tutti-types" }
# `signal`'s float WAV, the independent reader and writer the codecs are
# checked against.
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `plugin`: what a plugin crate's tests share (`main_thread`). Only crates above
# `tutti-plugin-types` turn it on. In a workspace build the feature unifies, so
# a crate at or below it may link a second copy of itself through this one; no
# test there passes its own types into the `plugin` items, so the copies never
# meet.
tutti-plugin-types = { path = "../../crates/tutti-plugin-types", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# `vst3-cpp`: the C++ twin of the shared plugin, built by cargo in the same
# invocation; its `links` key hands the bundle directory to `build.rs`.
tutti-shared-plugin-vst3-cpp = { path = "../tutti-shared-plugin-vst3-cpp", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# `au`: the shared plugin's Audio Unit, registered in this process.
tutti-shared-plugin = { path = "../tutti-shared-plugin", optional = true }
coreaudio-sys = { version = "0.2", optional = true }

[features]
# `au_bundle`, the bundle that declares the shared plugin's Audio Unit, and
# `element_name_retain_count` (macOS).
au = ["plugin", "dep:tutti-shared-plugin", "dep:coreaudio-sys"]
plugin = ["dep:tutti-plugin-types", "dep:raw-window-handle"]
# `vst3_cpp_module` and `bundle_of`: where the C++ twin is.
vst3-cpp = ["plugin", "dep:tutti-shared-plugin-vst3-cpp"]

[dev-dependencies]
# The lock test's private directory.
tempfile = "3"
