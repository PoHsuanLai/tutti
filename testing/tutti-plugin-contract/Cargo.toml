[package]
name = "tutti-plugin-contract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The host contract: the same cases against every plugin format through Loaded"
license = "MIT OR Apache-2.0"
publish = false

# A format's tests are `tests/<format>.rs`: one `contract!` line over a
# `Format`. The plugin they load is `tutti-shared-plugin`, a normal dependency
# so cargo builds its cdylib in the same invocation.
[dependencies]
tutti-plugin-types = { path = "../../crates/tutti-plugin-types" }
tutti-fixtures = { path = "../tutti-fixtures", features = ["plugin", "vst3-cpp", "au"] }
tutti-midi-protocol = { path = "../../crates/tutti-midi-protocol" }
tutti-ump = { path = "../../crates/tutti-ump", default-features = false }
tutti-graph = { path = "../../crates/tutti-graph" }
tutti-clap-host = { path = "../../crates/tutti-clap-host" }
tutti-vst2-host = { path = "../../crates/tutti-vst2-host" }
tutti-vst3-host = { path = "../../crates/tutti-vst3-host" }
assert_no_alloc = { version = "1", default-features = false }
tutti-shared-plugin = { path = "../tutti-shared-plugin" }

# Needs `cargo build -p tutti-plugin-server --no-default-features --features
# clap,vst3` and `cargo build -p tutti-plugin-probe` first: the server
# cannot be a dependency (it depends on `tutti-plugin`), and a dependency's
# binary is not built for a test.
tutti-plugin = { path = "../../crates/tutti-plugin", features = ["clap", "vst2", "vst3"], optional = true }
# `tests/probe.rs` applies a probe's `Delta` to a `PluginDb` to read the descriptor.
tutti-plugin-db = { path = "../../crates/tutti-plugin-db", optional = true }
# `tests/server.rs` drives a served plugin through `Ipc`, a `Loaded` of its own.
tutti-plugin-ipc = { path = "../../crates/tutti-plugin-ipc", optional = true }

[features]
# `tests/server.rs`: the same configuration and transcript through a real
# `plugin-server` process.
server = ["dep:tutti-plugin", "dep:tutti-plugin-db", "dep:tutti-plugin-ipc"]

[[test]]
name = "server"
required-features = ["server"]

# The same, for `tests/probe.rs`: a real `plugin-probe` process per plugin. Needs
# `cargo build -p tutti-plugin-probe` first.
[[test]]
name = "probe"
required-features = ["server"]

[dev-dependencies]
# `tests/probe.rs` copies the plugin under the file name its `init` reads.
tempfile = "3"
# `tests/probe.rs`: a CLAP factory of two plugins and a VST2 shell of two, whose ids
# and names the probe is held to. Dev-dependencies so cargo builds their cdylibs with
# the test, and never named in code: a plugin's rlib carries its entry point, and two
# of them in one test binary do not link.
tutti-clap-test-plugin = { path = "../tutti-clap-test-plugin" }
tutti-vst2-shell-plugin = { path = "../tutti-vst2-shell-plugin" }

# AU: the shared plugin's AU shell is registered in this process
# (`tests/au.rs`), so the host is a macOS dependency only.
[target.'cfg(target_os = "macos")'.dependencies]
tutti-au-host = { path = "../../crates/tutti-au-host" }
