[package]
name = "tutti-shared-plugin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "One test plugin: a format-free core and a shell per plugin format (CLAP, VST2, VST3), in one library"
license = "MIT OR Apache-2.0"
publish = false

# The `cdylib` is the loadable plugin; the `rlib` lets a test crate depend on
# it so cargo builds the cdylib in the same invocation (one target-dir lock, no
# nested `cargo`). It names no tutti crate: the plugin is an independent
# witness of what a host does.
[lib]
crate-type = ["cdylib", "rlib"]

# VST2 shell: `tutti-vst2-author` for the authoring side. VST3 shell: the `vst3` crate's
# COM wrappers.
[dependencies]
clap-sys = "0.5"
tutti-vst2-author = { path = "../tutti-vst2-author" }
num-traits = "0.2"
vst3 = "0.3"
