[package]
name = "tutti-verify"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Renders audio cases to disk for the Python judges under py/ (`cargo xtask verify-audio`)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tutti-audio/tutti"
# A harness, never a library anyone depends on.
publish = false

[lints]
workspace = true

# One binary per area under `src/bin/`: each renders its cases to the
# directory it is given, and the matching `py/verify_<area>.py` judges them.
[dependencies]
tutti-codec = { path = "../../crates/tutti-codec", features = ["decode-wav", "encode-wav", "encode-flac", "encode-aiff", "encode-vorbis"] }
tutti-dsp = { path = "../../crates/tutti-dsp" }
tutti-export = { path = "../../crates/tutti-export" }
tutti-graph = { path = "../../crates/tutti-graph" }
tutti-measure = { path = "../../crates/tutti-measure" }
tutti-midi-protocol = { path = "../../crates/tutti-midi-protocol" }
tutti-nodes = { path = "../../crates/tutti-nodes", default-features = false, features = ["testing"] }
tutti-polysynth = { path = "../../crates/tutti-polysynth" }
tutti-sampler = { path = "../../crates/tutti-sampler", features = ["testing"] }
tutti-transport = { path = "../../crates/tutti-transport" }
tutti-types = { path = "../../crates/tutti-types" }
tutti-ump = { path = "../../crates/tutti-ump", default-features = false }
tutti-fixtures = { path = "../tutti-fixtures" }
